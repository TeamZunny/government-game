*{box-sizing:border-box}html,body{height:100%;margin:0;background:radial-gradient(circle at 20% 0,#2b1c13 0,#0a0705 48%,#050403 100%);color:var(--ink);font-family:var(--sans)}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer}.app{height:100vh;min-width:1120px;display:flex;flex-direction:column;padding:10px}.frame{height:100%;min-height:0;border:1px solid rgba(244,213,141,.28);border-radius:26px;background:linear-gradient(180deg,rgba(37,23,13,.96),rgba(10,7,5,.98));box-shadow:0 0 0 4px rgba(214,160,79,.08),0 22px 60px var(--shadow);display:flex;flex-direction:column;overflow:hidden}.top{height:84px;flex:0 0 auto;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:linear-gradient(180deg,rgba(63,39,21,.72),rgba(22,13,8,.92))}.brand{display:flex;gap:12px;align-items:center}.seal{width:46px;height:46px;border:2px solid rgba(244,213,141,.38);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#453018,#120b07);font-size:24px}.brandTitle{font-family:var(--serif);font-size:26px;color:var(--gold2);letter-spacing:.02em}.sub{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.topCenter{text-align:center}.chapter{font-size:12px;color:var(--gold2);text-transform:uppercase;letter-spacing:.2em}.topCenter h1{font-family:var(--serif);font-size:27px;margin:2px 0 0;color:var(--ink)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid rgba(244,213,141,.34);border-radius:999px;background:linear-gradient(180deg,#5e3d1e,#2d1b0f);color:var(--ink);padding:9px 13px;box-shadow:0 8px 18px rgba(0,0,0,.25)}.btn:hover,.btn:focus{outline:none;border-color:var(--gold2);filter:brightness(1.08)}.btn.secondary{background:rgba(255,255,255,.05)}.btn.ghost{background:transparent}.btn.danger{background:linear-gradient(180deg,#64322d,#301615)}.saveLine{font-size:12px;color:var(--muted)}.screen{flex:1;min-height:0;overflow:hidden}.landing,.quiz,.reveal{height:100%;overflow:auto;padding:28px;display:flex;justify-content:center;align-items:flex-start}.card{width:min(1040px,100%);background:rgba(25,16,10,.94);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.45);border-radius:22px;padding:24px}.card h1,.card h2,.stage h2{font-family:var(--serif);color:var(--gold2);margin:0 0 10px}.lead{font-size:17px;line-height:1.55;color:#f0dfbd}.muted{color:var(--muted);line-height:1.45}.small{font-size:12px}.hr{height:1px;background:var(--line);margin:14px 0}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.slot{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:142px;display:flex;flex-direction:column;justify-content:space-between}.slot b{color:var(--gold2)}.quizBox{max-width:920px}.progress{height:10px;background:#21150d;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 20px}.bar{height:100%;background:linear-gradient(90deg,#82552e,var(--gold2));width:0}.qtag{font-size:12px;color:var(--gold2);text-transform:uppercase;letter-spacing:.1em}.question{font-family:var(--serif);font-size:28px;line-height:1.25;margin:10px 0 18px}.answers{display:grid;gap:12px}.answer,.choice{width:100%;text-align:left;background:rgba(255,255,255,.045);color:var(--ink);border:1px solid rgba(244,213,141,.24);border-radius:16px;padding:14px 15px;line-height:1.38}.answer:hover,.choice:hover{background:rgba(244,213,141,.09);border-color:var(--gold2)}.game{height:100%;min-height:0;display:grid;grid-template-columns:285px minmax(510px,1fr) 330px;gap:14px;padding:14px}.panel{min-height:0;overflow:auto;background:rgba(17,11,7,.95);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.35)}.left,.right{padding:14px}.stage{padding:0;display:flex;flex-direction:column;overflow:hidden}.stageTop{padding:18px 18px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(67,43,25,.35),rgba(20,13,8,.2))}.stageBody{min-height:0;overflow:auto;padding:18px}.pill{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;color:var(--muted);margin:3px 3px 3px 0}.signal{border:1px solid rgba(244,213,141,.18);border-radius:14px;padding:10px 11px;margin:9px 0;background:rgba(255,255,255,.035)}.signalHead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.meter{height:7px;border-radius:99px;background:#21150e;border:1px solid var(--line);overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,#6e492a,var(--gold2));width:50%;transition:width .25s ease}.fill.bad{background:linear-gradient(90deg,#7b332e,#ce7568)}.roomBtn{display:block;width:100%;text-align:left;border:1px solid rgba(244,213,141,.18);background:rgba(255,255,255,.035);color:var(--ink);border-radius:14px;padding:10px;margin:8px 0}.roomBtn.active{border-color:var(--gold2);background:rgba(244,213,141,.11)}.roomHint{font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}.briefCard{border:1px solid rgba(244,213,141,.24);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border-radius:18px;padding:15px;margin-bottom:14px}.briefCard h3{font-family:var(--serif);font-size:22px;color:var(--gold2);margin:0 0 6px}.actionGrid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}.action{border:1px solid rgba(244,213,141,.23);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));padding:14px;text-align:left;color:var(--ink);min-height:132px}.action:hover{border-color:var(--gold2);background:rgba(244,213,141,.08)}.action h3{margin:0 0 6px;color:var(--gold2);font-family:var(--serif);font-size:21px}.empty{padding:24px;text-align:center;color:var(--muted)}.timelineItem,.person,.logItem,.deadline,.thread{border-left:2px solid rgba(244,213,141,.34);padding:8px 0 8px 10px;margin:8px 0;color:var(--muted);line-height:1.35}.timelineItem b,.person b,.deadline b,.thread b{color:var(--ink)}.phaseNow{color:var(--gold2)}.notes{font-family:ui-monospace,Menlo,Consolas,monospace;background:#110a06;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;max-height:280px;overflow:auto}.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;justify-content:center;padding:28px;z-index:20}.modalBackdrop.show{display:flex}.modal{width:min(930px,96vw);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#2c1c11,#100a07);border:1px solid rgba(244,213,141,.36);border-radius:22px;box-shadow:0 34px 90px rgba(0,0,0,.72);padding:22px}.sceneSpeaker{color:var(--gold2);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.sceneBody{font-family:var(--serif);font-size:23px;line-height:1.42;margin:10px 0 16px}.result{background:rgba(143,194,143,.09);border:1px solid rgba(143,194,143,.3);border-radius:14px;padding:12px;margin:12px 0;color:#deefd7}.warn{background:rgba(200,95,85,.1);border-color:rgba(200,95,85,.32)}.choiceHint{font-size:12px;color:var(--muted);margin-top:6px}.transcriptLine{border:1px solid rgba(244,213,141,.16);background:rgba(255,255,255,.035);border-radius:14px;padding:10px;margin:8px 0}.transcriptLine .cmd{color:var(--gold2);font-family:ui-monospace,Menlo,Consolas,monospace}.endScore{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.endScore div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px}.desktopNote{font-size:12px;color:var(--muted)}

.paTools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.paSearch{flex:1 1 230px;min-width:160px;background:#100b08;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 12px}.paRecords{max-height:50vh;overflow-y:auto;padding:4px 6px 4px 0;overscroll-behavior:contain}.paEntry{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:rgba(255,255,255,.025);overflow-wrap:anywhere}.paEntry h3{margin:5px 0 7px;font-size:17px}.paEntry .small{font-size:12px;color:var(--muted)}.paEntry p{white-space:pre-wrap;margin:4px 0 0;line-height:1.45}.paFilters{display:flex;gap:6px;flex-wrap:wrap}.paFilters button{padding:7px 10px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#2b1b10}.paFilters button[aria-pressed=true]{border-color:var(--gold2);background:#51351a}.paModal{width:min(1020px,96vw);max-height:88vh;overflow:hidden;display:flex;flex-direction:column}.paModal .paRecords{min-height:0;flex:1}.paFooter{padding-top:9px}.paIntro{margin:7px 0}.backupBtn{font-size:12px;padding:8px 9px}.resumeBox{border:1px solid var(--gold);padding:13px;border-radius:12px;background:rgba(214,160,79,.09);margin:0 0 12px}.desktopNote{overflow-wrap:anywhere}

<script>

const DATA = {"QUESTION_BANK":[{"id":"family-001","bucket":"family","tag":"Family Pressure","text":"A relative offers to call three influential people before you announce your campaign. What do you do first?","answers":[["Thank them, but ask them not to make any calls yet.",{"privacy":2,"cunning":1,"discipline":1}],["Ask exactly who they would call and what they would say.",{"curiosity":2,"policy":1,"patience":1}],["Accept the help and make a note that you may owe them later.",{"familyPressure":2,"loyalty":1,"privacy":1}],["Decline and tell your team you want no family help in the launch.",{"institution":2,"duty":1,"insider":1}]]},{"id":"family-002","bucket":"family","tag":"Private Concern","text":"Your spouse or partner says the campaign is already taking over life at home. What do you do first?","answers":[["Set aside a specific time that night to talk without campaign staff.",{"empathy":2,"ethics":1,"duty":1}],["Ask what changed this week that made it feel worse.",{"curiosity":2,"policy":1,"patience":1}],["Promise to keep home decisions separate from campaign decisions.",{"privacy":2,"discipline":1,"solitude":1}],["Explain why this early stretch has to be intense and temporary.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"family-003","bucket":"family","tag":"Old Reputation","text":"Someone warns that voters may judge you by your family name before they hear your ideas. What do you do?","answers":[["Prepare a simple answer that separates you from the family story.",{"showmanship":2,"media":1,"ambition":1}],["Ask which part of the family story worries people most.",{"curiosity":2,"policy":1,"patience":1}],["Lean on the family name where it helps, but stay cautious.",{"familyPressure":2,"loyalty":1,"privacy":1}],["Avoid the topic unless a voter brings it up directly.",{"privacy":2,"cunning":1,"discipline":1}]]},{"id":"family-004","bucket":"family","tag":"Unwanted Advice","text":"An older family friend gives you a donor list and says not to ask how they got it. What do you do?","answers":[["Refuse the list until you know how it was made.",{"institution":2,"duty":1,"insider":1}],["Look for names that repeat in other local political fights.",{"curiosity":2,"policy":1,"patience":1}],["Keep the list private while deciding whether it is useful.",{"shadow":2,"cunning":2,"privacy":1}],["Use the moment to tell supporters you will not be handled by old networks.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"family-005","bucket":"family","tag":"Public Comment","text":"A family member posts an online criticism of your opponent without checking with you. What do you do?","answers":[["Ask them to delete it and stop posting about the campaign.",{"discipline":2,"duty":1,"patience":1}],["Call your opponent privately if the comment crossed a line.",{"empathy":2,"ethics":1,"duty":1}],["Find out whether the post is spreading before reacting publicly.",{"media":2,"showmanship":1,"curiosity":1}],["Let it stand if it is accurate, but do not amplify it yourself.",{"cunning":2,"patience":1,"privacy":1}]]},{"id":"social-001","bucket":"social","tag":"At a Reception","text":"At a local reception, two people stop talking when you join their conversation. What do you do?","answers":[["Make ordinary small talk and see whether they relax.",{"coalition":2,"loyalty":1,"patience":1}],["Ask a neutral question about the event and watch who answers.",{"curiosity":2,"policy":1,"patience":1}],["Move on and ask someone else what tension you just walked into.",{"privacy":2,"cunning":1,"discipline":1}],["Use the pause to introduce yourself confidently to the group.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"social-002","bucket":"social","tag":"New Volunteer","text":"A new volunteer is well-liked but keeps interrupting quieter people during planning. What do you do?","answers":[["Pull them aside and ask them to help make room for others.",{"empathy":2,"ethics":1,"duty":1}],["Watch whether they interrupt only certain kinds of people.",{"curiosity":2,"policy":1,"patience":1}],["Give them a public-facing task that uses their energy away from planning.",{"showmanship":2,"media":1,"ambition":1}],["Keep them close until you understand what they want from the campaign.",{"privacy":2,"cunning":1,"discipline":1}]]},{"id":"social-003","bucket":"social","tag":"Uncomfortable Laugh","text":"At a neighborhood dinner, influential guests laugh at a cruel joke. What do you do?","answers":[["Say plainly that you do not want that kind of joke in your campaign space.",{"empathy":2,"ethics":1,"duty":1}],["Notice who laughed and who looked uncomfortable.",{"curiosity":2,"policy":1,"patience":1}],["Redirect the room with a different comment before the mood hardens.",{"coalition":2,"loyalty":1,"patience":1}],["Stay quiet in the moment and talk to the host afterward.",{"privacy":2,"cunning":1,"discipline":1}]]},{"id":"social-004","bucket":"social","tag":"Public Introduction","text":"A host introduces you with an impressive detail about your past that is not true. What do you do?","answers":[["Correct it immediately and keep your tone light.",{"institution":2,"duty":1,"insider":1}],["Thank the host, then clarify the truth when you begin speaking.",{"showmanship":2,"media":1,"ambition":1}],["Ask later who gave them the wrong detail.",{"curiosity":2,"policy":1,"patience":1}],["Let it pass if the mistake does not change the meaning of your work.",{"cunning":2,"patience":1,"privacy":1}]]},{"id":"social-005","bucket":"social","tag":"Quiet Person","text":"At a crowded meeting, a quiet attendee seems to understand the issue better than the speakers. What do you do?","answers":[["Find a calm moment to ask what they think everyone is missing.",{"curiosity":2,"policy":1,"patience":1}],["Ask if they would be willing to talk privately later.",{"privacy":2,"discipline":1,"solitude":1}],["Invite them into the discussion without putting them on the spot.",{"empathy":2,"ethics":1,"duty":1}],["Ask your organizer whether they are known in the community.",{"coalition":2,"loyalty":1,"patience":1}]]},{"id":"power-001","bucket":"power","tag":"Party Help","text":"A party official offers campaign help if you agree to coordinate through their office. What do you do?","answers":[["Ask what coordination would require before agreeing to anything.",{"curiosity":2,"policy":1,"patience":1}],["Accept a meeting but keep your campaign decisions separate for now.",{"privacy":2,"cunning":1,"discipline":1}],["Use their help if it gives you ballot access and basic support.",{"machine":2,"insider":1,"institution":1}],["Publicly emphasize that your campaign is independent.",{"outsider":2,"grit":1,"localism":1}]]},{"id":"power-002","bucket":"power","tag":"Serious People","text":"A donor says you should meet several influential local leaders before you make policy promises. What do you do?","answers":[["Ask which promises they are worried about and why.",{"curiosity":2,"policy":1,"patience":1}],["Take the meeting but bring someone who can take notes.",{"privacy":2,"cunning":1,"discipline":1}],["Meet them if it helps you understand the power structure.",{"money":2,"insider":1,"compromise":1}],["Tell your supporters that policy will not be pre-cleared by donors.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"power-003","bucket":"power","tag":"Gatekeeper","text":"A longtime local figure says you can win only if you stop challenging how things are usually done. What do you do?","answers":[["Ask for one example of a challenge they think would cost you.",{"curiosity":2,"policy":1,"patience":1}],["Refuse to trade away the reason you entered the race.",{"outsider":2,"grit":1,"localism":1}],["Look for a compromise that keeps access without giving up control.",{"cunning":2,"patience":1,"privacy":1}],["Use the warning to learn which rooms still matter.",{"machine":2,"insider":1,"institution":1}]]},{"id":"power-004","bucket":"power","tag":"Influential Endorsement","text":"An influential person offers an endorsement, but accepting it would upset some early supporters. What do you do?","answers":[["Ask your supporters what they would need to hear from you first.",{"coalition":2,"loyalty":1,"patience":1}],["Find out what the endorsement would obligate you to later.",{"curiosity":2,"policy":1,"patience":1}],["Accept if the endorsement helps you reach voters you cannot reach alone.",{"risk":2,"ambition":1,"showmanship":1}],["Decline and make the refusal part of your public identity.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"power-005","bucket":"power","tag":"Back Room Invite","text":"You are invited to a private meeting with people who usually avoid public questions. What do you do?","answers":[["Attend, but tell your team where you are going and why.",{"institution":2,"duty":1,"insider":1}],["Decline unless the purpose is stated clearly in advance.",{"discipline":2,"duty":1,"patience":1}],["Attend quietly and listen more than you speak.",{"shadow":2,"cunning":2,"privacy":1}],["Ask why they want the meeting to be private.",{"curiosity":2,"policy":1,"patience":1}]]},{"id":"money-001","bucket":"money","tag":"Printing Costs","text":"A business owner offers to pay for campaign printing without being publicly credited. What do you do?","answers":[["Ask for written terms before accepting anything.",{"institution":2,"duty":1,"insider":1}],["Find out whether they have funded other candidates the same way.",{"curiosity":2,"policy":1,"patience":1}],["Decline because hidden help creates hidden leverage.",{"empathy":2,"ethics":1,"duty":1}],["Accept only if campaign finance rules allow it and your treasurer approves.",{"money":2,"insider":1,"compromise":1}]]},{"id":"money-002","bucket":"money","tag":"Office Space","text":"A supporter offers free campaign office space and says rent can be discussed after you win. What do you do?","answers":[["Ask your treasurer whether the offer is legally safe.",{"institution":2,"duty":1,"insider":1}],["Ask why they are offering it now.",{"curiosity":2,"policy":1,"patience":1}],["Use the space temporarily while looking for a cleaner option.",{"cunning":2,"patience":1,"privacy":1}],["Decline and hold meetings in public spaces instead.",{"outsider":2,"grit":1,"localism":1}]]},{"id":"money-003","bucket":"money","tag":"Limited Budget","text":"This month you can afford either a field organizer or a stronger advertising push. What do you choose?","answers":[["Hire the organizer so more people can be reached directly.",{"volunteers":2,"localism":1,"empathy":1}],["Buy ads if voters still do not know who you are.",{"media":2,"showmanship":1,"curiosity":1}],["Delay the choice and ask which precincts are actually movable.",{"curiosity":2,"policy":1,"patience":1}],["Save the money until a clearer need appears.",{"discipline":2,"duty":1,"patience":1}]]},{"id":"money-004","bucket":"money","tag":"Donor Dinner","text":"A donor dinner would raise money, but it conflicts with a public school forum. What do you do?","answers":[["Attend the forum and accept the fundraising loss.",{"empathy":2,"ethics":1,"duty":1}],["Go to the donor dinner but send a trusted person to the forum.",{"money":2,"insider":1,"compromise":1}],["Try to split the evening and risk doing both imperfectly.",{"risk":2,"ambition":1,"showmanship":1}],["Ask which event will matter more three weeks from now.",{"curiosity":2,"policy":1,"patience":1}]]},{"id":"money-005","bucket":"money","tag":"Suspicious Gift","text":"A donor sends food and supplies for your volunteers without asking first. What do you do?","answers":[["Record the gift properly before anyone uses it.",{"institution":2,"duty":1,"insider":1}],["Ask the donor what they expect in return.",{"curiosity":2,"policy":1,"patience":1}],["Return it and explain that surprises create problems.",{"discipline":2,"duty":1,"patience":1}],["Use it if it helps volunteers and is legally allowed.",{"volunteers":2,"localism":1,"empathy":1}]]},{"id":"media-001","bucket":"media","tag":"Reporter Question","text":"A reporter asks whether your campaign is independent or controlled by local insiders. What do you do?","answers":[["Answer directly and give one specific example of independence.",{"showmanship":2,"media":1,"ambition":1}],["Ask what made them ask the question.",{"curiosity":2,"policy":1,"patience":1}],["Say you will not discuss private supporters by rumor.",{"privacy":2,"discipline":1,"solitude":1}],["Offer a short interview later with campaign records available.",{"institution":2,"duty":1,"insider":1}]]},{"id":"media-002","bucket":"media","tag":"Bad Headline","text":"A local headline makes your position sound harsher than what you actually said. What do you do?","answers":[["Ask for a correction with the exact quote attached.",{"institution":2,"duty":1,"insider":1}],["Post a calm clarification without attacking the reporter.",{"media":2,"showmanship":1,"curiosity":1}],["Call the reporter and ask how the headline happened.",{"curiosity":2,"policy":1,"patience":1}],["Ignore it unless voters begin repeating the mistake.",{"discipline":2,"duty":1,"patience":1}]]},{"id":"media-003","bucket":"media","tag":"Viral Clip","text":"A short video clip of you spreads online without the surrounding context. What do you do?","answers":[["Release the longer clip and explain the context plainly.",{"media":2,"showmanship":1,"curiosity":1}],["Ask your team who first pushed the short version.",{"curiosity":2,"policy":1,"patience":1}],["Use the attention to restate your point more clearly.",{"showmanship":2,"media":1,"ambition":1}],["Avoid feeding the story until you know whether it is growing.",{"privacy":2,"cunning":1,"discipline":1}]]},{"id":"media-004","bucket":"media","tag":"Friendly Columnist","text":"A columnist keeps praising you in a way that makes you sound connected to their agenda. What do you do?","answers":[["Thank them privately but keep public distance.",{"privacy":2,"discipline":1,"solitude":1}],["Ask why they are framing you that way.",{"curiosity":2,"policy":1,"patience":1}],["Accept the positive coverage and focus on reaching voters.",{"media":2,"showmanship":1,"curiosity":1}],["Make a public statement that nobody speaks for the campaign.",{"institution":2,"duty":1,"insider":1}]]},{"id":"media-005","bucket":"media","tag":"Online Rumor","text":"A rumor about your opponent is spreading online, and it might be true. What do you do?","answers":[["Do not repeat it until someone verifies it.",{"institution":2,"duty":1,"insider":1}],["Ask your team to find the original source.",{"curiosity":2,"policy":1,"patience":1}],["Tell supporters not to harass anyone over it.",{"empathy":2,"ethics":1,"duty":1}],["Prepare a response in case a reporter asks you about it.",{"media":2,"showmanship":1,"curiosity":1}]]},{"id":"institution-001","bucket":"institution","tag":"Moved Meeting","text":"A public meeting is moved to a smaller room with very little notice. What do you do?","answers":[["Ask who approved the move and when notice was posted.",{"curiosity":2,"policy":1,"patience":1}],["Request a larger room or a second public session.",{"institution":2,"duty":1,"insider":1}],["Help affected residents submit comments another way.",{"empathy":2,"ethics":1,"duty":1}],["Call attention to the move during your next public remarks.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"institution-002","bucket":"institution","tag":"Missing Minutes","text":"Official meeting minutes leave out the part of the meeting that upset people most. What do you do?","answers":[["Compare the minutes with recordings and attendee notes.",{"curiosity":2,"policy":1,"patience":1}],["Ask for the minutes to be corrected before the next vote.",{"institution":2,"duty":1,"insider":1}],["Tell residents exactly how to challenge the record.",{"empathy":2,"ethics":1,"duty":1}],["Use the omission as proof that the process needs sunlight.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"institution-003","bucket":"institution","tag":"Fast Vote","text":"A committee wants to vote on a proposal before the public has had time to read it. What do you do?","answers":[["Push to delay the vote until people have time to read it.",{"institution":2,"duty":1,"insider":1}],["Ask why the timeline became urgent.",{"curiosity":2,"policy":1,"patience":1}],["Warn the room that rushing will damage trust.",{"showmanship":2,"media":1,"ambition":1}],["Look for the one section that would be hardest to reverse later.",{"cunning":2,"patience":1,"privacy":1}]]},{"id":"institution-004","bucket":"institution","tag":"Confusing Budget","text":"A public budget summary is available online, but it is hard for ordinary residents to understand. What do you do?","answers":[["Ask staff to explain the unclear lines in plain language.",{"institution":2,"duty":1,"insider":1}],["Compare the summary to last year and look for major changes.",{"curiosity":2,"policy":1,"patience":1}],["Hold a public explainer before asking people to react.",{"empathy":2,"ethics":1,"duty":1}],["Point out that inaccessible information is not real transparency.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"institution-005","bucket":"institution","tag":"Old Procedure","text":"A senior official defends a questionable shortcut by saying, “This is how it has always worked.” What do you do?","answers":[["Ask where the procedure is written down.",{"curiosity":2,"policy":1,"patience":1}],["Refuse to support it until it is reviewed openly.",{"institution":2,"duty":1,"insider":1}],["Ask who is harmed when the shortcut is used.",{"empathy":2,"ethics":1,"duty":1}],["Use the moment to show that old habits are not neutral.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"empathy-001","bucket":"empathy","tag":"Parent Complaint","text":"A parent says her child’s bus route changed three times, and no one will explain why. What do you do first?","answers":[["Ask for the child’s daily experience before asking for documents.",{"empathy":2,"ethics":1,"duty":1}],["Request the route change records and the reason for each change.",{"curiosity":2,"policy":1,"patience":1}],["Ask other parents whether the same thing happened to them.",{"coalition":2,"loyalty":1,"patience":1}],["Raise the issue publicly if the district keeps avoiding it.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"empathy-002","bucket":"empathy","tag":"Teacher Supplies","text":"A teacher says supply orders look fine on paper, but classrooms are still missing basic materials. What do you do?","answers":[["Ask what students are going without right now.",{"empathy":2,"ethics":1,"duty":1}],["Trace the supply order and budget line.",{"curiosity":2,"policy":1,"patience":1}],["Ask teachers to document the pattern together.",{"coalition":2,"loyalty":1,"patience":1}],["Make the shortage visible at the next public meeting.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"empathy-003","bucket":"empathy","tag":"Student Voice","text":"A student says adults discuss school safety without asking students what actually feels unsafe. What do you do?","answers":[["Ask the student what adults keep missing.",{"empathy":2,"ethics":1,"duty":1}],["Set up a way for students to speak without being singled out.",{"institution":2,"duty":1,"insider":1}],["Check whether the safety data matches student concerns.",{"curiosity":2,"policy":1,"patience":1}],["Mention the gap in your next public answer.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"empathy-004","bucket":"empathy","tag":"Staff Warning","text":"A cafeteria worker says a new vendor has made the food worse and the work harder. What do you do?","answers":[["Ask what changed day to day after the vendor switch.",{"empathy":2,"ethics":1,"duty":1}],["Review the vendor contract and complaint history.",{"curiosity":2,"policy":1,"patience":1}],["Ask other staff whether they can confirm the problem.",{"coalition":2,"loyalty":1,"patience":1}],["Bring the issue to the board if private channels fail.",{"institution":2,"duty":1,"insider":1}]]},{"id":"empathy-005","bucket":"empathy","tag":"Quiet Neighborhood","text":"A neighborhood has many complaints but very few residents speak at public meetings. What do you do?","answers":[["Go there instead of waiting for residents to come to you.",{"empathy":2,"ethics":1,"duty":1}],["Ask what barriers keep people from attending meetings.",{"curiosity":2,"policy":1,"patience":1}],["Recruit trusted local people to host smaller conversations.",{"coalition":2,"loyalty":1,"patience":1}],["Change your public message to include that neighborhood by name.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"risk-001","bucket":"risk","tag":"Open Seat","text":"A seat opens unexpectedly, and several people urge you to run before the deadline passes. What do you do?","answers":[["Ask what deadline forces the decision.",{"curiosity":2,"policy":1,"patience":1}],["Jump in before the opening closes.",{"risk":2,"ambition":1,"showmanship":1}],["Meet your closest supporters before deciding.",{"coalition":2,"loyalty":1,"patience":1}],["Wait if running now would make you dependent on the wrong people.",{"discipline":2,"duty":1,"patience":1}]]},{"id":"risk-002","bucket":"risk","tag":"Opponent Mistake","text":"Your opponent makes a major mistake during a public forum. What do you do next?","answers":[["Press the advantage while voters are paying attention.",{"risk":2,"ambition":1,"showmanship":1}],["Stay focused on your own answer and let the mistake sit.",{"discipline":2,"duty":1,"patience":1}],["Ask whether the mistake reveals a larger problem.",{"curiosity":2,"policy":1,"patience":1}],["Avoid piling on if the mistake hurt someone vulnerable.",{"empathy":2,"ethics":1,"duty":1}]]},{"id":"risk-003","bucket":"risk","tag":"Early Endorsement","text":"A major group offers an endorsement before you fully understand their agenda. What do you do?","answers":[["Ask for their priorities in writing before accepting.",{"curiosity":2,"policy":1,"patience":1}],["Accept quickly if the endorsement changes the race.",{"risk":2,"ambition":1,"showmanship":1}],["Consult supporters who would be affected by the group’s agenda.",{"coalition":2,"loyalty":1,"patience":1}],["Decline until you know whether their support has strings.",{"institution":2,"duty":1,"insider":1}]]},{"id":"risk-004","bucket":"risk","tag":"Public Protest","text":"A protest interrupts an event where you planned to give a careful prepared speech. What do you do?","answers":[["Leave the script and respond to the protest directly.",{"risk":2,"ambition":1,"showmanship":1}],["Ask a protester what they need people to understand.",{"empathy":2,"ethics":1,"duty":1}],["Find out who organized it and why now.",{"curiosity":2,"policy":1,"patience":1}],["Keep the event moving and offer a separate meeting.",{"discipline":2,"duty":1,"patience":1}]]},{"id":"risk-005","bucket":"risk","tag":"Bad Poll","text":"A private poll shows you are behind, and one risky message might change the race. What do you do?","answers":[["Test the message with trusted people before using it.",{"curiosity":2,"policy":1,"patience":1}],["Use it now because safe choices are not working.",{"risk":2,"ambition":1,"showmanship":1}],["Change field strategy instead of message strategy.",{"volunteers":2,"localism":1,"empathy":1}],["Reject it if it makes promises you cannot keep.",{"institution":2,"duty":1,"insider":1}]]},{"id":"privacy-001","bucket":"privacy","tag":"Personal Story","text":"A staffer says sharing a painful personal story would help voters trust you. What do you do?","answers":[["Share only the part that connects directly to the issue.",{"showmanship":2,"media":1,"ambition":1}],["Keep it private unless you can tell it without feeling used.",{"privacy":2,"discipline":1,"solitude":1}],["Ask who benefits politically from making it public.",{"curiosity":2,"policy":1,"patience":1}],["Tell a different story that protects other people involved.",{"empathy":2,"ethics":1,"duty":1}]]},{"id":"privacy-002","bucket":"privacy","tag":"Home Boundary","text":"A reporter asks to film a short campaign segment inside your home. What do you do?","answers":[["Decline and offer a public location instead.",{"privacy":2,"discipline":1,"solitude":1}],["Allow it only with clear limits on what can be filmed.",{"institution":2,"duty":1,"insider":1}],["Ask what story they are trying to tell with your home.",{"curiosity":2,"policy":1,"patience":1}],["Accept if the campaign needs voters to see you more personally.",{"media":2,"showmanship":1,"curiosity":1}]]},{"id":"privacy-003","bucket":"privacy","tag":"Old Friend","text":"An old friend knows something embarrassing about you and asks for a campaign job. What do you do?","answers":[["Refuse to hire someone because they have leverage.",{"discipline":2,"duty":1,"patience":1}],["Ask directly whether they are threatening you.",{"curiosity":2,"policy":1,"patience":1}],["Offer a non-sensitive volunteer role if they are qualified.",{"cunning":2,"patience":1,"privacy":1}],["Tell a trusted person about the risk before it grows.",{"coalition":2,"loyalty":1,"patience":1}]]},{"id":"privacy-004","bucket":"privacy","tag":"Late Night Doubt","text":"You suspect a helpful person may have a hidden reason for helping your campaign. What do you do?","answers":[["Write down the concern and check facts in the morning.",{"discipline":2,"duty":1,"patience":1}],["Ask someone discreet to look into the connection.",{"curiosity":2,"policy":1,"patience":1}],["Distance them from sensitive work until you know more.",{"privacy":2,"discipline":1,"solitude":1}],["Ignore the feeling unless something concrete appears.",{"solitude":2,"privacy":1,"discipline":1}]]},{"id":"privacy-005","bucket":"privacy","tag":"Campaign Access","text":"A volunteer keeps asking for private planning documents that are not needed for their role. What do you do?","answers":[["Limit access to people with a clear role.",{"institution":2,"duty":1,"insider":1}],["Ask why they need the documents.",{"curiosity":2,"policy":1,"patience":1}],["Give them a different task and watch how they respond.",{"cunning":2,"patience":1,"privacy":1}],["Remove them if the request feels unsafe.",{"privacy":2,"discipline":1,"solitude":1}]]},{"id":"curiosity-001","bucket":"curiosity","tag":"Missing File","text":"A reporter says public records may be missing but will not share their file with you. What do you do?","answers":[["Ask which office should have the records and when they disappeared.",{"curiosity":2,"policy":1,"patience":1}],["File your own records request before discussing it publicly.",{"institution":2,"duty":1,"insider":1}],["Ask whether anyone could be harmed if the story is rushed.",{"empathy":2,"ethics":1,"duty":1}],["Prepare a public transparency message without naming the reporter.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"curiosity-002","bucket":"curiosity","tag":"Repeated Name","text":"The same company name comes up in three separate political conversations. What do you do?","answers":[["Start a list of where the name appears and who mentions it.",{"curiosity":2,"policy":1,"patience":1}],["Ask your treasurer whether the company donated to anyone.",{"institution":2,"duty":1,"insider":1}],["Ask community members what they know about the company.",{"coalition":2,"loyalty":1,"patience":1}],["Keep the pattern private until you know whether it matters.",{"privacy":2,"discipline":1,"solitude":1}]]},{"id":"curiosity-003","bucket":"curiosity","tag":"Odd Timing","text":"A policy proposal appears soon after a private donor meeting. What do you do?","answers":[["Compare the proposal to what the donor has publicly supported.",{"curiosity":2,"policy":1,"patience":1}],["Ask who drafted the proposal.",{"institution":2,"duty":1,"insider":1}],["Warn your team not to repeat the donor’s language blindly.",{"discipline":2,"duty":1,"patience":1}],["Raise a public question about the timing.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"curiosity-004","bucket":"curiosity","tag":"Changed Archive","text":"During a dispute over a public contract, old meeting notes disappear from the town’s online records archive. What do you do first?","answers":[["Look for saved copies, recordings, or other public records.",{"curiosity":2,"policy":1,"patience":1}],["Ask the office why those meeting notes were removed.",{"institution":2,"duty":1,"insider":1}],["Tell affected residents how to save any records they still have.",{"empathy":2,"ethics":1,"duty":1}],["Wait to accuse anyone until you know whether it was routine or suspicious.",{"discipline":2,"duty":1,"patience":1}]]},{"id":"curiosity-005","bucket":"curiosity","tag":"Too Helpful","text":"Someone gives you a useful tip, but the timing seems suspiciously perfect. What do you do?","answers":[["Verify the tip from a second source before using it.",{"curiosity":2,"policy":1,"patience":1}],["Ask why they brought it to you instead of someone else.",{"privacy":2,"cunning":1,"discipline":1}],["Use it only if it can be confirmed publicly.",{"institution":2,"duty":1,"insider":1}],["Keep it in reserve as leverage if the facts check out.",{"shadow":2,"cunning":2,"privacy":1}]]},{"id":"coalition-001","bucket":"coalition","tag":"Two Groups","text":"Teachers and parents both want change but blame each other for the problem. What do you do?","answers":[["Meet both groups separately before putting them in one room.",{"coalition":2,"loyalty":1,"patience":1}],["Find the one issue both groups describe the same way.",{"curiosity":2,"policy":1,"patience":1}],["Publicly name the shared goal and avoid assigning blame.",{"showmanship":2,"media":1,"ambition":1}],["Focus first on the group with less power in the process.",{"empathy":2,"ethics":1,"duty":1}]]},{"id":"coalition-002","bucket":"coalition","tag":"Volunteer Conflict","text":"Two reliable volunteers disagree about whether the campaign is moving too slowly. What do you do?","answers":[["Ask each what risk they think the other is missing.",{"curiosity":2,"policy":1,"patience":1}],["Give them separate responsibilities that fit their strengths.",{"coalition":2,"loyalty":1,"patience":1}],["Choose a direction clearly so the team stops drifting.",{"discipline":2,"duty":1,"patience":1}],["Use the disagreement to explain your strategy to the whole team.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"coalition-003","bucket":"coalition","tag":"Unlikely Ally","text":"A group that usually opposes candidates like you offers help on one shared issue. What do you do?","answers":[["Accept help only on the issue where you genuinely agree.",{"coalition":2,"loyalty":1,"patience":1}],["Ask what they expect after the issue is over.",{"curiosity":2,"policy":1,"patience":1}],["Decline if the alliance would confuse your core supporters.",{"discipline":2,"duty":1,"patience":1}],["Use the alliance to show you can work beyond your lane.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"coalition-004","bucket":"coalition","tag":"Left Out","text":"A community leader says your campaign has ignored their neighborhood. What do you do?","answers":[["Go there and listen before asking for support.",{"empathy":2,"ethics":1,"duty":1}],["Ask what decision made them feel ignored.",{"curiosity":2,"policy":1,"patience":1}],["Invite them into planning so the fix is not symbolic.",{"coalition":2,"loyalty":1,"patience":1}],["Publicly acknowledge the miss and explain what changes now.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"coalition-005","bucket":"coalition","tag":"Shared Stage","text":"Three groups want to support you, but one refuses to share a stage with another. What do you do?","answers":[["Hold separate events and keep the issue coalition intact.",{"coalition":2,"loyalty":1,"patience":1}],["Ask what specific harm caused the refusal.",{"curiosity":2,"policy":1,"patience":1}],["Choose the group most affected by the issue.",{"empathy":2,"ethics":1,"duty":1}],["Delay the event rather than fake unity.",{"discipline":2,"duty":1,"patience":1}]]},{"id":"ambition-001","bucket":"ambition","tag":"First Applause","text":"A crowd applauds before you finish speaking, and you can feel the room turning toward you. What do you do next?","answers":[["Finish the point instead of chasing the applause.",{"discipline":2,"duty":1,"patience":1}],["Use the energy to ask people to take a concrete action.",{"showmanship":2,"media":1,"ambition":1}],["Notice who still looks unconvinced.",{"curiosity":2,"policy":1,"patience":1}],["Push harder because the audience is responding well.",{"risk":2,"ambition":1,"showmanship":1}]]},{"id":"ambition-002","bucket":"ambition","tag":"Bigger Race","text":"Someone says you are wasting your time on a small office and should aim higher. What do you do?","answers":[["Ask what problem they think the higher office would actually solve.",{"curiosity":2,"policy":1,"patience":1}],["Say this office matters and treat it seriously.",{"duty":2,"institution":1,"discipline":1}],["Consider whether the larger path is opening earlier than expected.",{"risk":2,"ambition":1,"showmanship":1}],["Ask who benefits if you leave the local race.",{"privacy":2,"cunning":1,"discipline":1}]]},{"id":"ambition-003","bucket":"ambition","tag":"Name Recognition","text":"People are starting to recognize you in public. What do you do with the attention?","answers":[["Use it to draw more people into campaign work.",{"volunteers":2,"localism":1,"empathy":1}],["Keep your routine normal so attention does not control you.",{"discipline":2,"duty":1,"patience":1}],["Study which people recognize you and why.",{"curiosity":2,"policy":1,"patience":1}],["Lean into it and sharpen the public image.",{"media":2,"showmanship":1,"curiosity":1}]]},{"id":"ambition-004","bucket":"ambition","tag":"Flattering Offer","text":"A consultant says you have “real future potential” if you let professionals reshape your message. What do you do?","answers":[["Ask what part of your current message they would remove first.",{"curiosity":2,"policy":1,"patience":1}],["Accept help only if the core message stays yours.",{"institution":2,"duty":1,"insider":1}],["Try the professional approach if it helps you win.",{"risk":2,"ambition":1,"showmanship":1}],["Reject the offer if it makes you sound less honest.",{"empathy":2,"ethics":1,"duty":1}]]},{"id":"ambition-005","bucket":"ambition","tag":"Opponent Attack","text":"Your opponent attacks you by name for the first time. What do you do?","answers":[["Treat it as proof you are now part of the race and respond calmly.",{"showmanship":2,"media":1,"ambition":1}],["Ask why they chose that attack instead of another one.",{"curiosity":2,"policy":1,"patience":1}],["Answer only if voters are likely to hear the attack.",{"discipline":2,"duty":1,"patience":1}],["Hit back harder so they regret making you the target.",{"risk":2,"ambition":1,"showmanship":1}]]},{"id":"shadow-001","bucket":"shadow","tag":"Damaging Tip","text":"Someone offers damaging information about your opponent but will not explain how they got it. What do you do?","answers":[["Refuse to use it unless the source and facts can be verified.",{"institution":2,"duty":1,"insider":1}],["Ask what they want in exchange before taking anything.",{"curiosity":2,"policy":1,"patience":1}],["Keep the lead private while checking whether it is true.",{"shadow":2,"cunning":2,"privacy":1}],["Reject it because campaigns become what they reward.",{"empathy":2,"ethics":1,"duty":1}]]},{"id":"shadow-002","bucket":"shadow","tag":"Anonymous Account","text":"An anonymous online account offers to spread a rumor that would help your campaign. What do you do?","answers":[["Tell your team not to coordinate with anonymous rumor accounts.",{"institution":2,"duty":1,"insider":1}],["Ask whether the account has contacted other campaigns.",{"curiosity":2,"policy":1,"patience":1}],["Do nothing publicly but watch what the account posts next.",{"privacy":2,"cunning":1,"discipline":1}],["Use the rumor only if it becomes public without your help.",{"cunning":2,"patience":1,"privacy":1}]]},{"id":"shadow-003","bucket":"shadow","tag":"Pressure Option","text":"A supporter says they know a donor’s private weakness and could use it to make the donor back off. What do you do?","answers":[["Refuse to threaten private harm for political advantage.",{"empathy":2,"ethics":1,"duty":1}],["Ask whether the weakness is connected to public misconduct.",{"curiosity":2,"policy":1,"patience":1}],["Keep the information away from campaign staff.",{"privacy":2,"discipline":1,"solitude":1}],["Consider using it only if the donor attacks first.",{"shadow":2,"cunning":2,"privacy":1}]]},{"id":"shadow-004","bucket":"shadow","tag":"Quiet Favor","text":"A political fixer says they can make a paperwork problem disappear. What do you do?","answers":[["Ask for the legal process instead of a favor.",{"institution":2,"duty":1,"insider":1}],["Ask what the fixer would expect later.",{"curiosity":2,"policy":1,"patience":1}],["Use the help if the paperwork problem is unfair and urgent.",{"cunning":2,"patience":1,"privacy":1}],["Decline because disappearing problems usually return as debts.",{"discipline":2,"duty":1,"patience":1}]]},{"id":"shadow-005","bucket":"shadow","tag":"Leaked Memo","text":"A leaked memo could hurt a rival, but it also exposes private staff messages. What do you do?","answers":[["Verify whether the memo reveals public misconduct.",{"curiosity":2,"policy":1,"patience":1}],["Do not use private staff messages as campaign weapons.",{"empathy":2,"ethics":1,"duty":1}],["Give it to a reporter only if the public interest is clear.",{"institution":2,"duty":1,"insider":1}],["Hold it quietly in case the rival escalates.",{"shadow":2,"cunning":2,"privacy":1}]]},{"id":"duty-001","bucket":"duty","tag":"Campaign vs Job","text":"A campaign event conflicts with an official duty you already agreed to perform. What do you do?","answers":[["Do the official duty and accept the campaign cost.",{"duty":2,"institution":1,"discipline":1}],["Ask whether the duty can be rescheduled without harming anyone.",{"institution":2,"duty":1,"insider":1}],["Send a trusted campaign person to the event in your place.",{"coalition":2,"loyalty":1,"patience":1}],["Choose the campaign event if missing it would end the race.",{"risk":2,"ambition":1,"showmanship":1}]]},{"id":"duty-002","bucket":"duty","tag":"Unpopular Fix","text":"The policy choice you think is right will probably be unpopular at first. What do you do?","answers":[["Explain the tradeoff clearly and take the short-term hit.",{"duty":2,"institution":1,"discipline":1}],["Find out which part of the policy people fear most.",{"curiosity":2,"policy":1,"patience":1}],["Delay the proposal until you can build support.",{"coalition":2,"loyalty":1,"patience":1}],["Change the message so people hear the benefit first.",{"media":2,"showmanship":1,"curiosity":1}]]},{"id":"duty-003","bucket":"duty","tag":"Tired Team","text":"Your volunteers are exhausted, but the campaign calendar says you need another big push. What do you do?","answers":[["Cancel something and protect the people doing the work.",{"empathy":2,"ethics":1,"duty":1}],["Ask which activity is actually producing results.",{"curiosity":2,"policy":1,"patience":1}],["Shift to smaller tasks that people can sustain.",{"discipline":2,"duty":1,"patience":1}],["Push through if the deadline is truly decisive.",{"risk":2,"ambition":1,"showmanship":1}]]},{"id":"duty-004","bucket":"duty","tag":"Constituent Request","text":"A constituent asks for help with a problem outside your campaign’s main issue. What do you do?","answers":[["Listen and connect them to someone who can help.",{"empathy":2,"ethics":1,"duty":1}],["Ask whether the request points to a larger pattern.",{"curiosity":2,"policy":1,"patience":1}],["Set a boundary so the campaign does not become casework chaos.",{"discipline":2,"duty":1,"patience":1}],["Use the request to broaden your public agenda.",{"showmanship":2,"media":1,"ambition":1}]]},{"id":"duty-005","bucket":"duty","tag":"Promise Pressure","text":"A supporter wants you to promise more than you know you can deliver. What do you do?","answers":[["Refuse to make the promise and explain what you can do.",{"duty":2,"institution":1,"discipline":1}],["Ask what outcome they need, not what slogan they want.",{"curiosity":2,"policy":1,"patience":1}],["Offer a smaller commitment that you can actually keep.",{"institution":2,"duty":1,"insider":1}],["Make the bigger promise if it is necessary to build momentum.",{"risk":2,"ambition":1,"showmanship":1}]]},{"id":"rules-001","bucket":"rules","tag":"Rules and Legitimacy","text":"The election office quietly changes a ballot-access deadline. Your aide says you can probably still file, but a rival may be excluded. What do you do first?","answers":[["Ask the election office for the written rule, the appeal process, and the same notice for all campaigns.",{"institution":2,"rules":2,"discipline":1}],["Use the confusion to file quickly before anyone else notices.",{"cunning":2,"risk":1,"insider":1}],["Call a reporter before checking the rule.",{"press":2,"risk":1}],["Ignore it because school-board races are small.",{"fatigue":1,"compliance":-2}]]},{"id":"rules-002","bucket":"rules","tag":"Voter Access","text":"A senior volunteer says one apartment complex is hard to canvass and “probably not worth it.” The residents there rarely vote. What is your move?","answers":[["Ask Field to check access, language needs, and realistic contact methods before deciding.",{"inclusion":2,"field":2,"patience":1}],["Skip it and spend the day in easier neighborhoods.",{"efficiency":2,"inclusion":-1}],["Send a loud mailer instead of talking to anyone there.",{"money":-1,"message":1}],["Accuse your volunteer of bad motives in front of the team.",{"integrity":1,"team":-2}]]},{"id":"field-001","bucket":"field","tag":"Targeting","text":"Your field lead shows three precincts: one loves you, one dislikes you, and one is split. Where should the campaign spend the next volunteer shift?","answers":[["The split precinct, with a message tailored to undecided households.",{"field":2,"strategy":2}],["The precinct that already loves you, because applause feels good.",{"morale":1,"strategy":-1}],["The precinct that dislikes you, to prove you are not afraid.",{"courage":1,"field":-1}],["Divide everyone equally because it looks fair on paper.",{"institution":1,"efficiency":-1}]]},{"id":"field-002","bucket":"field","tag":"GOTV Discipline","text":"A supporter asks for a ride to vote, but the volunteer with the car was scheduled for phone bank. What do you prioritize?","answers":[["Create a rides list and reassign one trained volunteer without collapsing the phone bank.",{"field":2,"discipline":2,"inclusion":1}],["Tell the supporter to find a ride because phone bank numbers matter more.",{"efficiency":1,"trust":-1}],["Cancel the phone bank and turn everyone into drivers.",{"empathy":1,"discipline":-2}],["Ask the opponent’s campaign if they can help.",{"civility":2,"risk":1}]]},{"id":"message-001","bucket":"message","tag":"Message Box","text":"Your opponent calls you inexperienced. Your first instinct is to say they are old and stale. What do you do?","answers":[["Answer the contrast with your own reason for running and one concrete school issue.",{"message":2,"discipline":2}],["Hit back harder and make the clip go viral.",{"press":2,"trust":-1}],["Ignore it entirely and hope no one saw it.",{"patience":1,"message":-1}],["Ask your team to build a message box before responding.",{"research":2,"message":1}]]},{"id":"message-002","bucket":"message","tag":"Plain Language","text":"Your policy note says “multi-stakeholder instructional infrastructure modernization.” The forum is tonight. What do you say instead?","answers":[["“Every classroom should have working materials before teachers have to improvise.”",{"message":2,"policy":1,"clarity":2}],["Keep the phrase because it sounds serious.",{"insider":1,"message":-2}],["Drop policy details and only talk about hope.",{"charisma":1,"policy":-1}],["Let your consultant write it during the car ride.",{"risk":1,"fatigue":1}]]},{"id":"press-001","bucket":"press","tag":"Rapid Response","text":"A rumor spreads that you missed budget meetings you never knew existed. The local paper asks for comment in twenty minutes. What do you do?","answers":[["Verify records, give a short factual statement, and promise documents by a specific time.",{"press":2,"research":2,"discipline":1}],["Call the rumor malicious before checking anything.",{"press":1,"risk":2}],["Say “no comment” and avoid the paper.",{"privacy":1,"trust":-1}],["Post screenshots of private texts to prove your point.",{"cunning":1,"compliance":-2}]]},{"id":"press-002","bucket":"press","tag":"Earned Media","text":"A reporter wants a human story, not another statistic. You have one parent’s permission to share their concern. What do you do?","answers":[["Tell the parent’s story, connect it to one policy, and keep the family’s dignity intact.",{"press":2,"empathy":2,"privacy":1}],["Use the story and add dramatic details to make it stronger.",{"press":1,"integrity":-2}],["Refuse all stories and only cite district spreadsheets.",{"policy":1,"message":-1}],["Let the reporter talk to any parent without prep.",{"transparency":1,"risk":1}]]},{"id":"finance-001","bucket":"finance","tag":"Call Time","text":"The treasurer says you need money by Friday. The candidate hates fundraising calls. What do you do?","answers":[["Block call time, prepare honest asks, and protect the candidate’s energy afterward.",{"money":2,"discipline":2,"fatigue":-1}],["Cancel calls and hope volunteers cover the gap.",{"morale":1,"money":-2}],["Accept a questionable shortcut from a contractor.",{"money":2,"compliance":-3,"risk":2}],["Make staff do the calls pretending to be you.",{"money":1,"integrity":-2}]]},{"id":"finance-002","bucket":"finance","tag":"Compliance","text":"A donor offers to pay for palm cards directly so it “doesn’t hit the campaign account.” What do you do?","answers":[["Send it to the treasurer, record it properly or decline it.",{"compliance":3,"discipline":1}],["Accept because palm cards are cheap.",{"money":1,"compliance":-3}],["Ask for cash instead so there is less paperwork.",{"cunning":1,"compliance":-4}],["Tell the donor to support the teachers’ group instead.",{"coalition":1,"risk":1}]]},{"id":"leadership-001","bucket":"leadership","tag":"Candidate Energy","text":"You are exhausted before a student forum. Your manager offers to cut prep short. What do you choose?","answers":[["Do a short, focused prep on three likely questions and then rest ten minutes.",{"discipline":2,"message":1,"fatigue":-1}],["Skip prep and trust your instincts.",{"confidence":1,"risk":1}],["Overprep for two more hours and arrive drained.",{"policy":1,"fatigue":2}],["Cancel the forum.",{"fatigue":-2,"trust":-2}]]},{"id":"leadership-002","bucket":"leadership","tag":"Team Conflict","text":"Field and Press disagree in front of volunteers. Field wants door shifts; Press wants bodies at a camera-ready rally. What do you do?","answers":[["Separate the goals, assign minimum field coverage, and send a smaller visual team to the rally.",{"leadership":2,"team":2,"field":1}],["Let them fight because urgency creates energy.",{"risk":2,"team":-2}],["Choose Press because rallies feel like momentum.",{"press":1,"field":-2}],["Choose Field and tell Press to stop caring about optics.",{"field":1,"press":-1}]]},{"id":"digital-001","bucket":"digital","tag":"Online Organizing","text":"A post is getting engagement, but the comments are full of questions no one is answering. What is the campaign’s next move?","answers":[["Assign one trained person to answer, collect recurring concerns, and redirect people to sign up.",{"digital":2,"field":1,"message":1}],["Celebrate the engagement and ignore the comments.",{"press":1,"trust":-1}],["Delete every hard question.",{"control":2,"trust":-2}],["Let volunteers argue freely in the thread.",{"energy":1,"discipline":-2}]]},{"id":"digital-002","bucket":"digital","tag":"Clip Politics","text":"A ten-second clip of you hesitating is circulating. The full answer was reasonable. What do you do?","answers":[["Post the fuller answer, then restate the point in one clean sentence.",{"press":2,"message":2}],["Demand everyone delete the clip.",{"control":1,"risk":2}],["Make a joke if the issue is low stakes, but not if it sounds dismissive.",{"judgment":2,"charisma":1}],["Blame the student who filmed it.",{"trust":-3,"press":-1}]]},{"id":"opposition-001","bucket":"opposition","tag":"Opponent Research","text":"Research finds your opponent promised a school safety plan four years ago, then never funded it. How do you use it?","answers":[["Contrast the promise with the record, then present your own realistic next step.",{"research":2,"message":2}],["Call them a fraud repeatedly.",{"press":1,"trust":-1}],["Save it for the last day so they cannot respond.",{"cunning":2,"risk":1}],["Do not mention it because conflict feels rude.",{"civility":1,"message":-1}]]},{"id":"electionday-001","bucket":"electionday","tag":"Poll Monitoring","text":"A volunteer reports confusion at one polling place. No one has confirmed a violation. What do you do?","answers":[["Send a trained observer, document facts, and contact the election office if needed.",{"rules":2,"field":2,"discipline":1}],["Tell supporters the election is being stolen.",{"pressure":2,"trust":-3}],["Ignore it because rumors happen.",{"fatigue":1,"field":-1}],["Send the candidate to confront poll workers.",{"visibility":1,"compliance":-2}]]},{"id":"governing-001","bucket":"governing","tag":"Transition Mindset","text":"Polls show you might win. A volunteer asks what happens the morning after Election Day. What do you do?","answers":[["Quietly prepare a first-100-days notebook without acting entitled to the office.",{"institution":2,"policy":2,"humility":1}],["Announce your future staff list at the rally.",{"confidence":1,"trust":-1}],["Say governing can wait until after the party.",{"fatigue":1,"policy":-2}],["Ask supporters to pressure district staff now.",{"pressure":2,"institution":-2}]]},{"id":"design-001","bucket":"attention","tag":"Briefing Time","text":"Your morning brief has four sections, but you only have time to read one before leaving for a voter walk. What do you open first?","answers":[["The map showing which doors were actually reached yesterday.",{"field":2,"research":1,"discipline":1}],["The short notes from voters who sounded undecided.",{"empathy":2,"coalition":1,"message":1}],["The rules memo about filing, receipts, and ballot access.",{"rules":2,"compliance":2}],["The press scan, because one bad headline can change the day.",{"press":2,"cunning":1,"scrutiny":1}]]},{"id":"design-002","bucket":"interaction","tag":"Cause And Effect","text":"A supporter asks why yesterday’s decision changed today’s plan. How do you answer?","answers":[["Explain the tradeoff clearly, including what you gave up.",{"trust":2,"message":1,"ethics":1}],["Show them the updated calendar so the change feels concrete.",{"discipline":2,"team":1,"research":1}],["Say campaigns change fast and ask them to trust the staff.",{"showmanship":1,"team":1,"scrutiny":1}],["Ask what part of the change worries them most.",{"empathy":2,"curiosity":1,"coalition":1}]]},{"id":"design-003","bucket":"exploration","tag":"The Side Note","text":"A volunteer’s door note mentions a small issue that is not in the official plan. What do you do with it?","answers":[["Add it to the research pile and look for a pattern.",{"curiosity":2,"research":2}],["Ask the volunteer to follow up with that household tomorrow.",{"field":2,"volunteers":1}],["Leave it alone until it becomes part of the main campaign story.",{"discipline":1,"message":1}],["Bring it to the next staff meeting even if it slows the agenda.",{"team":2,"policy":1,"fatigue":1}]]},{"id":"design-004","bucket":"clarity","tag":"Readable Choice","text":"A draft flyer has a strong idea buried inside five careful paragraphs. What do you do first?","answers":[["Rewrite it in plain language that a busy parent can understand quickly.",{"message":2,"trust":1}],["Ask which voter group the flyer is meant to reach.",{"research":2,"field":1}],["Cut it to one promise and one reason to believe you.",{"message":2,"discipline":1}],["Keep the longer version for policy-minded voters and make a short version too.",{"policy":2,"message":1,"money":-1}]]},{"id":"design-005","bucket":"surprise","tag":"Unexpected Reply","text":"A rival says something fair about you in public. Your staff is surprised. What do you do?","answers":[["Acknowledge it briefly and keep the focus on the race.",{"trust":2,"message":1}],["Ask why they chose that moment to say it.",{"curiosity":2,"cunning":1}],["Return the courtesy with one fair comment of your own.",{"ethics":2,"coalition":1}],["Treat it as bait until proven otherwise.",{"privacy":1,"cunning":2,"scrutiny":1}]]},{"id":"design-006","bucket":"safety","tag":"Loss Without Shame","text":"A staffer admits a plan failed and expects you to be angry. What do you do first?","answers":[["Ask what the campaign learned and what changes tomorrow.",{"team":2,"research":1,"discipline":1}],["Thank them for saying it before it became worse.",{"empathy":2,"trust":1}],["Move quickly to assign responsibility and reset the plan.",{"duty":2,"rules":1,"fatigue":1}],["Keep the failure quiet until you know whether anyone outside noticed.",{"cunning":2,"privacy":1,"scrutiny":1}]]},{"id":"design-007","bucket":"pace","tag":"Too Much To Read","text":"The campaign inbox has more messages than you can possibly answer. How do you handle the first hour?","answers":[["Sort messages by urgency, then decide what gets answered today.",{"discipline":2,"team":1}],["Read the angry messages first because they may reveal real damage.",{"press":1,"curiosity":2,"fatigue":1}],["Ask staff to summarize patterns instead of forwarding everything.",{"delegation":2,"research":1}],["Answer the personal messages yourself, even if it slows the schedule.",{"empathy":2,"trust":1,"fatigue":1}]]},{"id":"design-008","bucket":"agency","tag":"Not A Straight Line","text":"A donor wants to know the exact path from this race to your future. What do you say?","answers":[["This race has to be worth doing on its own terms.",{"duty":2,"trust":1}],["The future depends on what the community asks for next.",{"empathy":2,"coalition":1}],["Winning creates options, but I am not selling a roadmap.",{"cunning":1,"message":2}],["I am focused on building an operation that can survive pressure.",{"discipline":2,"team":1,"ambition":1}]]},{"id":"design-009","bucket":"world","tag":"World Keeps Moving","text":"While you are in one meeting, two other things happen elsewhere in the ward. What do you ask staff for afterward?","answers":[["A short report of what changed, not every detail.",{"discipline":2,"research":1}],["The names of people who moved closer or farther away.",{"coalition":2,"field":1}],["Whether any rule, deadline, or public record issue changed.",{"rules":2,"compliance":1}],["Whether the story online matches what actually happened.",{"press":2,"digital":1}]]},{"id":"design-010","bucket":"interface","tag":"The Crowded Desk","text":"Your desk is covered in maps, notes, receipts, and speech drafts. What do you clear first?","answers":[["Anything not needed for today’s decisions.",{"discipline":2,"fatigue":-1}],["Receipts and legal paperwork, because sloppy records become stories.",{"compliance":2,"rules":1}],["Door notes, because voters should not become background noise.",{"field":2,"empathy":1}],["Draft speeches, because unclear words waste every other effort.",{"message":2,"press":1}]]},{"id":"design-011","bucket":"tension","tag":"A Small Risk","text":"A choice could help today but create a problem later. What makes you willing to take it?","answers":[["The people affected understand what you are doing and why.",{"ethics":2,"trust":1}],["The risk is written down and someone owns the follow-up.",{"discipline":2,"team":1}],["The alternative is letting a worse problem grow quietly.",{"duty":2,"cunning":1}],["You can explain the choice in one plain sentence if challenged.",{"message":2,"press":1}]]},{"id":"design-012","bucket":"memory","tag":"Remembering Later","text":"At the end of the day, what do you want written in the campaign notebook?","answers":[["What changed because of your choices.",{"research":2,"discipline":1}],["Who trusted you more or less than yesterday.",{"coalition":2,"empathy":1}],["Which promise you must not forget.",{"duty":2,"policy":1}],["Which threat is not urgent yet, but could become urgent.",{"curiosity":1,"cunning":2}]]},{"id":"audit-brief-001","bucket":"briefing","tag":"Morning Brief","text":"Your first morning brief has four sections, but you only have time to read two carefully. What do you open first?","answers":[["The voter-contact notes, because names and places decide the day.",{"field":2,"research":1,"discipline":1}],["The election-office reminders, because missed rules become public problems.",{"rules":2,"compliance":1,"institution":1}],["The local media scan, because the public frame can move before you speak.",{"press":2,"message":1,"curiosity":1}],["The staff capacity note, because plans fail when people are already stretched.",{"team":2,"empathy":1,"fatigue":-1}]]},{"id":"audit-brief-002","bucket":"briefing","tag":"Information Limit","text":"A supporter wants to send you every neighborhood rumor they hear. What boundary do you set?","answers":[["Ask for rumors only when they include who heard it and where it is spreading.",{"research":2,"discipline":1}],["Ask them to send urgent public-safety or voting-access issues immediately.",{"rules":2,"inclusion":1}],["Ask your team to summarize patterns instead of forwarding every message.",{"team":2,"fatigue":-1}],["Tell them to keep sending everything until you understand the landscape.",{"curiosity":2,"fatigue":2,"research":1}]]},{"id":"audit-plan-001","bucket":"plan","tag":"Written Plan","text":"The campaign room wants to keep decisions flexible and avoid writing a formal plan. What do you say?","answers":[["Write the plan anyway, but make it clear it can change when facts change.",{"discipline":2,"team":1,"research":1}],["Start with only the win number, target voters, and next seven days.",{"field":2,"message":1,"discipline":1}],["Ask each lead what they cannot do without a written plan.",{"team":2,"empathy":1}],["Avoid the paperwork for now and keep momentum in the room.",{"showmanship":2,"fatigue":-1,"risk":1}]]},{"id":"audit-plan-002","bucket":"plan","tag":"Real Numbers","text":"A volunteer says the campaign needs “a lot more doors” before anyone can define how many. What do you do?","answers":[["Ask for a real door goal by precinct before approving the schedule.",{"field":2,"research":1,"discipline":1}],["Ask what past turnout says about how many voters can actually be moved.",{"research":2,"policy":1}],["Ask which volunteers can reliably do the work, not just promise it.",{"team":2,"volunteers":1}],["Accept the urgency and push everyone to do as much as possible.",{"ambition":2,"volunteers":1,"fatigue":1}]]},{"id":"audit-field-001","bucket":"field","tag":"Voter Access","text":"A canvasser says several apartment voters are interested but unsure whether their registration is current. What do you do first?","answers":[["Ask the election office for the safest public guidance you can share.",{"rules":2,"inclusion":1,"compliance":1}],["Create a follow-up list so those voters are not lost after one conversation.",{"field":2,"research":1}],["Ask a trusted local group to host a voter-information table.",{"coalition":2,"inclusion":1}],["Tell volunteers to focus on voters whose status is already clear.",{"discipline":1,"field":1,"inclusion":-1}]]},{"id":"audit-field-002","bucket":"field","tag":"Targeting Tension","text":"Your field lead wants to focus only on likely voters. A parent volunteer says that ignores families who rarely get contacted. What do you do?","answers":[["Protect the likely-voter plan but create a smaller access pass for missed families.",{"field":2,"inclusion":1,"discipline":1}],["Ask for numbers showing how much time the broader pass would cost.",{"research":2,"field":1}],["Let the parent volunteer lead a targeted pilot before changing the whole plan.",{"coalition":2,"volunteers":1}],["Shift fully toward under-contacted families and accept the turnout risk.",{"empathy":2,"inclusion":2,"field":-1}]]},{"id":"audit-message-001","bucket":"message","tag":"Message Box","text":"Your opponent describes themselves as the only adult in the race. What is your first response?","answers":[["Define what responsible leadership means in one plain sentence.",{"message":2,"discipline":1}],["Ask which voters might believe the attack before answering it.",{"research":2,"message":1}],["Use humor to make the attack feel smaller without repeating it too much.",{"press":2,"showmanship":1}],["Ignore it unless voters bring it up at doors.",{"field":1,"privacy":1,"message":-1}]]},{"id":"audit-message-002","bucket":"message","tag":"Promise Limit","text":"A voter asks you to promise something the school board probably cannot legally control. What do you do?","answers":[["Explain what the board can control and what you can still push for.",{"policy":2,"trust":1,"rules":1}],["Ask why that issue matters to them before correcting the authority line.",{"empathy":2,"policy":1}],["Offer to find the right agency or official after the event.",{"institution":2,"duty":1}],["Answer broadly so you do not sound powerless.",{"message":1,"risk":1,"policy":-1}]]},{"id":"audit-coalition-001","bucket":"coalition","tag":"Coalition Agency","text":"A youth group will endorse you only if students help shape the event, not just appear in photos. What do you do?","answers":[["Give them real planning authority over part of the event.",{"coalition":2,"inclusion":2,"team":1}],["Ask what decisions they want to own before agreeing.",{"research":1,"coalition":2}],["Offer a smaller role that avoids creating event chaos.",{"discipline":1,"coalition":-1,"team":1}],["Decline if the campaign cannot share control honestly.",{"ethics":2,"privacy":1}]]},{"id":"audit-coalition-002","bucket":"coalition","tag":"Secondary Target","text":"A respected teacher will not endorse you but may influence people who trust them. How do you handle it?","answers":[["Ask for advice without asking for a public endorsement.",{"coalition":2,"research":1}],["Ask what would make them comfortable correcting misinformation privately.",{"message":1,"coalition":2}],["Move on to supporters who will appear publicly.",{"showmanship":1,"field":1,"coalition":-1}],["Invite them to challenge your education plan before it goes public.",{"policy":2,"empathy":1}]]},{"id":"audit-press-001","bucket":"press","tag":"Clip Without Context","text":"A short clip of your answer is spreading online without the question that came before it. What do you do?","answers":[["Post the full exchange with a short explanation of the missing context.",{"press":2,"message":1,"digital":1}],["Ask who is spreading it and whether it is reaching persuadable voters.",{"research":2,"digital":1}],["Call the reporter or host before making a public correction.",{"press":1,"discipline":1}],["Leave it alone if the clip is currently helping you.",{"cunning":2,"risk":1}]]},{"id":"audit-press-002","bucket":"press","tag":"Reporter Boundary","text":"A reporter asks for a comment on a rumor you have not verified. What do you do?","answers":[["Say what you can confirm and what you are still checking.",{"press":2,"trust":1,"research":1}],["Ask for time to verify before giving anything on the record.",{"discipline":2,"research":1}],["Use the question to restate your main message.",{"message":2,"press":1}],["Warn that the rumor sounds politically motivated.",{"showmanship":1,"risk":2}]]},{"id":"audit-finance-001","bucket":"finance","tag":"Budget Tradeoff","text":"You can fund either a small mailer, a weekend field push, or better compliance help. Which question do you ask first?","answers":[["Which option changes the most actual votes before the next deadline?",{"field":2,"research":1}],["Which option prevents a mistake that could become the story?",{"compliance":2,"rules":1}],["Which option lets volunteers do more without burning out?",{"volunteers":2,"team":1}],["Which option makes the campaign look more serious fastest?",{"press":1,"showmanship":2}]]},{"id":"audit-finance-002","bucket":"finance","tag":"Donor Ask","text":"A potential donor wants a private call before giving, but your schedule is already packed. What do you do?","answers":[["Ask the finance lead to confirm whether the donor is worth candidate time.",{"money":2,"team":1}],["Take the call but set a strict time limit and clear topic.",{"discipline":2,"money":1}],["Delegate the first call and join only if there is real alignment.",{"team":2,"fatigue":-1}],["Skip it and protect voter contact time.",{"field":1,"fatigue":-1,"money":-1}]]},{"id":"audit-rules-001","bucket":"rules","tag":"Election Authority","text":"The election office says one filing detail is technically allowed but may confuse voters later. What do you do?","answers":[["Choose the clearer option even if the technical shortcut is legal.",{"rules":2,"trust":1,"compliance":1}],["Ask for the rule in writing before deciding.",{"compliance":2,"discipline":1}],["Ask whether other campaigns are using the shortcut.",{"research":2,"rules":1}],["Use the shortcut if it saves time and stays legal.",{"discipline":1,"risk":1,"fatigue":-1}]]},{"id":"audit-rules-002","bucket":"rules","tag":"Observer Training","text":"A civic group offers volunteers to observe polling places, but they need training. What do you do?","answers":[["Help them get proper training without trying to control their conclusions.",{"rules":2,"trust":1,"ethics":1}],["Ask which precincts most need calm, visible observers.",{"research":1,"rules":2}],["Coordinate only through the campaign’s legal/compliance lead.",{"compliance":2,"team":1}],["Decline because observers might create another thing to manage.",{"fatigue":-1,"rules":-1}]]},{"id":"audit-candidate-001","bucket":"candidate","tag":"Leadership Fit","text":"Your team proposes an event style that works for other candidates but feels false for you. What do you do?","answers":[["Adjust the event until it uses your strengths honestly.",{"message":2,"trust":1,"fatigue":-1}],["Ask what goal the event is supposed to achieve before rejecting it.",{"research":2,"discipline":1}],["Try it once and let the team measure whether it works.",{"team":2,"curiosity":1}],["Do it as written because consistency matters more than comfort.",{"discipline":1,"fatigue":1,"message":-1}]]},{"id":"audit-candidate-002","bucket":"candidate","tag":"Meeting Control","text":"A community meeting is running long, and the loudest voices are consuming the room. What do you do?","answers":[["Name the time limit and invite unheard people to speak next.",{"inclusion":2,"trust":1,"discipline":1}],["Ask for written follow-ups so the meeting can end responsibly.",{"team":1,"fatigue":-1,"policy":1}],["Stay until everyone is finished, even if the schedule breaks.",{"empathy":2,"fatigue":2}],["Let the host manage the room and avoid looking controlling.",{"privacy":1,"inclusion":-1}]]},{"id":"audit-government-001","bucket":"government","tag":"Governing Authority","text":"A supporter asks what you will do on day one if you win. What do you answer?","answers":[["Name one board action you can actually take and one relationship you need to build.",{"policy":2,"institution":1,"trust":1}],["Say you will first learn the rules, staff structure, and committee process.",{"rules":2,"research":1,"discipline":1}],["Promise to bring the public into the process immediately.",{"inclusion":2,"message":1}],["Say winning comes first and governing details come after Election Day.",{"ambition":2,"policy":-1}]]},{"id":"audit-government-002","bucket":"government","tag":"Institutional Map","text":"You find an old government directory that shows how many offices touch school issues indirectly. What do you do with it?","answers":[["Mark only the offices that could matter to this local race.",{"research":2,"discipline":1}],["Use it to understand which promises are outside your authority.",{"policy":2,"rules":1}],["Save it for after the election so it does not clutter the campaign.",{"discipline":1,"fatigue":-1}],["Look for names that repeat across boards, agencies, and committees.",{"curiosity":2,"cunning":1}]]},{"id":"audit-crisis-001","bucket":"crisis","tag":"Crisis Discipline","text":"A damaging accusation appears two hours before a public forum. Your team does not yet know whether it is true. What do you do first?","answers":[["Separate what is known, unknown, and false before writing any statement.",{"research":2,"press":1,"discipline":1}],["Ask compliance/legal to check whether any filing or record is involved.",{"compliance":2,"rules":1}],["Prepare one calm sentence for the forum and keep investigating.",{"message":2,"press":1}],["Attack the timing and suggest the opponent is desperate.",{"showmanship":2,"risk":2}]]},{"id":"audit-text-001","bucket":"attention","tag":"Notebook Memory","text":"A staffer asks why you keep a private campaign notebook when the team already has shared documents. What do you say?","answers":[["The shared plan tracks tasks; the notebook tracks what the room felt like.",{"curiosity":2,"empathy":1}],["It helps me remember patterns that are not ready to become strategy.",{"research":2,"privacy":1}],["It keeps me from reacting to every new thing as if it is the first thing.",{"discipline":2,"fatigue":-1}],["It is private because some pressure points are not team problems yet.",{"privacy":2,"cunning":1}]]},{"id":"audit-text-002","bucket":"attention","tag":"Choice Pressure","text":"A situation gives you three useful options, but choosing one means neglecting the others. What do you accept?","answers":[["Attention is part of the campaign budget, not a personal failure.",{"disciplin
