e voter understands it without needing the campaign script.","effects":{"field":1}},{"id":"money-pressure","test":{"money_lt":30},"text":"The finance desk starts treating every choice as a budget choice, even the ones that do not look financial.","effects":{"fatigue":1}},{"id":"rules-warning","test":{"rules_lt":34,"day_gt":6},"text":"A small election-office reminder feels larger than it should because the rules folder has been neglected.","effects":{"scrutiny":1}},{"id":"default-ward","test":{},"text":"Outside the office, the ward keeps having its own day: school traffic, group chats, errands, meetings, favors, and old grudges you have not learned yet.","effects":{}},{"id":"registration-gap-rises","test":{"inclusion_lt":38,"day_gt":4},"text":"A parent group starts trading incomplete voter-registration advice. No one is trying to cause harm, but confusion spreads faster than corrections.","effects":{"rules":-1,"scrutiny":1}},{"id":"observer-confidence","test":{"rules_gt":50,"compliance_gt":50},"text":"A civic observer organizer says the process feels calmer because the campaign is not treating rules as a side quest.","effects":{"trust":1,"inclusion":1}},{"id":"coalition-wants-agency","test":{"coalition_gt":35,"day_gt":5},"text":"A coalition partner asks for decision rights on one event instead of another photo opportunity.","effects":{"coalition":1,"team":-1}},{"id":"opponent-defines-choice","test":{"message_lt":42,"day_gt":6},"text":"The opponent’s simple line begins to define the race in rooms where your campaign is not present.","effects":{"press":-1,"scrutiny":1}},{"id":"staff-role-strain","test":{"team_lt":34,"day_gt":7},"text":"Two staff leads unknowingly work the same voter list. The mistake is small, but the wasted time is not.","effects":{"fatigue":1,"field":-1}},{"id":"budget-forces-choice","test":{"money_lt":36,"day_gt":8},"text":"A supplier asks for payment before the campaign has decided which outreach matters most this week.","effects":{"fatigue":1,"message":-1}},{"id":"government-map-seed","test":{"policy_gt":45,"rules_gt":40,"day_gt":11},"text":"A board member from outside the race quietly tells you which promise will hit institutional limits first.","effects":{"policy":1,"research":1}},{"id":"meeting-fatigue","test":{"fatigue_gt":50,"day_gt":12},"text":"A meeting that should have clarified the campaign instead leaves everyone with more notes and less confidence.","effects":{"team":-1,"message":-1}},{"id":"student-paper-followup","test":{"press_gt":40,"inclusion_gt":35,"day_gt":10},"text":"The student paper asks a better follow-up than the adult press did, and the campaign has to decide whether to take it seriously.","effects":{"press":1,"policy":1}},{"id":"rusk-reads-repetition","text":"Rusk’s campaign starts preparing for the move you have used most often. The next obvious response may still work, but it will not surprise anyone.","test":{"memory_message_gt":2},"effects":{"opposition":2,"scrutiny":1}},{"id":"field-network-responds","text":"A parent volunteer connects two families before your campaign asks. The ward is beginning to move without waiting for you personally.","test":{"field_gt":45,"coalition_gt":35},"effects":{"field":1,"trust":1,"fatigue":-1}},{"id":"fatigue-misses-detail","text":"A small scheduling detail is missed because everyone assumed someone else had it. The mistake is fixable, but it reveals the cost of overload.","test":{"fatigue_gt":45},"effects":{"attention":-2,"team":-1,"scrutiny":1}},{"id":"opponent-overreads","text":"The other campaign over-corrects for what it thinks you will do next. For one afternoon, their certainty becomes a weakness.","test":{"opposition_gt":45,"adaptability_gt":35},"effects":{"opposition":-2,"message":1}},{"id":"briefing-pays-off","text":"A skipped-looking note from the morning brief suddenly matters. Because it was assigned to staff, the campaign catches it before it becomes a public problem.","test":{"attention_gt":48,"team_gt":40},"effects":{"compliance":1,"trust":1}},{"id":"data-boundary-noticed","text":"A civic observer hears that your campaign refused a questionable list. The story does not travel far, but the right people hear it.","test":{"compliance_gt":55,"trust_gt":50},"effects":{"trust":1,"rules":1,"coalition":1}},{"id":"pattern-superstition-risk","text":"Sal warns that the room is starting to see a strategy behind every coincidence. Useful pattern work needs a brake pedal.","test":{"research_gt":55,"opposition_gt":50},"effects":{"attention":1,"fatigue":1,"opposition":-1}},{"id":"operations-board-calms-room","test":{"memory_operations_gt":1,"team_gt":40},"text":"The task board catches a small handoff before it becomes a public mistake. No one claps. The room simply breathes easier.","effects":{"team":1,"attention":1,"compliance":1}},{"id":"approval-queue-catches-line","test":{"compliance_gt":55,"message_gt":40},"text":"A draft line that sounded good gets corrected before it leaves the office. The campaign loses a catchy sentence and gains a safer day.","effects":{"trust":1,"scrutiny":-1}},{"id":"too-many-open-loops","test":{"attention_lt":35,"day_gt":5},"text":"The campaign has too many half-started fixes open at once. Nothing is burning, but the room is getting louder inside people’s heads.","effects":{"fatigue":1,"team":-1}},{"id":"discoverable-office-pays-off","test":{"memory_operations_gt":2,"day_gt":6},"text":"A new volunteer finds the current message guide without asking three people. It saves fifteen minutes and a little dignity.","effects":{"team":1,"volunteers":1}},{"id":"delegation-overreach","test":{"memory_operations_gt":2,"compliance_lt":45},"text":"A staffer moves quickly on a task that needed more review. The mistake is fixable, but the campaign learns that autonomy needs fences.","effects":{"compliance":-1,"scrutiny":1,"team":-1}},{"id":"nightly-save-remembers","test":{"memory_operations_gt":3,"day_gt":12},"text":"A note from a prior end-of-day review prevents the campaign from repeating a solved problem.","effects":{"attention":1,"fatigue":-1,"team":1}}]};

function clamp(v,min=0,max=100){return Math.max(min,Math.min(max,Number(v)||0));}

function baseState(slot=1){return {version:'github-phase0-assistant',slot,createdAt:now(),updatedAt:now(),quizDone:false,quizIndex:0,quizOrder:[],scores:{},profile:null,day:1,phase:'Research & ID',completed:[],flags:{},journal:[],assistantRecords:[],activeEncounter:null,pulseSeen:[],stats:{trust:45,scrutiny:25,money:45,volunteers:28,field:30,message:30,research:28,compliance:50,inclusion:35,fatigue:20,coalition:25,press:25,policy:30,team:35,rules:30,digital:20,opposition:32,attention:42,adaptability:35},behaviorMemory:{field:0,message:0,press:0,coalition:0,rules:0,finance:0,candidate:0,opposition:0,briefing:0,rest:0,operations:0},directorNotes:[],relationships:{mara:35,luz:35,daryl:35,owen:35,kenna:20,nia:20,rusk:10,junie:20},precincts:{Northside:{known:12,persuadable:10,turnout:18},Riverbend:{known:8,persuadable:14,turnout:10},OldTown:{known:14,persuadable:8,turnout:16},Apartments:{known:4,persuadable:18,turnout:6},StudentEdge:{known:5,persuadable:13,turnout:5}},log:['The campaign office is open. The world will keep moving even when you are in another room.']};}
function migrate(){const fresh=baseState(activeSlot); if(!state||typeof state!=='object')state=fresh; state.version='github-phase0-assistant'; for(const k of ['stats','relationships','precincts','flags']){if(!state[k])state[k]=clone(fresh[k]);} for(const k of Object.keys(fresh.stats)){if(typeof state.stats[k]!=='number')state.stats[k]=fresh.stats[k];} if(!Array.isArray(state.completed))state.completed=[]; if(!Array.isArray(state.log))state.log=[]; if(!Array.isArray(state.journal))state.journal=[]; if(!Array.isArray(state.pulseSeen))state.pulseSeen=[]; if(!state.behaviorMemory)state.behaviorMemory=clone(fresh.behaviorMemory); for(const k of Object.keys(fresh.behaviorMemory)){if(typeof state.behaviorMemory[k]!=='number')state.behaviorMemory[k]=0;} if(!Array.isArray(state.directorNotes))state.directorNotes=[]; if(!state.phase)state.phase=phaseForDay(state.day||1); if(!state.day)state.day=1; if(!state.profile&&state.quizDone){state.profile={title:'Local Candidate',primary:'duty',traits:[]};} if(!Array.isArray(state.assistantRecords)){
  state.assistantRecords=(state.journal||[]).map((j,i)=>({id:'legacy-'+i,day:state.day||1,kind:inferKind(j.cmd),title:String(j.cmd||'Previous campaign record'),detail:String(j.text||''),source:'Earlier campaign record'})).reverse();
 } if(state.activeEncounter && !ENCOUNTERS.some(e=>e.id===state.activeEncounter.id))state.activeEncounter=null;

function save(){if(!state)return; state.updatedAt=now(); try{localStorage.setItem(slotKey(activeSlot),JSON.stringify(state));localStorage.setItem(ACTIVE_SLOT_KEY,String(activeSlot));saveStatus.textContent='Saved '+state.updatedAt;}catch(e){saveStatus.textContent='Save blocked — export a backup';console.error('Save failed',e);}}
function load(slot){activeSlot=slot;localStorage.setItem(ACTIVE_SLOT_KEY,String(slot));const raw=localStorage.getItem(slotKey(slot));if(!raw){state=null;saveStatus.textContent='Slot '+slot+' empty';renderHome();return;}try{state=JSON.parse(raw);if(!state||typeof state!=='object'||Array.isArray(state))throw Error('Invalid slot');}catch(e){state=null;saveStatus.textContent='Slot '+slot+' unreadable — not overwritten';alert('This slot could not be read. Its original data has NOT been changed. Use Backup to export the stored slots before doing anything else.');renderHome();return;}migrate();saveStatus.textContent='Slot '+slot+' loaded';render();}
function deleteSlot(slot){localStorage.removeItem(slotKey(slot)); if(activeSlot===slot)state=null; renderHome();}
function startNew(slot){if(localStorage.getItem(slotKey(slot))&&!confirm('Start a NEW political life in Slot '+slot+'? This will overwrite the existing game in that slot. Choose Cancel to keep it, or Back up your slots first.'))return;activeSlot=slot;state=baseState(slot);beginQuiz();save();renderQuiz();}
function beginQuiz(){const ids=QUESTION_BANK.map((_,i)=>i); for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];} state.quizOrder=ids.slice(0,QUIZ_COUNT); state.quizIndex=0; state.scores={}; state.quizDone=false; state.profile=null;}

function renderHome(){let slots=''; for(let i=1;i<=3;i++){let raw=localStorage.getItem(slotKey(i)); let info='Empty slot'; let extra='Start a new political life.'; if(raw){try{let d=JSON.parse(raw); info=d.profile?d.profile.title:'Campaign in progress'; extra='Day '+(d.day||1)+' · '+(d.phase||'Campaign')+' · saved '+(d.updatedAt||'unknown');}catch(e){extra='Unreadable save data';}} slots+=`<div class="slot"><div><b>Slot ${i}</b><p class="muted">${esc(info)}<br>${esc(extra)}</p></div><div class="row"><button class="btn" data-act="load" data-slot="${i}">Load</button><button class="btn secondary" data-act="new" data-slot="${i}">New</button><button class="btn danger" data-act="delete" data-slot="${i}">Delete</button></div></div>`;} root.className='screen landing'; root.innerHTML=`<section class="card"><h1>Your political life starts here.</h1><p class="lead">Begin your story in Harbor Ward Seven. Your decisions and the people you meet will shape what happens next.</p><p class="muted">Three separate saves are available. Your Personal Assistant keeps records while you play.</p><div class="row"><button class="btn secondary" data-act="export">Download save backup</button><button class="btn secondary" data-act="import">Import save backup</button></div><div class="slots">${slots}</div><div class="hr"></div><p class="desktopNote">Desktop/laptop-first build. Saves live in this browser. Back up your saves before switching from a downloaded file to the hosted website; browser storage does not automatically transfer between them.</p></section>`;}
function renderQuiz(){const qi=state.quizIndex||0; const total=state.quizOrder.length||QUIZ_COUNT; const q=QUESTION_BANK[state.quizOrder[qi]]; if(!q){finishQuiz();return;} const pct=Math.round((qi/total)*100); root.className='screen quiz'; root.innerHTML=`<section class="card quizBox"><div class="qtag">${esc(q.tag||q.bucket)} · Question ${qi+1} of ${total}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="question">${esc(q.text)}</div><div class="answers">${q.answers.map((a,idx)=>`<button class="answer" data-act="answer" data-idx="${idx}">${esc(a[0])}</button>`).join('')}</div><div class="hr"></div><p class="muted">The quiz still avoids obvious labels. It now also tests how you scope messy requests, delegate safely, review before acting publicly, and protect attention when the campaign gets complicated.</p></section>`; save();}
function answer(idx){const q=QUESTION_BANK[state.quizOrder[state.quizIndex]]; const ans=q&&q.answers[idx]; if(!ans)return; for(const [k,v] of Object.entries(ans[1]||{})){state.scores[k]=(state.scores[k]||0)+Number(v);} state.quizIndex++; if(state.quizIndex>=state.quizOrder.length)finishQuiz(); else renderQuiz();}
function topScores(n=4){return Object.entries(state.scores||{}).sort((a,b)=>b[1]-a[1]).slice(0,n);}
function finishQuiz(){const tops=topScores(6); const primary=tops[0]?.[0]||'duty'; const titles={policy:'Policy Builder',research:'Pattern Reader',curiosity:'Pattern Reader',duty:'Public Servant',institution:'Institutionalist',rules:'Institutionalist',cunning:'Backroom Operator',press:'Public Communicator',message:'Public Communicator',field:'Field Organizer',coalition:'Coalition Candidate',empathy:'Community Listener',privacy:'Private Candidate',familyPressure:'Local Heir',discipline:'Calendar Candidate',team:'Room Builder',attention:'Signal Reader',adaptability:'Adaptive Candidate',opposition:'Counter-Mover'}; const title=titles[primary]||'Local Candidate'; state.profile={title,primary,traits:tops.map(t=>t[0])}; state.quizDone=true; state.log.unshift('Candidate profile formed: '+title+'. The campaign begins with instincts, but choices will reshape the room.'); state.journal.unshift({cmd:'origin',text:'The interview did not assign a class. It gave the campaign a first guess about how you act under pressure.'}); save(); renderReveal();}

function cleanTrait(k){return ({policy:'Policy',research:'Research',curiosity:'Curiosity',duty:'Duty',institution:'Institution',rules:'Rules',cunning:'Backchannels',press:'Press',message:'Message',field:'Field',coalition:'Coalition',empathy:'Listening',privacy:'Privacy',familyPressure:'Family Pressure',discipline:'Discipline',team:'Team',fatigue:'Energy',digital:'Digital',ethics:'Ethics',attention:'Attention',adaptability:'Adaptability',opposition:'Opposition Read',delegation:'Delegation',control:'Control'}[k]||k.replace(/([A-Z])/g,' $1'));}
function phaseForDay(day){day=Number(day)||1; if(day>=24)return 'Election Day'; if(day>=19)return 'GOTV'; if(day>=5)return 'Persuasion'; return 'Research & ID';}

function signalWord(k,v){v=clamp(v); if(k==='fatigue'||k==='scrutiny'){if(v<22)return 'Quiet'; if(v<42)return 'Manageable'; if(v<65)return 'Rising'; return 'Dangerous';} if(k==='opposition'){if(v<25)return 'Quiet'; if(v<45)return 'Watching'; if(v<65)return 'Testing You'; if(v<82)return 'Targeting'; return 'Pressing Hard';} if(k==='attention'){if(v<25)return 'Overloaded'; if(v<45)return 'Thin'; if(v<65)return 'Focused'; if(v<82)return 'Clear'; return 'Locked In';} if(k==='adaptability'){if(v<25)return 'Rigid'; if(v<45)return 'Steady'; if(v<65)return 'Flexible'; if(v<82)return 'Hard To Read'; return 'Unsettling';} if(v<25)return 'Weak'; if(v<45)return 'Thin'; if(v<65)return 'Building'; if(v<82)return 'Strong'; return 'Dominant';}
function meter(k,v){const bad=k==='fatigue'||k==='scrutiny'; const pct=clamp(v); return `<div class="signal"><div class="signalHead"><span>${esc(statLabel(k))}</span><span>${esc(signalWord(k,pct))}</span></div><div class="meter"><div class="fill ${bad?'bad':''}" style="width:${pct}%"></div></div></div>`;}

function worldBrief(){const p=selectWorldPulse(false); return p?p.text:'The ward keeps moving outside the frame.';}
function renderGame(){migrate(); state.phase=phaseForDay(state.day); const keyStats=['trust','field','message','research','coalition','team','opposition','attention','compliance','money','fatigue']; const room=currentRoom(); const acts=availableEncounters(activeRoom); const actionHtml=acts.length?acts.map(e=>`<button class="action" data-act="encounter" data-id="${esc(e.id)}"><div class="small phaseNow">${esc(e.phase)} · active around day ${e.day}</div><h3>${esc(e.title)}</h3><p class="muted">${esc(e.summary)}</p><div>${(e.stakes||[]).map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div></button>`).join(''):`<div class="empty"><h3>No fresh situations here right now.</h3><p>Move to another room, read the room, or let the campaign clock advance.</p><div class="row" style="justify-content:center"><button class="btn" data-act="roomPulse">Read the room</button><button class="btn secondary" data-act="advanceDay">Advance one campaign day</button></div></div>`; root.className='screen game'; root.innerHTML=`<aside class="panel left"><h2>${esc(state.profile?.title||'Candidate')}</h2><p class="muted">Day ${state.day} · <span class="phaseNow">${esc(state.phase)}</span><br>Election Day in ${Math.max(0,24-state.day)} day(s).</p>${keyStats.map(k=>meter(k,state.stats[k]||0)).join('')}<div class="hr"></div><h3>Rooms</h3>${ROOMS.map(r=>`<button class="roomBtn ${activeRoom===r.id?'active':''}" data-act="room" data-room="${esc(r.id)}"><b>${esc(r.name)}</b><div class="roomHint">${esc(r.hint)}</div></button>`).join('')}</aside><section class="panel stage"><div class="stageTop"><div class="row"><span class="pill">${esc(room.name)}</span><span class="pill">${esc(state.phase)}</span></div><h2>${esc(room.name)}</h2><p class="muted">${esc(room.hint)}</p><p class="muted"><b>Today:</b> ${esc(todayPressure())}</p></div><div class="stageBody"><div class="briefCard"><div class="qtag">ROOM TONE</div><h3>${esc(roomObservation())}</h3><p class="muted">${esc(worldBrief())}</p><div class="row"><button class="btn secondary" data-act="roomPulse">Read the room</button><button class="btn ghost" data-act="journal">Personal Assistant</button></div></div>${state.activeEncounter?`<div class="resumeBox"><b>Conversation on hold</b><p>You can return to ${esc(ENCOUNTERS.find(e=>e.id===state.activeEncounter.id)?.title||'your conversation')} where you left off.</p><button class="btn" data-act="resumeEncounter">Resume conversation</button></div>`:''}<div class="actionGrid">${state.activeEncounter?'<p class="muted">Finish or pause the current conversation before starting something new.</p>':actionHtml}</div></div></section><aside class="panel right"><h3>Calendar Pressure</h3>${renderTimeline()}<div class="hr"></div><h3>People Near You</h3>${renderPeople()}<div class="hr"></div><h3>Precinct Board</h3>${renderPrecincts()}<div class="hr"></div><h3>Campaign Read</h3><div class="timelineItem"><b>Pattern note</b><br><span class="small">${esc(directorReadout())}</span></div><div class="hr"></div><h3>From your Personal Assistant</h3>${renderLog()}</aside>`; save();}
function renderTimeline(){const items=[['Day 1','Research and ID begins'],['Day 3','Filing packet correction window'],['Day 5','Persuasion phase begins'],['Day 8','Teachers association interview window'],['Day 11','Student forum / student paper'],['Day 15','Debate prep deadline'],['Day 17','Public forum night'],['Day 19','GOTV phase begins'],['Day 20','Observer and rides list'],['Day 24','Election Day']]; return items.map(([d,t])=>{const num=Number(d.replace(/\D/g,'')); return `<div class="deadline ${state.day>=num?'phaseNow':''}"><b>${esc(d)}</b><br>${esc(t)}</div>`}).join('');}
function renderPeople(){return CHARACTERS.map(p=>`<div class="person"><b>${esc(p.name)}</b><br>${esc(p.role)}<br><span class="small">${esc(p.bio)}</span></div>`).join('');}
function renderPrecincts(){return Object.entries(state.precincts).map(([name,p])=>`<div class="timelineItem"><b>${esc(name)}</b><br><span class="small">Supporter IDs: ${signalWord('x',p.known)} · Persuadables: ${signalWord('x',p.persuadable)} · Turnout: ${signalWord('x',p.turnout)}</span></div>`).join('');}
function renderLog(){const lines=(state.journal&&state.journal.length?state.journal:state.log.map(x=>({cmd:'note',text:x}))).slice(0,8); return lines.map(x=>`<div class="transcriptLine"><span class="cmd">&gt; ${esc(x.cmd||'note')}</span><br>${esc(x.text||x)}</div>`).join('');}

function dominantMemory(){const mem=state.behaviorMemory||{}; const top=Object.entries(mem).sort((a,b)=>b[1]-a[1])[0]; return top&&top[1]>0?top[0]:'';}
function todayPressure(){const s=state.stats||{}; if(activeRoom==='operations')return 'Make the work safer to hand off. The goal is not more process; it is fewer invisible mistakes.'; if(s.fatigue>55)return 'The campaign is still playable, but overload is becoming the opponent inside the room.'; if(activeRoom==='opposition')return 'Look for one useful pattern. Do not turn every coincidence into a theory.'; if(activeRoom==='briefing')return 'Pick what matters now. The unread items should be assigned, not kept open in your head.'; if(s.opposition>60)return 'The other campaign is actively testing your habits. A clear, grounded surprise may matter.'; if(s.attention<35)return 'The day needs fewer open loops before it needs more information.'; const d=dominantMemory(); if(d)return 'Your recent choices have taught the ward something about you. Today can confirm that pattern or complicate it.'; return 'Choose one room that matches the pressure in front of you. The rest of the ward will keep moving.';}
function directorReadout(){const mem=state.behaviorMemory||{}; const d=dominantMemory(); if(!d)return 'No clear campaign habit yet. The ward is still forming its first read of you.'; const labels={field:'field work',message:'message control',press:'press response',coalition:'coalition work',rules:'rules and process',finance:'money and compliance',candidate:'candidate management',opposition:'opposition watching',briefing:'briefing discipline',rest:'rest and pacing',operations:'operational handoffs'}; return 'Recent habit: '+(labels[d]||d)+'. Some people may start expecting that from you.';}
function selectWorldPulse(requireNew=true){let possible=WORLD_PULSES.filter(p=>!requireNew||!state.pulseSeen.includes(p.id)).filter(p=>testPulse(p.test||{})); if(!possible.length && requireNew)possible=WORLD_PULSES.filter(p=>p.id==='default-ward'); return possible[0]||WORLD_PULSES[WORLD_PULSES.length-1];}
function testPulse(t){const s=state.stats||{}; const mem=state.behaviorMemory||{}; if(t.day_gt && !(state.day>t.day_gt))return false; if(t.day_lt && !(state.day<t.day_lt))return false; for(const [k,v] of Object.entries(t)){if(k==='day_gt'||k==='day_lt')continue; if(k.startsWith('memory_')&&k.endsWith('_gt')){const stat=k.slice(7,-3); if(!(Number(mem[stat]||0)>v))return false; continue;} if(k.startsWith('memory_')&&k.endsWith('_lt')){const stat=k.slice(7,-3); if(!(Number(mem[stat]||0)<v))return false; continue;} if(k.endsWith('_gt')){const stat=k.slice(0,-3); if(!(Number(s[stat]||0)>v))return false;} if(k.endsWith('_lt')){const stat=k.slice(0,-3); if(!(Number(s[stat]||0)<v))return false;}} return true;}
function addJournal(cmd,text){state.journal=state.journal||[];state.journal.unshift({cmd,text,day:state.day||1});state.log=state.log||[];state.log.unshift(text);state.log=state.log.slice(0,80);assistantRecord(inferKind(cmd),readableTitle(cmd),text,'Observed or reported during play');}
function runWorldPulse(){let pool=WORLD_PULSES.filter(p=>!state.pulseSeen.includes(p.id)).filter(p=>testPulse(p.test||{})); if(!pool.length)pool=WORLD_PULSES.filter(p=>p.id==='default-ward'); const p=pool[Math.floor(Math.random()*pool.length)]||selectWorldPulse(true); if(!p)return; if(p.id && p.id!=='default-ward')state.pulseSeen.push(p.id); applyEffects(p.effects||{},true); addJournal('world pulse',p.text); state.directorNotes=state.directorNotes||[]; state.directorNotes.unshift(p.text); state.directorNotes=state.directorNotes.slice(0,20);}
function roomPulse(){const text=roomObservation(); addJournal('look '+currentRoom().name.toLowerCase(),text); if(activeRoom==='field')applyEffects({research:1},true); if(activeRoom==='candidate')applyEffects({fatigue:-1},true); if(activeRoom==='operations')applyEffects({attention:1},true); save(); renderGame();}
function openJournal(){openPersonalAssistant();}
function startEncounter(id){if(state.activeEncounter){resumeEncounter();return;}currentEncounter=ENCOUNTERS.find(e=>e.id===id);if(!currentEncounter)return;currentStep=currentEncounter.steps[0];pendingResult='';state.activeEncounter={id:currentEncounter.id,stepId:currentStep.id,pendingResult:'',phase:'active',seenSteps:[]};addJournal('meeting',`Started: ${currentEncounter.title}. ${currentEncounter.summary}`);recordSceneStep();save();renderModal();}
function renderModal(){if(!currentEncounter||!currentStep){modal.className='modalBackdrop';modal.innerHTML='';return;} const choices=(currentStep.choices||[]).map((c,i)=>`<button class="choice" data-act="choice" data-idx="${i}">${esc(c.text)}<div class="choiceHint"></div></button>`).join(''); modal.className='modalBackdrop show'; modal.innerHTML=`<div class="modal"><div class="row"><span class="pill">${esc(currentEncounter.phase)}</span><span class="pill">${esc(currentRoom().name)}</span></div><h2>${esc(currentEncounter.title)}</h2><div class="sceneSpeaker">${esc(currentStep.speaker||'Campaign Room')}</div><div class="sceneBody">${esc(currentStep.body)}</div>${pendingResult?`<div class="result ${pendingResult.toLowerCase().includes('risk')?'warn':''}">${esc(pendingResult)}</div>`:''}<div>${choices}</div><div class="hr"></div><button class="btn secondary" data-act="closeModal">Save and pause this conversation</button></div>`;}

function trackChoice(ch){state.behaviorMemory=state.behaviorMemory||{}; const eff=ch.effects||{}; const text=String(ch.text||'').toLowerCase(); const bump=k=>{state.behaviorMemory[k]=(state.behaviorMemory[k]||0)+1;}; if(eff.field||text.includes('door')||text.includes('voter'))bump('field'); if(eff.message||text.includes('message')||text.includes('answer'))bump('message'); if(eff.press||text.includes('reporter')||text.includes('clip'))bump('press'); if(eff.coalition||text.includes('ally')||text.includes('partner'))bump('coalition'); if(eff.rules||eff.compliance||text.includes('deadline')||text.includes('legal'))bump('rules'); if(eff.money||text.includes('donor'))bump('finance'); if(eff.fatigue&&eff.fatigue<0)bump('rest'); if(eff.opposition||text.includes('opponent')||text.includes('rusk')||text.includes('rival'))bump('opposition'); if(eff.attention||text.includes('brief'))bump('briefing'); if(eff.privacy||text.includes('private'))bump('candidate'); if(activeRoom==='operations'||eff.delegation||text.includes('task')||text.includes('review')||text.includes('approve')||text.includes('handoff'))bump('operations');}
function applyEffects(eff,silent=false){let notes=[]; for(const [k,raw] of Object.entries(eff||{})){const v=Number(raw)||0; if(k==='day'){setDay(state.day+v); if(!silent)notes.push('Time passes.'); continue;} if(k==='risk'){state.stats.scrutiny=clamp((state.stats.scrutiny||0)+v); if(!silent)notes.push(v>0?'Scrutiny rises.':'Scrutiny eases.'); continue;} if(k==='privacy'){state.stats.trust=clamp((state.stats.trust||0)+Math.round(v/2)); if(!silent)notes.push('Your private boundary is noticed.'); continue;} if(k==='familyPressure'){state.stats.fatigue=clamp((state.stats.fatigue||0)+v); if(!silent)notes.push('Family pressure shifts.'); continue;} if(k in state.stats){state.stats[k]=clamp((state.stats[k]||0)+v); if(!silent)notes.push(effectPhrase(k,v)); continue;} state.scores[k]=(state.scores[k]||0)+v; }
  if((eff.field||0)>1){for(const p of Object.values(state.precincts)){p.known=clamp(p.known+1,0,100); p.turnout=clamp(p.turnout+1,0,100);}}
  if((eff.inclusion||0)>1){state.precincts.Apartments.turnout=clamp(state.precincts.Apartments.turnout+2,0,100); state.precincts.StudentEdge.turnout=clamp(state.precincts.StudentEdge.turnout+1,0,100);}
  if((eff.message||0)>1){for(const p of Object.values(state.precincts)){p.persuadable=clamp(p.persuadable+1,0,100);}}
  return notes.filter(Boolean).join(' ');
}
function effectPhrase(k,v){const up=v>0; const map={trust:['Public trust steadies.','Public trust thins.'],money:['The budget breathes easier.','The budget tightens.'],volunteers:['Volunteer energy rises.','Volunteer energy dips.'],field:['The field map gets clearer.','The field operation loses shape.'],message:['The message sharpens.','The message gets fuzzier.'],research:['The campaign understands more.','The campaign knows less than it should.'],compliance:['The paperwork gets cleaner.','A compliance risk appears.'],inclusion:['More voters have a way into the campaign.','Some voters feel farther from the campaign.'],fatigue:['Fatigue rises.','You recover some energy.'],coalition:['Coalition trust grows.','Coalition trust weakens.'],press:['The press posture improves.','The press posture gets shakier.'],policy:['The policy case deepens.','The policy case gets thinner.'],team:['The room works better together.','The room loses confidence.'],rules:['The rules folder gets clearer.','The rules folder gets neglected.'],digital:['The digital picture improves.','The digital picture gets noisier.'],opposition:['The rival pattern gets clearer.','The rival pressure eases.'],attention:['The day gets easier to read.','The day gets harder to read.'],adaptability:['The campaign becomes harder to predict.','The campaign becomes easier to predict.'],scrutiny:['Scrutiny rises.','Scrutiny eases.']}; return (map[k]||['The campaign shifts.','The campaign shifts.'])[up?0:1];}
function choose(idx){if(!currentEncounter||!currentStep||!state.activeEncounter||state.activeEncounter.phase==='result')return;const ch=currentStep.choices?.[idx];if(!ch)return;trackChoice(ch);const notes=applyEffects(ch.effects||{});pendingResult=(ch.note||'Your decision has been made.')+(notes?' '+notes:'');addJournal('decision',ch.text+' — '+(ch.note||'Decision recorded.'));if(ch.next){const next=currentEncounter.steps.find(s=>s.id===ch.next);if(!next){state.activeEncounter={...state.activeEncounter,phase:'result',pendingResult:'The next part of this conversation is not available. Your decision is saved.'};save();showEncounterResult();return;}currentStep=next;state.activeEncounter.stepId=currentStep.id;state.activeEncounter.pendingResult=pendingResult;recordSceneStep();save();renderModal();}else{if(!state.completed.includes(currentEncounter.id))state.completed.push(currentEncounter.id);if(currentEncounter.id!=='election-day')runWorldPulse();state.activeEncounter.phase='result';state.activeEncounter.pendingResult=pendingResult;save();showEncounterResult();}}
function finishEncounter(){currentEncounter=null;currentStep=null;pendingResult='';state.activeEncounter=null;save();modal.className='modalBackdrop';modal.innerHTML='';if(state.day>=25 || state.completed.includes('election-day'))renderEnding();else renderGame();}
function advanceDay(){setDay((state.day||1)+1); state.stats.fatigue=clamp((state.stats.fatigue||0)+1); runWorldPulse(); addJournal('wait','A day passes. The deadline moves closer whether or not the campaign feels ready.'); save(); if(state.day>=24)activeRoom='rules'; renderGame();}
function calculateOutcome(){const s=state.stats; const field=(s.field||0)+(s.inclusion||0)*0.45+(s.volunteers||0)*0.55+(s.message||0)*0.35+(s.coalition||0)*0.4; const integrity=(s.trust||0)+(s.compliance||0)*0.5+(s.rules||0)*0.35-(s.scrutiny||0)*0.35-(s.fatigue||0)*0.15; const pressureControl=(s.attention||0)*0.25+(s.adaptability||0)*0.2+(s.team||0)*0.18-(s.opposition||0)*0.18; const total=field+integrity+pressureControl+(s.research||0)*0.4+(s.policy||0)*0.25+(s.press||0)*0.2; if(total>185 && integrity>80)return 'win-clean'; if(total>168)return 'win-messy'; if(total>140 || integrity>75)return 'loss-strong'; return 'loss-collapse';}
function renderEnding(){const key=calculateOutcome(); const s=state.stats; root.className='screen reveal'; root.innerHTML=`<section class="card"><h1>${key.startsWith('win')?'Election Night: You Win':'Election Night: You Lose'}</h1><p class="lead">${esc(ENDING_TEXT[key]||'The campaign reaches Election Night with consequences still moving.')}</p><div class="endScore"><div><b>Field</b><br>${esc(signalWord('field',s.field))}</div><div><b>Trust</b><br>${esc(signalWord('trust',s.trust))}</div><div><b>Rules</b><br>${esc(signalWord('rules',s.compliance))}</div><div><b>Fatigue</b><br>${esc(signalWord('fatigue',s.fatigue))}</div></div><div class="hr"></div><p class="muted">This result comes from the campaign web: voter contact, clarity, coalition trust, rules, compliance, attention, and the cost of carrying the race.</p><div class="row"><button class="btn" data-act="home">Return to slots</button><button class="btn secondary" data-act="journal">Personal Assistant</button><button class="btn secondary" data-act="save">Save ending</button></div></section>`; save();}
// Personal Assistant: records are the player's KNOWABLE history, not hidden world state.
let assistantFilter='All';
function inferKind(cmd){const s=String(cmd||'').toLowerCase();if(/choice|decision/.test(s))return 'Decisions';if(/world pulse|news|brief|report/.test(s))return 'News';if(/origin|candidate/.test(s))return 'Career';if(/meeting|enter|scene|conversation/.test(s))return 'Conversations';if(/wait|day|calendar|deadline/.test(s))return 'Calendar';return 'Journal';}
function readableTitle(cmd){const t=String(cmd||'note');if(t.startsWith('enter '))return 'Meeting: '+t.slice(6);if(t==='choice')return 'Decision made';if(t==='world pulse')return 'Ward update';if(t==='wait')return 'New campaign day';return t.charAt(0).toUpperCase()+t.slice(1);}
function assistantRecord(kind,title,detail,source='Direct observation'){
 if(!state)return;state.assistantRecords=state.assistantRecords||[];
 state.assistantRecords.push({id:'r-'+Date.now()+'-'+state.assistantRecords.length,day:state.day||1,kind:String(kind||'Journal'),title:String(title||'Record'),detail:String(detail||''),source});
}
function recordSceneStep(){if(!state?.activeEncounter||!currentEncounter||!currentStep)return;const k=currentEncounter.id+'::'+currentStep.id;if(state.activeEncounter.seenSteps.includes(k))return;state.activeEncounter.seenSteps.push(k);assistantRecord('Conversations',currentEncounter.title,`${currentStep.speaker||'The meeting'}: ${currentStep.body}`,'Conversation you attended');}
function resumeEncounter(){const session=state?.activeEncounter;if(!session)return;currentEncounter=ENCOUNTERS.find(e=>e.id===session.id);if(!currentEncounter){state.activeEncounter=null;save();renderGame();return;}currentStep=currentEncounter.steps.find(s=>s.id===session.stepId)||currentEncounter.steps[0];pendingResult=session.pendingResult||'';if(session.phase==='result')showEncounterResult();else{recordSceneStep();save();renderModal();}}
function showEncounterResult(){const t=state?.activeEncounter?.pendingResult||'The conversation has ended.';modal.className='modalBackdrop show';modal.innerHTML=`<div class="modal"><h2>${esc(currentEncounter?.title||'Conversation finished')}</h2><div class="result">${esc(t)}</div><p class="muted">Your Personal Assistant has recorded the conversation and its known outcome.</p><button class="btn" data-act="finishEncounter">Continue</button></div>`;}
function assistantBrief(){if(!state)return 'Your political life has not started yet.';const events=state.assistantRecords||[];const recent=events.slice(-3).reverse().map(x=>x.title).join(' · ');return `Campaign Day ${state.day}. ${Math.max(0,24-state.day)} days until Election Day. ${state.activeEncounter?'You have a conversation on hold. ':''}Recent activity: ${recent||'Your campaign has just begun.'}`;}
function openPersonalAssistant(){if(!state){alert('Load a save slot to open your Personal Assistant.');return;}assistantFilter='All';modal.className='modalBackdrop show';modal.innerHTML=`<div class="modal paModal"><div class="qtag">YOUR PERSONAL ASSISTANT</div><h2>Political Life Records</h2><p class="muted paIntro">Everything you have done or learned in this campaign is recorded here. Private events elsewhere in the ward stay private until you learn of them.</p><div class="briefCard">${esc(assistantBrief())}</div><div class="paTools"><label for="paSearch" class="small">Find an event, person, promise, or conversation</label><input id="paSearch" class="paSearch" type="search" placeholder="Search your history" autocomplete="off" aria-label="Search Personal Assistant records" /></div><div class="paFilters" id="paFilters"></div><div class="paRecords" id="paRecords" role="region" aria-label="Recorded campaign history" tabindex="0"></div><div class="paFooter"><button class="btn secondary" data-act="closeAssistant">Back to your political life</button></div></div>`;document.getElementById('paSearch').addEventListener('input',renderAssistantEntries);renderAssistantEntries();document.getElementById('paSearch').focus();}
function renderAssistantEntries(){const dest=document.getElementById('paRecords');if(!dest)return;const records=state?.assistantRecords||[];const q=(document.getElementById('paSearch')?.value||'').trim().toLowerCase();const kinds=['All','Conversations','Decisions','News','Calendar','Career','Journal'];const nav=document.getElementById('paFilters');if(nav)nav.innerHTML=kinds.map(k=>`<button data-act="paFilter" data-kind="${k}" aria-pressed="${assistantFilter===k}">${k}</button>`).join('');const matches=records.filter(x=>(assistantFilter==='All'||x.kind===assistantFilter)&&(!q||[x.title,x.detail,x.source,x.kind].join(' ').toLowerCase().includes(q))).slice().reverse();dest.innerHTML=matches.length?matches.map(x=>`<article class="paEntry"><span class="small">Day ${esc(x.day||1)} · ${esc(x.kind||'Journal')} · ${esc(x.source||'')}</span><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p></article>`).join(''):'<p class="muted">No matching records. Try another search or category.</p>';}
function exportBackups(){if(state)save();const slots=[];for(let i=1;i<=3;i++){const raw=localStorage.getItem(slotKey(i));if(raw===null)continue;try{slots.push({slot:i,data:JSON.parse(raw)});}catch{slots.push({slot:i,unreadableOriginal:raw});}}const payload={format:'government-game-slot-backup',schema:1,exportedAt:new Date().toISOString(),slots};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download='Government-Game-Save-Backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);saveStatus.textContent='Backup downloaded';}
async function importBackups(file){let parsed;try{parsed=JSON.parse(await file.text());if(parsed.format!=='government-game-slot-backup'||parsed.schema!==1||!Array.isArray(parsed.slots))throw Error('Not a Government Game backup.');if(!parsed.slots.length)throw Error('The backup contains no saved slots.');const seen=new Set();for(const s of parsed.slots){if(!Number.isInteger(s.slot)||s.slot<1||s.slot>3||seen.has(s.slot))throw Error('Slot numbers are invalid or repeated.');seen.add(s.slot);if(!s.data&&!s.unreadableOriginal)throw Error('A slot is missing its data.');if(s.data&&(typeof s.data!=='object'||Array.isArray(s.data)||!Number.isFinite(Number(s.data.day||1))))throw Error('A saved campaign is invalid.');}}catch(e){alert('Import cancelled: '+e.message+'. Nothing was changed.');return;}if(!confirm(`Import ${parsed.slots.length} slot(s) from this backup? Matching slots already saved in this browser will be replaced. Click Cancel if you have not backed them up.`))return;try{const snapshot={};for(const s of parsed.slots){snapshot[s.slot]=localStorage.getItem(slotKey(s.slot));}try{for(const s of parsed.slots)localStorage.setItem(slotKey(s.slot),s.unreadableOriginal||JSON.stringify(s.data));}catch(e){for(const [slot,raw] of Object.entries(snapshot)){if(raw===null)localStorage.removeItem(slotKey(slot));else localStorage.setItem(slotKey(slot),raw);}throw e;}state=null;modal.className='modalBackdrop';alert('Backup imported successfully. Your slots are ready to load.');renderHome();}catch(e){alert('Import failed: '+e.message+'. Your previous slots were kept wherever possible.');}}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;if(act==='home'){if(state)save();state=null;modal.className='modalBackdrop';renderHome();return;}if(act==='load'){load(Number(el.dataset.slot));return;}if(act==='new'){startNew(Number(el.dataset.slot));return;}if(act==='delete'){if(confirm('Delete this local save slot? This cannot be undone without a backup.'))deleteSlot(Number(el.dataset.slot));return;}if(act==='save'){save();return;}if(act==='export'){exportBackups();return;}if(act==='import'){document.getElementById('importBackup').click();return;}if(act==='answer'){answer(Number(el.dataset.idx));return;}if(act==='enterGame'){renderGame();return;}if(act==='room'){activeRoom=el.dataset.room;renderGame();return;}if(act==='encounter'){startEncounter(el.dataset.id);return;}if(act==='resumeEncounter'){resumeEncounter();return;}if(act==='choice'){choose(Number(el.dataset.idx));return;}if(act==='finishEncounter'){finishEncounter();return;}if(act==='closeModal'){if(state)save();modal.className='modalBackdrop';modal.innerHTML='';currentEncounter=null;currentStep=null;pendingResult='';renderGame();return;}if(act==='closeAssistant'){modal.className='modalBackdrop';modal.innerHTML='';return;}if(act==='paFilter'){assistantFilter=el.dataset.kind||'All';renderAssistantEntries();return;}if(act==='advanceDay'){advanceDay();return;}if(act==='roomPulse'){roomPulse();return;}if(act==='journal'){openPersonalAssistant();return;}});
document.getElementById('importBackup').addEventListener('change',async ev=>{const file=ev.target.files?.[0];ev.target.value='';if(file)await importBackups(file);});
load(activeSlot);

</script>
