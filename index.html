e":2,"fatigue":-1}],["A missed thread needs a follow-up system, not guilt.",{"team":2,"research":1}],["The best choice is the one that most clearly connects to winning.",{"field":2,"ambition":1}],["The safest choice is the one that protects legitimacy if everything gets messy.",{"rules":2,"trust":1}]]},{"id":"ai-pattern-001","bucket":"patterns","tag":"Expected Move","text":"Your team says the other campaign expects you to respond to a rumor the same way you responded last time. What do you do?","answers":[["Respond in the same format, but make the answer shorter and cleaner.",{"message":2,"discipline":1,"press":1}],["Change the setting before you answer, so the reaction cannot be copied exactly.",{"cunning":2,"adaptability":2,"press":1}],["Ask whether answering now helps voters or only helps the rumor travel.",{"research":2,"patience":1,"scrutiny":-1}],["Let a trusted supporter answer first while you stay focused on the day plan.",{"coalition":2,"team":1,"field":1}]]},{"id":"ai-pattern-002","bucket":"patterns","tag":"The Repeated Move","text":"A volunteer keeps recommending the same tactic for every problem. What do you do?","answers":[["Thank them, then ask what evidence says this problem is the same as the last one.",{"research":2,"team":1}],["Use the tactic again because consistency helps people understand the campaign.",{"discipline":2,"message":1}],["Ask the room for one safe option and one unexpected option before deciding.",{"adaptability":2,"team":1,"curiosity":1}],["Assign the volunteer to a job where repetition is useful instead of letting it steer strategy.",{"field":2,"team":1,"patience":1}]]},{"id":"ai-pattern-003","bucket":"attention","tag":"Too Much Briefing","text":"The morning folder has ten updates, but you have time to read only four before the first meeting. What gets priority?","answers":[["Anything tied to today’s schedule, deadlines, or legal risk.",{"attention":2,"rules":2,"discipline":1}],["Anything involving people you will see in person today.",{"empathy":2,"field":1,"coalition":1}],["Anything that changed since yesterday.",{"research":2,"curiosity":1,"adaptability":1}],["Anything likely to become public before noon.",{"press":2,"message":1,"scrutiny":1}]]},{"id":"ai-pattern-004","bucket":"opposition","tag":"The Quiet Pattern","text":"A rival stops attacking one issue and suddenly starts talking about turnout. What do you ask first?","answers":[["Which precincts changed on their side of the map?",{"field":2,"research":1,"opposition":1}],["Which group of voters are they trying to reassure?",{"coalition":1,"message":1,"research":1}],["Whether this is a real shift or a distraction from another problem.",{"curiosity":2,"cunning":1,"opposition":1}],["Whether we are still doing the basics well enough to ignore the noise.",{"discipline":2,"attention":1,"field":1}]]},{"id":"ai-pattern-005","bucket":"ethics","tag":"Useful Information","text":"A supporter offers a private list of families who might be upset about the contract dispute. What do you do with it?","answers":[["Ask how the list was made before anyone uses it.",{"rules":2,"ethics":2,"compliance":1}],["Use it only to plan public outreach, not personal pressure.",{"inclusion":2,"ethics":1,"field":1}],["Give it to the field lead and ask for a safer version based on public data.",{"field":2,"compliance":1,"team":1}],["Decline it and look for information you can defend publicly.",{"trust":2,"rules":1,"scrutiny":-1}]]},{"id":"ai-pattern-006","bucket":"surprise","tag":"Readable Surprise","text":"Your campaign needs to do something unexpected without confusing voters. Which move feels safest?","answers":[["Hold a small event in a place the campaign has ignored, with a clear reason for being there.",{"field":2,"inclusion":1,"adaptability":1}],["Release one plain-language promise that forces the opponent to answer details.",{"message":2,"policy":1,"opposition":1}],["Let a coalition partner lead a public moment instead of standing in the center yourself.",{"coalition":2,"trust":1,"privacy":1}],["Say no to one invitation publicly so people see what you are prioritizing.",{"discipline":2,"attention":1,"scrutiny":1}]]},{"id":"ai-pattern-007","bucket":"world","tag":"The Missing Context","text":"A clip of you is spreading without the full conversation. What matters most before responding?","answers":[["Whether the missing context changes the meaning or only adds detail.",{"press":2,"research":1,"message":1}],["Who is sharing it and what they want people to feel.",{"opposition":2,"cunning":1,"press":1}],["Whether the people in the room understood you differently than the clip suggests.",{"empathy":2,"trust":1,"coalition":1}],["Whether responding would make more people see the clip.",{"attention":2,"discipline":1,"scrutiny":-1}]]},{"id":"ai-pattern-008","bucket":"staff","tag":"Human Limits","text":"Your best staffer admits they missed a detail because the week has been too crowded. What do you do?","answers":[["Reduce the day plan before more mistakes become public.",{"attention":2,"team":1,"fatigue":-2}],["Move the detail to the compliance person and keep the schedule intact.",{"compliance":2,"discipline":1,"team":1}],["Ask what system would have caught the detail earlier.",{"research":2,"team":1,"rules":1}],["Thank them for saying it and cancel one lower-value event.",{"trust":1,"fatigue":-2,"attention":1}]]},{"id":"ai-pattern-009","bucket":"adaptation","tag":"The Good Mistake","text":"The other campaign makes a small public mistake that feels human, not malicious. What do you do?","answers":[["Ignore it and keep your contrast focused on the issue.",{"trust":2,"message":1,"scrutiny":-1}],["Use it gently as proof that their operation is under pressure.",{"opposition":2,"press":1,"scrutiny":1}],["Watch whether the mistake reveals a deeper pattern before saying anything.",{"research":2,"patience":1,"attention":1}],["Ask your team whether you have made the same mistake privately.",{"team":2,"ethics":1,"fatigue":-1}]]},{"id":"ai-pattern-010","bucket":"profile","tag":"Being Read","text":"A reporter says people still cannot decide what kind of candidate you are. How do you treat that?","answers":[["As a warning that the message needs fewer moving parts.",{"message":2,"discipline":1}],["As an opening to let different groups meet you directly.",{"field":1,"coalition":2,"empathy":1}],["As useful uncertainty, as long as your actions stay consistent.",{"adaptability":2,"trust":1,"privacy":1}],["As a sign that the campaign should explain the problem more plainly.",{"policy":2,"press":1,"message":1}]]},{"id":"ai-pattern-011","bucket":"flow","tag":"The Day Pushes Back","text":"Three plans collide: a donor call, a parent meeting, and a filing correction. What moves first?","answers":[["The filing correction. Deadlines do not care how good the campaign feels.",{"rules":2,"compliance":2,"attention":1}],["The parent meeting. Direct voter trust is hard to rebuild once lost.",{"trust":2,"field":1,"empathy":1}],["The donor call, but only if the treasurer confirms it funds voter contact.",{"money":2,"discipline":1,"field":1}],["A five-minute team reset so the choice is made once, not argued all day.",{"team":2,"attention":1,"fatigue":-1}]]},{"id":"ai-pattern-012","bucket":"world","tag":"Unseen Work","text":"A staffer says the opponent is probably doing work you cannot see yet. What is the most useful assumption?","answers":[["They are identifying supporters while we are watching headlines.",{"field":2,"opposition":1,"attention":1}],["They are testing messages with people who will never talk to us.",{"research":2,"message":1,"opposition":1}],["They are looking for a paperwork mistake.",{"compliance":2,"rules":1,"scrutiny":1}],["They are tired too, and may be easier to read if we stop overreacting.",{"patience":2,"adaptability":1,"fatigue":-1}]]},{"id":"ai-pattern-013","bucket":"clarity","tag":"Visible Cause","text":"A choice you made yesterday helped today, but nobody can see why. What do you want the campaign to do?","answers":[["Record it in the notebook so the team learns the pattern.",{"research":2,"team":1,"attention":1}],["Turn the result into a simple public story without revealing the private work.",{"message":2,"press":1,"trust":1}],["Ask whether it can be repeated or whether it worked only once.",{"adaptability":2,"curiosity":1}],["Leave it alone because not every advantage needs a speech.",{"privacy":2,"cunning":1,"scrutiny":-1}]]},{"id":"ai-pattern-014","bucket":"support","tag":"Useful Support","text":"An ally wants to help but keeps asking for exact instructions. What support do you give them?","answers":[["A clear task, a deadline, and the reason it matters.",{"team":2,"field":1,"discipline":1}],["A few safe boundaries, then room to use their own judgment.",{"coalition":2,"trust":1,"adaptability":1}],["A script that keeps the message consistent.",{"message":2,"discipline":1}],["A private conversation about what they already know that the campaign does not.",{"research":1,"empathy":2,"coalition":1}]]},{"id":"ai-pattern-015","bucket":"opposition","tag":"The Fair Advantage","text":"You can legally study public records before the opponent knows you are looking. What boundary matters?","answers":[["Use public facts, not personal humiliation.",{"ethics":2,"trust":1,"opposition":1}],["Ask the compliance lead to mark what can be used safely.",{"compliance":2,"rules":1}],["Look for patterns that affect voters, not gossip that only entertains the room.",{"research":2,"policy":1,"message":1}],["Wait until there is a clear reason to spend time on it.",{"attention":2,"discipline":1,"fatigue":-1}]]},{"id":"ai-pattern-016","bucket":"pacing","tag":"Not Every Door","text":"The field lead says more doors would help, but your body is starting to crash. What do you do?","answers":[["Shift to phone calls and protect tomorrow’s event.",{"fatigue":-2,"field":1,"attention":1}],["Send volunteers with a clearer script and stay available for hard follow-ups.",{"team":2,"field":1,"message":1}],["Choose the one block where your presence matters most.",{"discipline":2,"field":1,"fatigue":-1}],["Cancel the weakest event and say why internally, not publicly.",{"privacy":1,"team":1,"fatigue":-2}]]},{"id":"ai-pattern-017","bucket":"learning","tag":"After the Result","text":"A choice did not work, but you are not sure whether the idea was bad or the timing was bad. What do you ask?","answers":[["What signal would have told us this before we acted?",{"research":2,"attention":1}],["Who changed their mind, and why?",{"field":2,"empathy":1}],["Did the choice fail publicly or only inside our expectations?",{"press":1,"message":1,"adaptability":1}],["What should we stop doing for one day while we learn from it?",{"fatigue":-1,"discipline":1,"team":1}]]},{"id":"ai-pattern-018","bucket":"agency","tag":"People Are Not Pieces","text":"A coalition partner agrees with your goal but refuses to be treated like a campaign prop. What is your first response?","answers":[["Ask what role would feel honest to them.",{"coalition":2,"empathy":2,"trust":1}],["Explain the campaign need and invite them to reshape the event.",{"team":1,"coalition":2,"message":1}],["Separate their public support from their private advice.",{"privacy":1,"coalition":1,"research":1}],["Thank them and remove them from the photo plan before resentment grows.",{"trust":1,"fatigue":-1,"coalition":1}]]},{"id":"process-001","bucket":"process","tag":"Messy Request","text":"A volunteer gives you three pages of complaints, ideas, and half-finished notes before a strategy meeting. What do you do first?","answers":[["Turn the notes into a short action list before deciding what deserves time.",{"discipline":2,"team":1,"attention":1}],["Ask the volunteer which one problem they most need solved today.",{"empathy":2,"curiosity":1,"coalition":1}],["Hand the notes to the research lead and ask for patterns by tomorrow.",{"research":2,"delegation":1,"patience":1}],["Use one sharp example from the notes in your next public answer.",{"message":2,"press":1,"showmanship":1}]]},{"id":"process-002","bucket":"process","tag":"Permission Line","text":"A staffer is ready to send a campaign-wide memo you have not reviewed. What do you do?","answers":[["Pause it and review the wording before it leaves the office.",{"compliance":2,"discipline":1,"team":1}],["Ask what parts of the memo are facts and what parts are recommendations.",{"research":2,"attention":1,"policy":1}],["Let them send it if it fits the approved message and deadline.",{"delegation":2,"team":1,"message":1}],["Rewrite it yourself because the campaign cannot afford mistakes right now.",{"control":2,"fatigue":1,"message":1}]]},{"id":"process-003","bucket":"process","tag":"Good Enough Brief","text":"You have ten minutes before a parent meeting and a stack of background notes. What is the best use of that time?","answers":[["Read the summary, risks, and names you are likely to hear in the room.",{"attention":2,"research":1,"discipline":1}],["Ask a staffer to flag anything that could embarrass the campaign.",{"delegation":2,"team":1,"compliance":1}],["Skim everything quickly so nothing feels completely unfamiliar.",{"curiosity":2,"fatigue":1,"attention":-1}],["Ignore the notes and focus on listening once you arrive.",{"empathy":2,"coalition":1,"research":-1}]]},{"id":"process-004","bucket":"process","tag":"Parallel Help","text":"Three campaign problems appear at once: a flyer typo, a volunteer question, and a reporter deadline. How do you respond?","answers":[["Assign each problem to the person best placed to handle it and ask for short updates.",{"team":2,"delegation":2,"attention":1}],["Handle the reporter first because public mistakes travel fastest.",{"press":2,"message":1,"fatigue":1}],["Fix the flyer first because printed mistakes live longer than apologies.",{"compliance":1,"message":1,"discipline":1}],["Pause and decide which problem can safely wait ten minutes.",{"attention":2,"patience":1,"adaptability":1}]]},{"id":"process-005","bucket":"process","tag":"Readable Folder","text":"Your campaign files are technically complete, but only one person understands where anything is. What do you do?","answers":[["Create a simple folder map so any trusted staffer can find the right file.",{"team":2,"compliance":1,"discipline":1}],["Leave it alone because one careful person is safer than a messy crowd.",{"privacy":2,"control":1,"team":-1}],["Ask each room lead to label the files they use most often.",{"delegation":2,"coalition":1,"team":1}],["Use the confusion as a reason to centralize decisions through you.",{"cunning":2,"fatigue":1,"control":1}]]},{"id":"process-006","bucket":"process","tag":"Review Queue","text":"A supporter drafts a social post that is exciting but slightly inaccurate. What do you do?","answers":[["Approve the energy but require a factual correction before posting.",{"message":2,"compliance":1,"trust":1}],["Reject it and explain the exact line that creates the problem.",{"discipline":2,"team":1,"attention":1}],["Ask whether the same point can be made through a personal story instead.",{"empathy":2,"message":1,"press":1}],["Let it post now and correct it later if anyone notices.",{"risk":2,"press":1,"compliance":-2}]]},{"id":"process-007","bucket":"process","tag":"Unclear Task","text":"A staffer asks what to do next, but the campaign has six possible priorities. What do you say?","answers":[["Ask them to recommend the next task and explain why it matters today.",{"delegation":2,"team":1,"attention":1}],["Give them the safest task that cannot create public damage.",{"compliance":2,"discipline":1,"rules":1}],["Pick the task that gets the campaign closest to a voter conversation.",{"field":2,"research":1,"coalition":1}],["Keep them nearby until you decide where the campaign is weakest.",{"control":2,"fatigue":1,"attention":-1}]]},{"id":"process-008","bucket":"process","tag":"After the Fix","text":"A team member fixes a small public error. What do you need from them before moving on?","answers":[["A short note explaining what changed, why it changed, and how it was checked.",{"team":2,"compliance":1,"attention":1}],["A private apology to anyone who was put in a bad position by the mistake.",{"empathy":2,"trust":1,"coalition":1}],["A quick scan for similar errors elsewhere in the campaign.",{"research":2,"discipline":1,"compliance":1}],["Nothing more; thank them and do not turn a small fix into a meeting.",{"fatigue":-1,"team":1,"attention":1}]]},{"id":"process-009","bucket":"process","tag":"Hidden Complexity","text":"A consultant wants to show you a complicated model that predicts the race. What do you ask for first?","answers":[["The few assumptions that most change the recommendation.",{"research":2,"attention":1,"policy":1}],["A plain-language version staff can use without worshiping the model.",{"team":2,"message":1,"discipline":1}],["The voter groups where the model is least confident.",{"field":2,"research":1,"adaptability":1}],["A bold headline you can use if the numbers are favorable.",{"press":2,"showmanship":1,"message":1}]]},{"id":"process-010","bucket":"process","tag":"Slow Down","text":"The campaign has improved quickly, but the work is starting to feel like a pile of open loops. What do you do?","answers":[["Close three small loops before opening a new strategy question.",{"attention":2,"fatigue":-1,"discipline":1}],["Ask the team what is unclear, not what is unfinished.",{"team":2,"empathy":1,"coalition":1}],["Move one decision to tomorrow and protect tonight’s recovery.",{"fatigue":-2,"privacy":1,"patience":1}],["Push through because momentum matters more than comfort right now.",{"ambition":2,"fatigue":2,"press":1}]]},{"id":"process-011","bucket":"process","tag":"Staff Tool","text":"A new volunteer is capable, but they need very specific instructions to be useful. What do you give them?","answers":[["A narrow task, the folder or person they need, and what finished looks like.",{"delegation":2,"team":1,"discipline":1}],["A broad mission and room to surprise you.",{"adaptability":2,"coalition":1,"risk":1}],["A simple script so they can make voter calls without improvising facts.",{"field":2,"message":1,"compliance":1}],["A shadowing shift before they touch anything public.",{"patience":2,"team":1,"compliance":1}]]},{"id":"process-012","bucket":"process","tag":"Ask or Act","text":"A trusted staffer can either answer your question quickly or take action without waiting. Which do you choose?","answers":[["Ask for the answer first because the decision still belongs to you.",{"attention":2,"discipline":1,"privacy":1}],["Authorize action if the boundaries and goal are already clear.",{"delegation":2,"team":1,"adaptability":1}],["Have them draft options and bring back risks before anything moves.",{"research":2,"compliance":1,"team":1}],["Tell them to act, then accept responsibility if it goes sideways.",{"duty":2,"risk":1,"loyalty":1}]]},{"id":"process-013","bucket":"process","tag":"Tool Fatigue","text":"A helpful system is becoming another thing the team has to maintain. What do you do?","answers":[["Keep only the parts that reduce confusion during live campaign days.",{"attention":2,"team":1,"discipline":1}],["Assign one person to maintain it so everyone else can use it lightly.",{"delegation":2,"team":1,"fatigue":-1}],["Shut it down until the campaign can explain why it matters.",{"discipline":2,"fatigue":-1,"research":-1}],["Add more detail because future mistakes are expensive.",{"compliance":2,"fatigue":1,"rules":1}]]},{"id":"process-014","bucket":"process","tag":"Feedback Gift","text":"Someone gives blunt criticism of the campaign’s latest flyer. What do you do first?","answers":[["Ask which part confused them before defending the design.",{"empathy":2,"message":1,"attention":1}],["Compare their reaction to what the campaign wanted the flyer to do.",{"research":2,"message":1,"discipline":1}],["Thank them and decide privately whether they are the target audience.",{"cunning":2,"patience":1,"privacy":1}],["Rewrite the flyer immediately while the problem is fresh.",{"adaptability":2,"fatigue":1,"message":1}]]},{"id":"process-015","bucket":"process","tag":"Review Before Sleep","text":"The team wants to keep working late because progress finally feels exciting. What do you do?","answers":[["Do one short review, save the plan, and stop before the room gets sloppy.",{"fatigue":-2,"attention":2,"team":1}],["Let them continue if the work is low-risk and clearly scoped.",{"delegation":2,"team":1,"adaptability":1}],["Move the exciting ideas into tomorrow’s brief instead of acting now.",{"discipline":2,"attention":1,"patience":1}],["Ride the energy and make the big changes tonight.",{"ambition":2,"fatigue":2,"risk":1}]]},{"id":"process-016","bucket":"process","tag":"Nontechnical Explanation","text":"A supporter asks how your campaign operation works, and they are nervous about jargon. What do you do?","answers":[["Explain the process in plain language using one example from today.",{"trust":2,"message":1,"empathy":1}],["Show them the task board and let them ask questions at their pace.",{"inclusion":2,"team":1,"attention":1}],["Avoid the operational details and talk about the campaign’s values.",{"message":2,"press":1,"research":-1}],["Ask what part feels intimidating before deciding how much to explain.",{"curiosity":2,"empathy":1,"coalition":1}]]},{"id":"process-017","bucket":"process","tag":"Discoverable Campaign","text":"A new staffer joins and needs to understand the campaign quickly. What do you make sure they can find?","answers":[["The current goal, today’s priorities, and who owns each active task.",{"team":2,"attention":1,"discipline":1}],["The message guide, voter targets, and approved public language.",{"message":2,"field":1,"compliance":1}],["The risks folder, rules calendar, and approval process.",{"compliance":2,"rules":1,"team":1}],["The people map: who matters, who knows whom, and who is sensitive.",{"coalition":2,"research":1,"cunning":1}]]},{"id":"process-018","bucket":"process","tag":"Too Many Helpers","text":"Several people offer to work on the same problem at once. What is the safest next move?","answers":[["Give each person a separate part and define where their work should meet.",{"team":2,"delegation":2,"attention":1}],["Choose one person and keep the rest available for later.",{"discipline":2,"fatigue":-1,"team":1}],["Let them all try and compare the best results afterward.",{"adaptability":2,"risk":1,"research":1}],["Redirect the extra help toward voter contact instead.",{"field":2,"volunteers":1,"team":1}]]}],"CHARACTERS":[{"id":"mara","name":"Mara Chen","role":"Campaign Manager","bio":"Keeps the calendar, asks the hard question before a decision becomes expensive, and protects the campaign from drifting into vibes."},{"id":"luz","name":"Luz Ortega","role":"Field Lead","bio":"Tracks real voters, volunteer capacity, access barriers, and whether excitement is becoming actual supporter IDs."},{"id":"daryl","name":"Daryl Price","role":"Treasurer / Compliance","bio":"Reads the small print, hates shortcuts, and knows a sloppy receipt can become tomorrow morning’s headline."},{"id":"owen","name":"Owen Slate","role":"Press and Digital","bio":"Turns the campaign’s message into public language and worries about clips, comments, reporters, and overexposure."},{"id":"kenna","name":"Kenna Brooks","role":"Teachers Association Contact","bio":"Respects preparation, hates empty promises, and can tell whether you understand the limits of a school-board seat."},{"id":"nia","name":"Nia Patel","role":"Student Journalist","bio":"Runs the student paper’s civic series. She is fair, sharp, and very good at noticing when adults talk around a question."},{"id":"rusk","name":"Victor Rusk","role":"Opponent","bio":"Incumbent-adjacent operator with long relationships, disciplined donors, and a practiced way of sounding inevitable."},{"id":"junie","name":"Reverend June Bell","role":"Community Convener","bio":"Does not endorse early. She watches who listens before asking for applause."},{"id":"celia","name":"Celia Park","role":"election-office clerk","bio":"calm, exact, and tired of campaigns treating deadlines as suggestions"},{"id":"tamsin","name":"Tamsin Roe","role":"parent organizer","bio":"keeps a private spreadsheet of who follows through and who only performs concern"},{"id":"edan","name":"Edan Webb","role":"opposition watcher","bio":"not cruel, just comfortable finding weak points before anyone else does"},{"id":"priya","name":"Priya Sato","role":"student paper editor","bio":"asks short questions that make adults reveal whether they prepared"},{"id":"rev-mendez","name":"Rev. Mendez","role":"civic observer organizer","bio":"believes trust is built by boring procedures done visibly and fairly"},{"id":"sal","name":"Sal Imani","role":"pattern volunteer","bio":"tracks repeated moves, quiet shifts, and the difference between a real trend and a coincidence"},{"id":"grell","name":"Tomas Grell","role":"Rusk campaign aide","bio":"polite in public, fast with assumptions, and paid to make your strengths look predictable"}],"ROOMS":[{"id":"plan","name":"Campaign Plan","hint":"Research, strategy, vote goal, calendar, and where the next week can be won or wasted."},{"id":"field","name":"Field Map","hint":"Precinct targeting, voter contact, supporter IDs, volunteer shifts, access, and GOTV readiness."},{"id":"message","name":"Message Desk","hint":"Message box, plain-language policy, palm card, debate prep, and contrast without losing yourself."},{"id":"coalition","name":"Coalition Desk","hint":"Teachers, parents, youth, civic leaders, endorsements, and the slow work of trust."},{"id":"press","name":"Press Room","hint":"Local paper, student media, digital comments, clips, crisis response, and earned media."},{"id":"finance","name":"Finance & Compliance","hint":"Call time, budget tradeoffs, donor pressure, reports, receipts, and legal risk."},{"id":"rules","name":"Election Authority","hint":"Filing, ballot access, voter registration, polling-place issues, observers, and legitimacy."},{"id":"candidate","name":"Candidate Room","hint":"Leadership style, fatigue, delegation, family pressure, and the private cost of public life."},{"id":"briefing","name":"Morning Brief","hint":"Limited attention, source choice, what you learn, and what you miss before the day starts."},{"id":"operations","name":"Operations Desk","hint":"Task handoffs, review queues, staff instructions, approval boundaries, and making the campaign easier to run without exposing the machinery."},{"id":"government","name":"Governing Map","hint":"The quiet institutional folder: authority, committees, agencies, rules, and what power can actually do after winning."},{"id":"opposition","name":"Opposition Watch","hint":"Rival moves, repeated patterns, surprise, fair research, and what the other campaign thinks you will do next."}],"ENCOUNTERS":[{"id":"morning-brief","room":"plan","title":"The First Real Morning Brief","phase":"Research & ID","day":1,"summary":"Mara has converted the manuals into a wall calendar. The board race suddenly looks less like a speech contest and more like an operation with deadlines.","stakes":["Sets campaign rhythm","Introduces finite resources","Builds the first week calendar"],"steps":[{"speaker":"Mara Chen","body":"“We can chase everything and become a fog machine, or we can choose what actually moves votes. First decision: do we start with the map, the message, or the rules?”","choices":[{"text":"Start with the map: turnout, precincts, and who can realistically be contacted.","effects":{"research":2,"field":1,"discipline":1},"next":"brief-2","note":""},{"text":"Start with the message: why you, why now, why this office.","effects":{"message":2,"trust":1},"next":"brief-2","note":""},{"text":"Start with rules: filing, finance guardrails, and election-office procedures.","effects":{"compliance":2,"rules":1},"next":"brief-2","note":""},{"text":"Start with a launch event and trust the details to catch up.","effects":{"press":1,"money":-1,"discipline":-2},"next":"brief-2","note":""}]},{"id":"brief-2","speaker":"Mara Chen","body":"Mara pins four words to the board: Research, Persuasion, GOTV, Election Day. “The calendar is now a character in this campaign. It will not be impressed by our feelings.”","choices":[{"text":"Ask her to put deadlines, not dreams, on the board.","effects":{"discipline":2,"research":1,"day":1},"next":null,"note":""},{"text":"Ask for a daily check-in even if it is uncomfortable.","effects":{"team":2,"fatigue":1,"day":1},"next":null,"note":""},{"text":"Ask to keep Saturdays open unless an emergency hits.","effects":{"fatigue":-1,"field":-1,"day":1},"next":null,"note":""},{"text":"Tell everyone this will be easy if you stay positive.","effects":{"morale":1,"research":-1,"day":1},"next":null,"note":""}]}]},{"id":"win-number","room":"plan","title":"The Win Number Is Not a Vibe","phase":"Research & ID","day":1,"summary":"Luz brings past turnout, a rough voter universe, and three different ways to lie to yourself with numbers.","stakes":["Vote goal","Targeting discipline","False confidence risk"],"steps":[{"speaker":"Luz Ortega","body":"“Past elections say about 5,200 people vote in this race. With three candidates, the safe number is not just one vote over a guess. How conservative do we want to be?”","choices":[{"text":"Set a safe target above the bare minimum and build a cushion.","effects":{"research":2,"field":2,"money":-1},"next":"win-2","note":""},{"text":"Use the most optimistic turnout estimate.","effects":{"morale":1,"risk":2,"research":-1},"next":"win-2","note":""},{"text":"Avoid a number until polling looks better.","effects":{"patience":1,"discipline":-2},"next":"win-2","note":""},{"text":"Ask if the number changes if turnout drops among parents.","effects":{"research":2,"policy":1},"next":"win-2","note":""}]},{"id":"win-2","speaker":"Luz Ortega","body":"The number becomes less magical once it is written down. It turns into doors, calls, rides, and people who may need to hear from you more than once.","choices":[{"text":"Convert the win target into weekly contact goals.","effects":{"field":3,"discipline":2,"day":1},"next":null,"note":""},{"text":"Convert it into a donor pitch: every dollar buys specific voter contact.","effects":{"money":2,"field":1,"day":1},"next":null,"note":""},{"text":"Use it as a team morale speech, but hide the math.","effects":{"morale":1,"transparency":-1,"day":1},"next":null,"note":""},{"text":"Put the math in the plan and admit it may change.","effects":{"research":2,"trust":1,"day":1},"next":null,"note":""}]}]},{"id":"rules-filing","room":"rules","title":"The Filing Window","phase":"Research & ID","day":2,"summary":"Daryl finds a footnote in the filing packet. The deadline is not hard to meet, but it is very easy to misunderstand.","stakes":["Ballot access","Compliance baseline","Legitimacy"],"steps":[{"speaker":"Daryl Price","body":"“This is how campaigns get stupid. Not with a grand scandal. With one form, one signature, and one person saying ‘probably fine.’”","choices":[{"text":"Complete a filing checklist and request written confirmation from the election office.","effects":{"compliance":3,"rules":2,"discipline":1},"next":"filing-2","note":""},{"text":"Let Daryl handle it alone; you need to be visible.","effects":{"compliance":1,"visibility":1,"team":-1},"next":"filing-2","note":""},{"text":"Ask Victor Rusk’s old clerk how they did it last time.","effects":{"insider":1,"risk":1},"next":"filing-2","note":""},{"text":"Wait until the deadline so the launch can come first.","effects":{"press":1,"compliance":-3,"risk":2},"next":"filing-2","note":""}]},{"id":"filing-2","speaker":"Election Office Clerk","body":"The clerk sounds tired but relieved when you ask for the same written rule everyone should receive. “Most people just yell at us after the fact.”","choices":[{"text":"Thank the clerk and share the neutral deadline reminder publicly.","effects":{"trust":2,"rules":2,"day":1},"next":null,"note":""},{"text":"Keep the reminder private so rivals may trip.","effects":{"cunning":2,"institution":-2,"day":1},"next":null,"note":""},{"text":"Ask if poll-worker training materials are available too.","effects":{"rules":1,"research":1,"day":1},"next":null,"note":""},{"text":"Use the call to complain about Rusk.","effects":{"press":1,"trust":-1,"day":1},"next":null,"note":""}]}]},{"id":"field-first-shift","room":"field","title":"First Door Shift","phase":"Research & ID","day":2,"summary":"Your first canvass list has strong supporters, weak supporters, and voters who have never heard your name.","stakes":["Supporter IDs","Persuasion list","Volunteer confidence"],"steps":[{"speaker":"Luz Ortega","body":"“The manual answer is easy: identify, persuade, mobilize. The human answer is messier: volunteers get nervous when strangers open doors.”","choices":[{"text":"Train volunteers with a simple script and a clear way to mark voter responses.","effects":{"field":3,"volunteers":1,"research":1},"next":"doors-2","note":""},{"text":"Send everyone out fast so they learn by doing.","effects":{"field":1,"volunteers":-1,"risk":1},"next":"doors-2","note":""},{"text":"Only knock friendly houses to build morale.","effects":{"morale":1,"field":-1},"next":"doors-2","note":""},{"text":"Go alone so the candidate carries the day.","effects":{"visibility":1,"fatigue":1,"field":-1},"next":"doors-2","note":""}]},{"id":"doors-2","speaker":"Volunteer","body":"A volunteer returns with three checked boxes, two scribbled stories, and one door that wanted Spanish materials. The system either catches this or loses it.","choices":[{"text":"Create follow-up buckets: supporter, persuadable, needs info, access/language need.","effects":{"field":3,"inclusion":2,"day":1},"next":null,"note":""},{"text":"Count only total doors knocked.","effects":{"field":1,"research":-1,"day":1},"next":null,"note":""},{"text":"Ask volunteers for stories at debrief, then match them to data.","effects":{"team":1,"research":2,"day":1},"next":null,"note":""},{"text":"Let volunteers keep notes in their own phones.","effects":{"speed":1,"compliance":-1,"day":1},"next":null,"note":""}]}]},{"id":"message-box","room":"message","title":"The Message Box Session","phase":"Research & ID","day":3,"summary":"Owen draws four squares: what we say about us, what we say about them, what they say about them, what they say about us.","stakes":["Contrast","Opponent framing","Message discipline"],"steps":[{"speaker":"Owen Slate","body":"“Rusk will call you new, risky, and soft on discipline. We can pretend that will not happen, or we can be ready without becoming ugly.”","choices":[{"text":"Define your positive case first: students, classrooms, accountability.","effects":{"message":2,"policy":2},"next":"box-2","note":""},{"text":"Define Rusk’s weaknesses first.","effects":{"research":2,"press":1},"next":"box-2","note":""},{"text":"Ask what voters already believe before writing anything.","effects":{"research":2,"message":1},"next":"box-2","note":""},{"text":"Tell Owen you do not want negative politics in the campaign.","effects":{"civility":2,"message":-1},"next":"box-2","note":""}]},{"id":"box-2","speaker":"Owen Slate","body":"The room relaxes once contrast stops meaning cruelty. The campaign can tell voters a choice exists without turning every sentence into a knife.","choices":[{"text":"Write one contrast line tied to a real record and one concrete promise.","effects":{"message":3,"research":1,"day":1},"next":null,"note":""},{"text":"Write a softer line that avoids naming Rusk.","effects":{"civility":1,"message":1,"day":1},"next":null,"note":""},{"text":"Write a sharper line for debate only.","effects":{"press":1,"risk":1,"day":1},"next":null,"note":""},{"text":"Delay the contrast until after the first attack.","effects":{"patience":1,"message":-1,"day":1},"next":null,"note":""}]}]},{"id":"palm-card","room":"message","title":"The Palm Card That Cannot Say Everything","phase":"Persuasion","day":5,"summary":"The first printed piece is due. Everyone wants their favorite issue included. The card has two sides, not a soul.","stakes":["Plain language","Budget","Message clarity"],"steps":[{"speaker":"Mara Chen","body":"“The card must pass the grocery-line test. If a voter reads it for eight seconds, what do they know?”","choices":[{"text":"Use one reason for running, three priorities, and a clear voting reminder.","effects":{"message":3,"money":-1,"discipline":1},"next":"palm-2","note":""},{"text":"List every policy to prove seriousness.","effects":{"policy":2,"message":-2,"money":-1},"next":"palm-2","note":""},{"text":"Use mostly a photo and slogan.","effects":{"visibility":1,"message":-1},"next":"palm-2","note":""},{"text":"Let each coalition add one sentence.","effects":{"coalition":1,"message":-2},"next":"palm-2","note":""}]},{"id":"palm-2","speaker":"Daryl Price","body":"Daryl points to a tiny line at the bottom: paid for by the campaign. “Design is persuasion. This line is survival.”","choices":[{"text":"Approve the card only after compliance language is checked.","effects":{"compliance":2,"message":1,"day":1},"next":null,"note":""},{"text":"Rush print and fix errors in the next batch.","effects":{"speed":1,"compliance":-2,"day":1},"next":null,"note":""},{"text":"Cut print quantity and rely more on doors.","effects":{"money":1,"field":1,"day":1},"next":null,"note":""},{"text":"Ask a donor to print extras separately.","effects":{"money":1,"compliance":-3,"day":1},"next":null,"note":""}]}]},{"id":"parent-coffee","room":"coalition","title":"Parent Coffee, No Microphone","phase":"Persuasion","day":6,"summary":"Reverend June offers a small parent coffee. No stump speech. No signs. Just questions, tired faces, and the feeling that schools are personal.","stakes":["Listening","Coalition trust","Policy realism"],"steps":[{"speaker":"Reverend June Bell","body":"“If you came to perform, the coffee is by the door. If you came to listen, sit down.”","choices":[{"text":"Ask parents what has changed in their daily school routine since last year.","effects":{"trust":2,"policy":2,"coalition":1},"next":"coffee-2","note":""},{"text":"Open with your three-point plan.","effects":{"message":1,"trust":-1},"next":"coffee-2","note":""},{"text":"Ask only supporters to speak first.","effects":{"control":1,"trust":-2},"next":"coffee-2","note":""},{"text":"Take notes and say very little.","effects":{"patience":2,"message":-1},"next":"coffee-2","note":""}]},{"id":"coffee-2","speaker":"Parent","body":"A parent describes a child moved between classrooms midyear. It is specific, painful, and not easily turned into a slogan.","choices":[{"text":"Reflect the concern, ask permission before using any story publicly, and connect it to staffing stability.","effects":{"empathy":2,"privacy":2,"policy":1,"day":1},"next":null,"note":""},{"text":"Ask for a photo together immediately.","effects":{"press":1,"trust":-1,"day":1},"next":null,"note":""},{"text":"Promise the issue will never happen again.","effects":{"trust":-2,"policy":-1,"day":1},"next":null,"note":""},{"text":"Ask Mara to record every concern for a policy memo.","effects":{"policy":2,"research":1,"day":1},"next":null,"note":""}]}]},{"id":"teacher-interview","room":"coalition","title":"Teachers Association Interview","phase":"Persuasion","day":8,"summary":"Kenna Brooks is not hostile. That makes the meeting more dangerous, not less. She is listening for precision.","stakes":["Endorsement path","Policy honesty","Feasibility"],"steps":[{"speaker":"Kenna Brooks","body":"“Tell me one thing you can do as a board member, one thing you need a majority for, and one thing you cannot honestly promise.”","choices":[{"text":"Answer in those three categories and name the coalition needed for each.","effects":{"coalition":3,"policy":2,"trust":2},"next":"teacher-2","note":""},{"text":"Say you will fight for teachers no matter what.","effects":{"coalition":1,"message":1,"policy":-2},"next":"teacher-2","note":""},{"text":"Attack Rusk for ignoring teachers.","effects":{"press":1,"coalition":-1},"next":"teacher-2","note":""},{"text":"Admit you need more time with the budget.","effects":{"humility":1,"research":1},"next":"teacher-2","note":""}]},{"id":"teacher-2","speaker":"Kenna Brooks","body":"Kenna does not smile, but she writes something down. “That is the first answer today that understood the office.”","choices":[{"text":"Ask what teachers need candidates to stop pretending about.","effects":{"coalition":2,"policy":2,"day":1},"next":null,"note":""},{"text":"Ask whether an endorsement is possible.","effects":{"coalition":1,"risk":1,"day":1},"next":null,"note":""},{"text":"Ask for a public photo only if the association approves.","effects":{"press":1,"trust":1,"day":1},"next":null,"note":""},{"text":"Leave before they find harder questions.","effects":{"fatigue":-1,"coalition":-1,"day":1},"next":null,"note":""}]}]},{"id":"call-time","room":"finance","title":"Call Time Is Part of the Campaign","phase":"Persuasion","day":4,"summary":"The campaign has enthusiasm and not enough money. Daryl sets a phone, a list, and a timer on the desk.","stakes":["Budget survival","Candidate discomfort","Donor influence"],"steps":[{"speaker":"Daryl Price","body":"“This is not begging. It is asking people to invest in a legal, reported, voter-facing operation. Do not apologize for doing it correctly.”","choices":[{"text":"Make the calls with a clear ask and no special favors implied.","effects":{"money":3,"compliance":2,"fatigue":1},"next":"call-2","note":""},{"text":"Ask only close friends because strangers feel awful.","effects":{"money":1,"familyPressure":1},"next":"call-2","note":""},{"text":"Let a donor host a private strategy dinner first.","effects":{"money":2,"risk":2,"compliance":-1},"next":"call-2","note":""},{"text":"Post a small-dollar appeal instead of calling.","effects":{"digital":1,"money":1},"next":"call-2","note":""}]},{"id":"call-2","speaker":"Donor","body":"One donor asks, “If I max out, can you make sure my after-school vendor idea gets a hearing?” The room seems to lose temperature.","choices":[{"text":"Say contributions do not buy agenda access, but public comment rules apply to everyone.","effects":{"compliance":3,"trust":2,"money":-1,"day":1},"next":null,"note":""},{"text":"Say you are interested, but only because it might help kids.","effects":{"money":1,"compliance":-2,"risk":1,"day":1},"next":null,"note":""},{"text":"Hand the call to Daryl.","effects":{"team":1,"compliance":1,"leadership":-1,"day":1},"next":null,"note":""},{"text":"End the call and mark the donor as high risk.","effects":{"compliance":2,"money":-1,"day":1},"next":null,"note":""}]}]},{"id":"budget-tradeoff","room":"finance","title":"The Budget Tradeoff","phase":"Persuasion","day":7,"summary":"You cannot fund every good idea. The choice is mail, digital, walk cards, or a room rental for the debate watch party.","stakes":["Finite resources","Field vs visibility","Moral accounting"],"steps":[{"speaker":"Mara Chen","body":"“Every yes is a no wearing a nicer jacket. Pick what matches the strategy, not what calms the loudest person.”","choices":[{"text":"Fund walk cards and a smaller targeted mail piece.","effects":{"field":2,"message":1,"money":-2},"next":"budget-2","note":""},{"text":"Fund one glossy districtwide mailer.","effects":{"visibility":2,"money":-3,"field":-1},"next":"budget-2","note":""},{"text":"Fund digital only and hope targeting saves money.","effects":{"digital":2,"money":-1,"field":-1},"next":"budget-2","note":""},{"text":"Save the money for late crisis response.","effects":{"money":1,"message":-1},"next":"budget-2","note":""}]},{"id":"budget-2","speaker":"Luz Ortega","body":"Luz asks the question no one wants: “What does this buy in actual voter contacts?”","choices":[{"text":"Require every expense to name an audience and follow-up plan.","effects":{"discipline":2,"field":2,"money":1,"day":1},"next":null,"note":""},{"text":"Trust instinct; politics cannot be all math.","effects":{"charisma":1,"research":-1,"day":1},"next":null,"note":""},{"text":"Cancel all spending until the next poll.","effects":{"money":2,"field":-2,"day":1},"next":null,"note":""},{"text":"Ask each department to cut ten percent.","effects":{"team":1,"money":1,"day":1},"next":null,"note":""}]}]},{"id":"local-paper","room":"press","title":"Harbor Lamp Interview","phase":"Persuasion","day":9,"summary":"The local paper has a small staff and a long memory. Owen says the reporter likes concrete answers and hates being managed.","stakes":["Earned media","Message discipline","Human specificity"],"steps":[{"speaker":"Owen Slate","body":"“You are not trying to impress the reporter. You are trying to give voters a clean reason to understand you.”","choices":[{"text":"Prepare three plain answers and one local story with permission.","effects":{"press":2,"message":2,"privacy":1},"next":"paper-2","note":""},{"text":"Prepare six attacks on Rusk.","effects":{"press":1,"message":-1,"risk":1},"next":"paper-2","note":""},{"text":"Avoid specifics so nothing can be used against you.","effects":{"privacy":1,"press":-1},"next":"paper-2","note":""},{"text":"Ask Owen to sit beside you and interrupt if needed.","effects":{"team":1,"leadership":-1},"next":"paper-2","note":""}]},{"id":"paper-2","speaker":"Reporter","body":"“Your opponent says you have good intentions and no idea how the district actually works. Why are they wrong?”","choices":[{"text":"Bridge to the research you have done and the people shaping your plan.","effects":{"message":2,"research":2,"trust":1,"day":1},"next":null,"note":""},{"text":"Say Rusk is scared because he knows you are winning.","effects":{"press":1,"risk":1,"day":1},"next":null,"note":""},{"text":"Admit you are learning and name what you have already learned.","effects":{"humility":2,"trust":1,"day":1},"next":null,"note":""},{"text":"Reject the premise and move on.","effects":{"discipline":1,"press":-1,"day":1},"next":null,"note":""}]}]},{"id":"student-forum","room":"press","title":"Student Paper Forum","phase":"Persuasion","day":11,"summary":"Nia Patel asks shorter questions than the adults. Somehow that makes them harder.","stakes":["Youth participation","Plain language","Candidate authenticity"],"steps":[{"speaker":"Nia Patel","body":"“What is one thing students told you that adults were missing?”","choices":[{"text":"Answer with a student concern you heard, without pretending all students agree.","effects":{"inclusion":2,"message":2,"trust":1},"next":"student-2","note":""},{"text":"Talk about your own school experience instead.","effects":{"authenticity":1,"policy":-1},"next":"student-2","note":""},{"text":"Say students mostly want safety and leave it there.","effects":{"message":-1,"policy":1},"next":"student-2","note":""},{"text":"Compliment young people for caring about democracy.","effects":{"charisma":1,"message":-1},"next":"student-2","note":""}]},{"id":"student-2","speaker":"Nia Patel","body":"“Would you support a student advisory seat with real agenda time, or just a photo-op committee?”","choices":[{"text":"Support agenda time with clear rules, training, and adult accountability.","effects":{"policy":2,"inclusion":2,"trust":1,"day":1},"next":null,"note":""},{"text":"Support the idea but avoid details.","effects":{"message":1,"policy":-1,"day":1},"next":null,"note":""},{"text":"Say adults should make final decisions without student pressure.","effects":{"institution":1,"inclusion":-2,"day":1},"next":null,"note":""},{"text":"Ask students to design the structure with the board.","effects":{"inclusion":2,"policy":1,"day":1},"next":null,"note":""}]}]},{"id":"digital-thread","room":"press","title":"The Comment Thread Becomes a Room","phase":"Persuasion","day":10,"summary":"A post about class size gets attention. Then the comments fill with transportation complaints, safety concerns, and two people yelling about taxes.","stakes":["Digital listening","Message control","Voter service"],"steps":[{"speaker":"Owen Slate","body":"“Online is not a billboard. It is a public meeting where the chairs are on fire.”","choices":[{"text":"Assign one trained responder and log recurring issues for field follow-up.","effects":{"digital":2,"field":1,"research":1},"next":"digital-2","note":""},{"text":"Answer personally for an hour.","effects":{"trust":1,"fatigue":2},"next":"digital-2","note":""},{"text":"Delete the messy questions.","effects":{"control":2,"trust":-2},"next":"digital-2","note":""},{"text":"Post a new graphic to change the subject.","effects":{"press":1,"message":-1},"next":"digital-2","note":""}]},{"id":"digital-2","speaker":"Volunteer","body":"A supporter writes an answer that is technically wrong but emotionally satisfying. People are sharing it.","choices":[{"text":"Correct it kindly and give volunteers an approved fact sheet.","effects":{"discipline":2,"digital":1,"trust":1,"day":1},"next":null,"note":""},{"text":"Leave it because it helps your side.","effects":{"cunning":1,"trust":-2,"day":1},"next":null,"note":""},{"text":"Scold the volunteer publicly.","effects":{"control":1,"team":-2,"day":1},"next":null,"note":""},{"text":"Message the volunteer privately and update training.","effects":{"team":2,"discipline":1,"day":1},"next":null,"note":""}]}]},{"id":"rumor-records","room":"press","title":"The Missing Records Rumor","phase":"Persuasion","day":13,"summary":"A rumor says you skipped a budget hearing. It is false, but there is a real attendance confusion from before you were a candidate.","stakes":["Crisis management","Records discipline","Trust"],"steps":[{"speaker":"Owen Slate","body":"“We have twenty minutes before the Lamp posts. We need facts, not feelings.”","choices":[{"text":"Have Daryl verify dates, send a concise statement, and post documents when ready.","effects":{"press":3,"research":2,"compliance":1},"next":"rumor-2","note":""},{"text":"Go live immediately and defend yourself from memory.","effects":{"press":1,"risk":2},"next":"rumor-2","note":""},{"text":"Ignore it so you do not amplify it.","effects":{"patience":1,"trust":-1},"next":"rumor-2","note":""},{"text":"Accuse Rusk by name without proof.","effects":{"press":1,"trust":-2,"risk":2},"next":"rumor-2","note":""}]},{"id":"rumor-2","speaker":"Daryl Price","body":"The record shows there were two meetings with similar names. One was public. One was a committee meeting you were never part of.","choices":[{"text":"Explain the confusion plainly and avoid overclaiming innocence.","effects":{"trust":2,"press":2,"day":1},"next":null,"note":""},{"text":"Demand an apology before releasing documents.","effects":{"pressure":1,"press":-1,"day":1},"next":null,"note":""},{"text":"Turn it into a transparency proposal for board records.","effects":{"policy":2,"institution":1,"day":1},"next":null,"note":""},{"text":"Move on once the immediate story is corrected.","effects":{"discipline":1,"fatigue":-1,"day":1},"next":null,"note":""}]}]},{"id":"volunteer-surge","room":"field","title":"Volunteer Surge, Volunteer Friction","phase":"Persuasion","day":12,"summary":"The campaign finally gets volunteers. That means more work, not less. Untrained energy can break things faster than apathy.","stakes":["Training","Data quality","Team culture"],"steps":[{"speaker":"Luz Ortega","body":"“Twenty people signed up. Great. Now: do they know what not to say?”","choices":[{"text":"Run a thirty-minute training and pair new volunteers with experienced captains.","effects":{"volunteers":3,"field":2,"discipline":1},"next":"surge-2","note":""},{"text":"Send them straight to doors while excitement is high.","effects":{"volunteers":1,"risk":2,"field":1},"next":"surge-2","note":""},{"text":"Use them only for visibility signs.","effects":{"visibility":1,"field":-1},"next":"surge-2","note":""},{"text":"Ask each volunteer what task fits their comfort level.","effects":{"team":2,"inclusion":1,"field":1},"next":"surge-2","note":""}]},{"id":"surge-2","speaker":"New Volunteer","body":"A new volunteer says they can only help from home because of mobility limits. The room goes quiet for half a second.","choices":[{"text":"Offer phone/text/data cleanup roles and treat them as core campaign work.","effects":{"inclusion":2,"field":2,"team":1,"day":1},"next":null,"note":""},{"text":"Thank them and say you mainly need door knockers.","effects":{"inclusion":-2,"field":-1,"day":1},"next":null,"note":""},{"text":"Ask Luz to create an accessible volunteer menu.","effects":{"inclusion":2,"team":2,"day":1},"next":null,"note":""},{"text":"Put them on social media comments without training.","effects":{"digital":1,"discipline":-1,"day":1},"next":null,"note":""}]}]},{"id":"debate-prep","room":"message","title":"Debate Prep Is Not a Debate","phase":"Persuasion","day":15,"summary":"The public forum is coming. The team knows what you want to say. The problem is what you will say when interrupted.","stakes":["Opponent contrast","Candidate discipline","Live pressure"],"steps":[{"speaker":"Mara Chen","body":"“We are not rehearsing speeches. We are rehearsing staying yourself when someone tries to choose your personality for you.”","choices":[{"text":"Practice bridges from likely attacks back to your core message.","effects":{"message":3,"discipline":2,"fatigue":1},"next":"debate-2","note":""},{"text":"Practice zingers for viral clips.","effects":{"press":2,"message":-1,"risk":1},"next":"debate-2","note":""},{"text":"Practice policy details only.","effects":{"policy":2,"message":-1},"next":"debate-2","note":""},{"text":"Avoid prep to stay natural.","effects":{"authenticity":1,"risk":2},"next":"debate-2","note":""}]},{"id":"debate-2","speaker":"Mock Rusk","body":"“My opponent means well, but this job is not a learning experience.”","choices":[{"text":"“Experience matters. So does whether that experience solved the problem families still face.”","effects":{"message":3,"research":1,"day":1},"next":null,"note":""},{"text":"“At least I am not part of the old machine.”","effects":{"press":1,"trust":-1,"day":1},"next":null,"note":""},{"text":"“That is exactly the kind of condescension voters are tired of.”","effects":{"press":1,"message":1,"day":1},"next":null,"note":""},{"text":"Pause, breathe, and answer with one parent story and one board action.","effects":{"discipline":2,"empathy":1,"day":1},"next":null,"note":""}]}]},{"id":"public-forum","room":"message","title":"Public Forum Night","phase":"Persuasion","day":17,"summary":"Folding chairs, fluorescent lights, one livestream, and a room full of people trying to decide whether you are real.","stakes":["Live performance","Message clarity","Scrutiny"],"steps":[{"speaker":"Moderator","body":"“What is the first budget tradeoff you would force the board to confront?”","choices":[{"text":"Name a specific tradeoff and who would be affected.","effects":{"policy":3,"trust":2,"scrutiny":1},"next":"forum-2","note":""},{"text":"Say the board needs a fresh set of eyes.","effects":{"message":1,"policy":-1},"next":"forum-2","note":""},{"text":"Promise to cut waste without naming any.","effects":{"message":-2,"trust":-1},"next":"forum-2","note":""},{"text":"Ask for an audit before committing.","effects":{"institution":1,"policy":1},"next":"forum-2","note":""}]},{"id":"forum-2","speaker":"Victor Rusk","body":"Rusk smiles with his eyebrows. “That answer sounds expensive.” A few people laugh, not loudly enough to be safe.","choices":[{"text":"Answer calmly: cost, priority, funding path, and what you would not promise.","effects":{"message":3,"policy":2,"day":1},"next":null,"note":""},{"text":"Laugh back and say neglect is expensive too.","effects":{"charisma":1,"message":1,"day":1},"next":null,"note":""},{"text":"Ask Rusk why he did not fix it already.","effects":{"research":1,"press":1,"day":1},"next":null,"note":""},{"text":"Move on before the room turns.","effects":{"discipline":1,"message":-1,"day":1},"next":null,"note":""}]}]},{"id":"observer-training","room":"rules","title":"Observer Training","phase":"GOTV","day":19,"summary":"Election Day is close enough to feel physical. Daryl says poll observers need calm more than suspicion.","stakes":["Legitimacy","Poll monitoring","Volunteer restraint"],"steps":[{"speaker":"Daryl Price","body":"“The job is to observe, document, and escalate properly. Not to become the main character at a polling place.”","choices":[{"text":"Train observers on facts, forms, chain of escalation, and voter dignity.","effects":{"rules":3,"field":2,"discipline":2},"next":"obs-2","note":""},{"text":"Tell observers to challenge anything that looks off.","effects":{"pressure":2,"compliance":-2},"next":"obs-2","note":""},{"text":"Skip observers because it sounds paranoid.","effects":{"trust":1,"rules":-2},"next":"obs-2","note":""},{"text":"Send only the most aggressive volunteers.","effects":{"field":1,"rules":-2,"risk":2},"next":"obs-2","note":""}]},{"id":"obs-2","speaker":"Volunteer Captain","body":"“What if voters ask who to vote for while we are near the polling place?”","choices":[{"text":"Explain electioneering boundaries and give captains a script for stepping back.","effects":{"compliance":3,"rules":2,"day":1},"next":null,"note":""},{"text":"Tell them to whisper if no one is watching.","effects":{"cunning":1,"compliance":-3,"day":1},"next":null,"note":""},{"text":"Move campaign volunteers farther from the entrance than required.","effects":{"compliance":2,"trust":1,"day":1},"next":null,"note":""},{"text":"Let each captain use judgment.","effects":{"team":1,"risk":1,"day":1},"next":null,"note":""}]}]},{"id":"gotv-plan","room":"field","title":"The GOTV Shift","phase":"GOTV","day":20,"summary":"The campaign stops trying to persuade everyone and starts asking identified supporters to actually vote.","stakes":["Turnout readiness","Contact discipline","Access needs"],"steps":[{"speaker":"Luz Ortega","body":"“Persuasion is not over, but GOTV has its own logic. We pull known supporters. We do not randomly shout at the district.”","choices":[{"text":"Create a supporter list with phone, door, ride, and accessibility tags.","effects":{"field":3,"inclusion":2,"discipline":1},"next":"gotv-2","note":""},{"text":"Keep persuading undecideds until the last hour.","effects":{"message":1,"field":-1},"next":"gotv-2","note":""},{"text":"Run a districtwide blast without targeting.","effects":{"digital":1,"field":-1,"money":-1},"next":"gotv-2","note":""},{"text":"Ask coalition partners to contact their own confirmed supporters.","effects":{"coalition":2,"field":1},"next":"gotv-2","note":""}]},{"id":"gotv-2","speaker":"Mara Chen","body":"The room has lists on every surface. A perfect plan would require more people than you have. A real plan chooses.","choices":[{"text":"Prioritize supporters with low vote history and known access needs.","effects":{"field":3,"inclusion":2,"day":1},"next":null,"note":""},{"text":"Prioritize the precinct with the biggest rally crowd.","effects":{"morale":1,"field":-1,"day":1},"next":null,"note":""},{"text":"Prioritize reliable voters because they are easiest to reach.","effects":{"efficiency":1,"field":-1,"day":1},"next":null,"note":""},{"text":"Split shifts by geography and check in every two hours.","effects":{"discipline":2,"field":2,"day":1},"next":null,"note":""}]}]},{"id":"election-eve","room":"candidate","title":"Election Eve Kitchen Table","phase":"GOTV","day":23,"summary":"The campaign office is still buzzing. Home is quiet in the dangerous way. The race has taken space from everything.","stakes":["Fatigue","Family boundary","Final clarity"],"steps":[{"speaker":"Family Member","body":"“Win or lose, are you still going to be yourself after tomorrow?”","choices":[{"text":"Admit the campaign changed you, and name what you want to protect.","effects":{"familyPressure":-1,"integrity":2,"fatigue":-1},"next":"eve-2","note":""},{"text":"Say everything will go back to normal.","effects":{"comfort":1,"integrity":-1},"next":"eve-2","note":""},{"text":"Check your phone while answering.","effects":{"field":1,"familyPressure":2},"next":"eve-2","note":""},{"text":"Ask for ten quiet minutes, then return to the office.","effects":{"fatigue":-1,"discipline":1},"next":"eve-2","note":""}]},{"id":"eve-2","speaker":"Mara Chen","body":"Mara texts: “No new strategy tonight. Only execution. Please do not invent a new campaign after 10 p.m.”","choices":[{"text":"Trust the plan and sleep.","effects":{"fatigue":-3,"discipline":2,"day":1},"next":null,"note":""},{"text":"Record one final video from the heart.","effects":{"press":1,"fatigue":1,"risk":1,"day":1},"next":null,"note":""},{"text":"Review the GOTV list one last time with Luz.","effects":{"field":1,"fatigue":1,"day":1},"next":null,"note":""},{"text":"Call Daryl about any unresolved compliance risks.","effects":{"compliance":1,"fatigue":1,"day":1},"next":null,"note":""}]}]},{"id":"election-day","room":"rules","title":"Election Day: The Longest Short Day","phase":"Election Day","day":24,"summary":"No one speaks at normal volume. Every task is tiny and everything feels decisive.","stakes":["Turnout","Poll issues","Acceptance of result"],"steps":[{"speaker":"Luz Ortega","body":"“Northside is voting. Riverbend is slow. One polling place has a line and three anxious texts. What gets attention first?”","choices":[{"text":"Send trained support to the line, check access needs, and keep Riverbend calls moving.","effects":{"field":3,"inclusion":1,"discipline":2},"next":"eday-2","note":""},{"text":"Move everyone to Northside because good news feels safer.","effects":{"morale":1,"field":-1},"next":"eday-2","note":""},{"text":"Post about long lines before verifying details.","effects":{"press":1,"risk":2},"next":"eday-2","note":""},{"text":"Visit every site yourself.","effects":{"visibility":1,"fatigue":2,"field":-1},"next":"eday-2","note":""}]},{"id":"eday-2","speaker":"Daryl Price","body":"A volunteer says a poll worker gave confusing instructions. Daryl has the escalation number ready but warns against turning a mistake into a crisis.","choices":[{"text":"Document facts, call the election office, and keep campaign people calm.","effects":{"rules":3,"trust":1,"field":1,"day":1},"next":null,"note":""},{"text":"Tell supporters to record everything.","effects":{"pressure":1,"risk":2,"trust":-1,"day":1},"next":null,"note":""},{"text":"Send Mara instead of the candidate.","effects":{"team":1,"discipline":1,"day":1},"next":null,"note":""},{"text":"Ignore it unless more voters report the same thing.","effects":{"patience":1,"rules":-1,"day":1},"next":null,"note":""}]}]},{"id":"design-room-tour","room":"plan","title":"The Campaign Desk Comes Alive","phase":"Research & ID","day":1,"summary":"Mara turns the campaign room into a playable map: calendar, voter notes, legal folder, press stack, and a quiet board labeled Things We Do Not Know Yet.","stakes":["Tutorial through fiction","Clear objective","No raw stat dump"],"steps":[{"speaker":"Mara Chen","body":"The office is not a menu anymore. It is a room with pressure in it. Mara points to four places on the wall: the calendar, the precinct map, the rules folder, and a stack of voter notes. “Pick what you want to understand first. The campaign will answer back.”","choices":[{"text":"Study the calendar. You want to feel the deadline before making promises.","effects":{"discipline":2,"research":1},"next":"tour-2","note":"The schedule becomes easier to read. The staff can now warn you before a deadline is missed."},{"text":"Study the precinct map. You want the ward to feel like people, not territory.","effects":{"field":2,"empathy":1},"next":"tour-2","note":"The map gains texture: apartments, school traffic, retirees, teachers, and parents who only vote when contacted."},{"text":"Open the rules folder. You want to know what can break the campaign before it breaks you.","effects":{"rules":2,"compliance":1},"next":"tour-2","note":"The rules folder becomes less scary because it is no longer abstract."},{"text":"Read the voter notes. You want one real voice in your head before the strategy talk begins.","effects":{"trust":1,"coalition":1,"message":1},"next":"tour-2","note":"One note sticks: “Everybody says schools matter. Nobody tells us what changes Monday.”"}]},{"id":"tour-2","speaker":"Campaign Room","body":"A good campaign is not a straight hallway. It is a set of rooms that keep changing because people outside the office keep acting. The question is not whether you can do everything. You cannot. The question is what you notice, what you ignore, and what comes back later.","choices":[{"text":"Tell the team to keep the notebook focused on causes and consequences.","effects":{"research":1,"team":1,"discipline":1,"day":1},"next":null,"note":"The campaign notebook will now record more than outcomes. It will track what caused them."},{"text":"Tell the team to flag surprises, not just tasks.","effects":{"curiosity":2,"press":1,"day":1},"next":null,"note":"Staff begin marking anything that does not fit the expected pattern."},{"text":"Tell the team to protect your energy so the campaign remains sustainable.","effects":{"fatigue":-2,"team":1,"day":1},"next":null,"note":"The room accepts that exhaustion is not strategy."},{"text":"Tell the team to show you fewer numbers and more meaning.","effects":{"message":1,"trust":1,"day":1},"next":null,"note":"The campaign board shifts toward readable signals instead of a wall of scores."}]}]},{"id":"field-cold-door","room":"field","title":"A Door That Changes The Map","phase":"Research & ID","day":2,"summary":"A short canvass becomes a reminder that voter contact is not just data collection; one answer can change what the campaign thinks it knows.","stakes":["Exploration reward","Precinct texture","Cause and effect"],"steps":[{"speaker":"Northside Doorstep","body":"The voter opens the door just enough to speak. They are not hostile. They are tired. “Everyone finds us right before Election Day. You’re early. That either means you care or your consultant told you to look caring.”","choices":[{"text":"Admit the campaign is early because you need to learn before persuading.","effects":{"trust":2,"field":1},"next":"door-2","note":"The voter relaxes a little because you did not pretend the visit was magic."},{"text":"Ask what candidates usually misunderstand about the block.","effects":{"research":2,"empathy":1},"next":"door-2","note":"They name school traffic, not test scores, as the thing that ruins mornings."},{"text":"Give the short message and ask whether it lands.","effects":{"message":2,"field":1},"next":"door-2","note":"You get a direct answer: “Too polished. Say what changes.”"},{"text":"Mark them as undecided and move on to keep the route on schedule.","effects":{"field":1,"fatigue":-1,"trust":-1},"next":"door-2","note":"The route stays efficient, but the conversation remains thin."}]},{"id":"door-2","speaker":"Volunteer Note","body":"Back at the sidewalk, the volunteer asks whether to enter this as supporter, undecided, issue concern, or follow-up. The answer will shape what the field team sees later.","choices":[{"text":"Mark it as follow-up with a specific note about school traffic.","effects":{"field":2,"research":1,"day":1},"next":null,"note":"A new issue pattern begins forming on the map."},{"text":"Mark it undecided but ask the volunteer to keep the tone of the conversation.","effects":{"field":1,"team":1,"day":1},"next":null,"note":"The data stays clean, and the human detail is not lost."},{"text":"Mark it as issue concern and ask policy to check what the board can actually do.","effects":{"policy":2,"research":1,"day":1},"next":null,"note":"The question moves from doorstep feeling into governing reality."},{"text":"Mark it as low priority because the voter did not commit.","effects":{"discipline":1,"field":-1,"day":1},"next":null,"note":"The campaign saves time today and may miss a thread tomorrow."}]}]},{"id":"message-living-line","room":"message","title":"The Line That Must Survive Contact","phase":"Persuasion","day":5,"summary":"A slogan sounds good in the office, then meets real people and has to either become clearer or become useless.","stakes":["Plain language","Message discipline","Player expression"],"steps":[{"speaker":"Message Desk","body":"Your draft line says: “Accountability, stability, and a board that listens.” Luz reads it twice. “Fine. But if a parent asks what changes Monday morning, what do you say?”","choices":[{"text":"Say: “We will publish clear contract updates before votes, not after rumors.”","effects":{"message":2,"compliance":1},"next":"line-2","note":"The promise becomes concrete and tied to the dispute."},{"text":"Say: “We will make board decisions easier for families to follow.”","effects":{"message":1,"trust":1},"next":"line-2","note":"The promise is broad, but understandable."},{"text":"Say: “The board needs someone who reads the boring parts before they hurt people.”","effects":{"message":2,"research":1},"next":"line-2","note":"The line sounds like you and gives the campaign a sharper identity."},{"text":"Say: “The current board failed basic oversight.”","effects":{"press":1,"scrutiny":1,"message":1},"next":"line-2","note":"The contrast is clear, but it invites a harder reply."}]},{"id":"line-2","speaker":"Luz Ortega","body":"“Good. Now we test it. A line is not alive until someone can repeat it when you are not in the room.”","choices":[{"text":"Ask volunteers to repeat the line back in their own words.","effects":{"volunteers":1,"message":2,"day":1},"next":null,"note":"The campaign gains a message that can travel without sounding scripted."},{"text":"Print two versions and see which one gets questions instead of blank nods.","effects":{"research":1,"money":-1,"message":1,"day":1},"next":null,"note":"Testing costs money but prevents guessing."},{"text":"Keep the line fixed so the campaign sounds disciplined.","effects":{"discipline":2,"message":1,"day":1},"next":null,"note":"The campaign becomes consistent, though less flexible."},{"text":"Save the sharpest version for the public forum.","effects":{"press":1,"cunning":1,"day":1},"next":null,"note":"You hold back a moment that may land harder later."}]}]},{"id":"press-context-clip","room":"press","title":"The Clip Without The Room","phase":"Persuasion","day":7,"summary":"A short clip from a community meeting spreads without the question that came before it.","stakes":["Context risk","Media feedback","No poetic wording"],"steps":[{"speaker":"Press Room","body":"A fifteen-second clip is moving through local group chats. In it, you say the board has been “too comfortable with silence.” The missing part is that a parent had just described unanswered records requests. Without that context, some people hear it as an attack on teachers.","choices":[{"text":"Post the full exchange with a short explanation of what you meant.","effects":{"press":2,"trust":1,"digital":1},"next":"clip-2","note":"You give people the missing context before the clip hardens into a story."},{"text":"Call the teachers association before posting anything public.","effects":{"coalition":2,"press":1,"fatigue":1},"next":"clip-2","note":"You protect a relationship before you protect your timeline."},{"text":"Ignore it unless a reporter asks, because reacting may make it bigger.","effects":{"discipline":1,"scrutiny":-1},"next":"clip-2","note":"The story may fade, or it may grow without your voice in it."},{"text":"Use the attention to repeat your transparency message.","effects":{"message":2,"press":1,"scrutiny":1},"next":"clip-2","note":"You turn the moment toward your theme, but not everyone accepts the pivot."}]},{"id":"clip-2","speaker":"Luz Ortega","body":"“This is why context matters. The internet is not a room. It does not remember who asked the question unless we help it.”","choices":[{"text":"Ask for a one-sentence context rule for every future clip.","effects":{"press":2,"discipline":1,"day":1},"next":null,"note":"The campaign gains a safer media habit."},{"text":"Ask staff to track whether the misunderstanding reaches actual voters.","effects":{"research":2,"digital":1,"day":1},"next":null,"note":"You avoid fighting shadows and look for real movement."},{"text":"Ask Mara whether this changes the week’s plan.","effects":{"team":1,"discipline":1,"day":1},"next":null,"note":"The campaign stays responsive without spiraling."},{"text":"Ask for a stronger contrast line next time.","effects":{"message":1,"scrutiny":1,"day":1},"next":null,"note":"You choose sharper politics and accept sharper risk."}]}]},{"id":"coalition-real-agency","room":"coalition","title":"The Endorsement That Wants Agency","phase":"Persuasion","day":8,"summary":"A youth organizer may support you, but does not want to be used as proof that young people are included.","stakes":["Coalition realism","Representation","Character respect"],"steps":[{"speaker":"Nia Bell","body":"“I can bring people to your forum. But I am not becoming a photo that says young people have been consulted. If we show up, we get a real segment, not a thank-you line.”","choices":[{"text":"Offer a real agenda segment with a clear time limit and follow-up owner.","effects":{"coalition":2,"inclusion":2,"team":1},"next":"agency-2","note":"Nia hears a structure, not just appreciation."},{"text":"Ask what would make the forum worth their time.","effects":{"empathy":2,"research":1,"coalition":1},"next":"agency-2","note":"You do not assume what participation should look like."},{"text":"Say the campaign cannot give one group special treatment.","effects":{"rules":1,"coalition":-1,"scrutiny":-1},"next":"agency-2","note":"The answer sounds fair to some people and evasive to others."},{"text":"Ask for the endorsement first and promise more involvement after the election.","effects":{"cunning":1,"coalition":-2,"scrutiny":1},"next":"agency-2","note":"Nia recognizes the old pattern immediately."}]},{"id":"agency-2","speaker":"Nia Bell","body":"“Participation is not decoration. If your campaign remembers that, people will notice.”","choices":[{"text":"Put Nia’s segment on the public schedule before leaving the meeting.","effects":{"coalition":2,"inclusion":1,"day":1},"next":null,"note":"The promise becomes visible, which makes it harder to quietly drop."},{"text":"Put it in the internal plan first so staff can make it work well.","effects":{"team":2,"coalition":1,"day":1},"next":null,"note":"The campaign protects execution before announcement."},{"text":"Ask Nia to co-design the segment with a teacher and a parent.","effects":{"coalition":2,"policy":1,"day":1},"next":null,"note":"The coalition begins connecting across groups."},{"text":"Hold off until the forum format is settled.","effects":{"discipline":1,"coalition":-1,"day":1},"next":null,"note":"The campaign stays neat and loses some trust."}]}]},{"id":"rules-clicking-clock","room":"rules","title":"The Deadline That Does Not Care","phase":"Research & ID","day":3,"summary":"The election office gives you a filing correction with a short deadline. This is not dramatic until it is missed.","stakes":["Rules as tension","Closed system","Low-stress clarity"],"steps":[{"speaker":"Election Office Clerk","body":"“Your address line is acceptable, but the committee name on one form does not exactly match the finance statement. Fix it by four o’clock and the packet stays clean.”","choices":[{"text":"Go straight to the office and correct the form yourself.","effects":{"compliance":2,"fatigue":1,"day":1},"next":"clock-2","note":"The correction is handled, but it costs candidate time."},{"text":"Send Daryl with written authorization and confirm by phone.","effects":{"compliance":2,"team":1},"next":"clock-2","note":"You delegate while keeping the chain of responsibility clear."},{"text":"Ask whether the mismatch actually matters before changing anything.","effects":{"rules":1,"curiosity":1,"scrutiny":1},"next":"clock-2","note":"You learn more about the rule, but the clock keeps moving."},{"text":"Tell staff to fix it and do not interrupt your voter meeting.","effects":{"team":-1,"field":1,"scrutiny":1},"next":"clock-2","note":"The voter meeting stays intact, but the staff feels exposed."}]},{"id":"clock-2","speaker":"Campaign Notebook","body":"Small rule problems are useful because they reveal whether the campaign has a system or only good intentions.","choices":[{"text":"Create a filing checklist for every future deadline.","effects":{"compliance":2,"rules":1,"day":1},"next":null,"note":"Future rule scenes will be easier to understand and harder to miss."},{"text":"Assign one person to own every official document change.","effects":{"team":2,"compliance":1,"day":1},"next":null,"note":"Responsibility becomes visible."},{"text":"Keep the fix quiet because voters do not need paperwork drama.","effects":{"privacy":1,"scrutiny":-1,"day":1},"next":null,"note":"The issue stays small, but only because nothing else goes wrong."},{"text":"Ask the clerk what other campaigns usually mess up.","effects":{"curiosity":2,"rules":1,"day":1},"next":null,"note":"You gain a small practical edge without breaking any rule."}]}]},{"id":"candidate-safety-valve","room":"candidate","title":"The Hour You Almost Spend Wrong","phase":"Persuasion","day":10,"summary":"The campaign gives you one open hour. How you spend it changes the next two days more than it seems.","stakes":["Pacing","Escape without guilt","Fatigue matters"],"steps":[{"speaker":"Candidate Room","body":"There is a rare empty hour between a parent coffee and a call block. The old reflex says to fill it. Mara says, “Empty time is not wasted if it keeps you from making bad decisions at six.”","choices":[{"text":"Rest without checking messages.","effects":{"fatigue":-3,"team":1},"next":"hour-2","note":"Your staff protects the hour because you actually use it."},{"text":"Read only the short brief for the next event.","effects":{"fatigue":-1,"discipline":1,"research":1},"next":"hour-2","note":"You stay prepared without drowning yourself."},{"text":"Call one voter whose note bothered you.","effects":{"trust":2,"field":1,"fatigue":1},"next":"hour-2","note":"The call matters, but the hour disappears."},{"text":"Review opposition notes because surprise scares you more than fatigue.","effects":{"research":2,"fatigue":2,"cunning":1},"next":"hour-2","note":"You feel safer and more tired."}]},{"id":"hour-2","speaker":"Private Note","body":"A campaign still needs enough room for you to return tomorrow. The race can be tense without treating every imperfect choice like a disaster.","choices":[{"text":"Tell staff to mark one protected hour every two days.","effects":{"fatigue":-2,"team":1,"day":1},"next":null,"note":"The schedule becomes more humane and more sustainable."},{"text":"Tell staff protected time can be broken only for legal, family, or safety issues.","effects":{"discipline":2,"fatigue":-1,"day":1},"next":null,"note":"The campaign gets a clear exception rule."},{"text":"Tell staff you will decide day by day.","effects":{"privacy":1,"team":-1,"day":1},"next":null,"note":"You keep control, but staff cannot plan around it."},{"text":"Tell staff not to protect you from the campaign.","effects":{"ambition":2,"fatigue":2,"day":1},"next":null,"note":"The room respects the drive and worries about the cost."}]}]},{"id":"world-offscreen-moves","room":"plan","title":"Things Happen While You Are Elsewhere","phase":"Persuasion","day":12,"summary":"The ward pushes back: two actors make moves while you are busy, and you only have time to investigate one.","stakes":["Living world","Limited attention","Information access"],"steps":[{"speaker":"Morning Brief","body":"While you were at the apartment walk, the rival campaign met with a retired principal, a parent group posted questions about bus routes, and the local paper requested a comment on records access. You have forty minutes before the next event.","choices":[{"text":"Call the retired principal first; quiet validators can move a race.","effects":{"coalition":2,
