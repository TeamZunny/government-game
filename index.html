"research":1},"next":"offscreen-2","note":"You may learn whether the rival gained real ground or only a photo."},{"text":"Answer the parent group with a clear bus-route follow-up.","effects":{"trust":2,"field":1},"next":"offscreen-2","note":"You respond where people are already talking."},{"text":"Prepare the records-access comment before the paper sets the frame.","effects":{"press":2,"message":1},"next":"offscreen-2","note":"You protect the public story while other threads wait."},{"text":"Ask Mara for the shortest version of all three before choosing.","effects":{"research":2,"fatigue":1},"next":"offscreen-2","note":"You buy context with time."}]},{"id":"offscreen-2","speaker":"Campaign Room","body":"No choice pauses the rest of the ward. Attention is a resource, not a moral failure. What matters is whether your campaign has ways to notice what you missed.","choices":[{"text":"Create a daily “missed while busy” note for staff to maintain.","effects":{"research":2,"team":1,"day":1},"next":null,"note":"The living-world feed becomes more useful."},{"text":"Assign each staff lead one outside thread to watch.","effects":{"team":2,"field":1,"day":1},"next":null,"note":"The campaign becomes less dependent on your personal attention."},{"text":"Accept that you missed things and keep your current plan intact.","effects":{"discipline":1,"fatigue":-1,"day":1},"next":null,"note":"You avoid panic, but the notebook remains thinner."},{"text":"Cancel one later event to investigate the threads properly.","effects":{"research":2,"field":-1,"fatigue":1,"day":1},"next":null,"note":"You gain information and lose contact time."}]}]},{"id":"briefing-first-real-brief","room":"briefing","title":"The First Real Morning Brief","phase":"Research & ID","day":1,"summary":"You cannot read everything. You choose what to understand first, and the campaign begins with limited attention.","stakes":["Limited attention","Source quality","Missed information"],"steps":[{"id":"brief-1","speaker":"Mara Vell","body":"Four folders are on the table: voter file notes, election-office reminders, local media scan, and staff capacity. You have time to read two before the first meeting. What do you open first?","choices":[{"text":"Read voter file notes and election-office reminders.","effects":{"field":2,"rules":2,"research":1},"next":"brief-2","note":"You start with votes and rules. The public story may move without you for a while."},{"text":"Read local media scan and voter file notes.","effects":{"press":2,"field":2,"message":1},"next":"brief-2","note":"You know the public frame and the field map. The rules folder waits."},{"text":"Read staff capacity and election-office reminders.","effects":{"team":2,"rules":2,"fatigue":-1},"next":"brief-2","note":"The day gets safer and more realistic. You know less about voter mood."},{"text":"Ask each lead for the one thing they are most afraid you will miss.","effects":{"team":2,"research":2,"fatigue":1},"next":"brief-2","note":"You trade quiet reading time for the room’s instincts."}]},{"id":"brief-2","speaker":"Campaign Room","body":"The unread folders do not disappear. They become risk. The campaign needs a way to notice what you did not personally read.","choices":[{"text":"Create a short “missed while busy” note after every major action.","effects":{"research":2,"team":1,"day":1},"next":null,"note":"The notebook becomes a campaign tool, not a guilt pile."},{"text":"Assign one staff lead to watch each folder for urgent changes.","effects":{"team":2,"fatigue":-1,"day":1},"next":null,"note":"You delegate attention instead of pretending you can hold the whole ward alone."},{"text":"Keep decisions moving and accept that some context will be missed.","effects":{"discipline":1,"field":1,"day":1},"next":null,"note":"The campaign keeps momentum. The notebook stays thinner."},{"text":"Delay the first meeting until you read all four folders.","effects":{"research":3,"fatigue":2,"day":1},"next":null,"note":"You know more and arrive later. The day begins with a cost."}]}]},{"id":"plan-written-strategy-reset","room":"plan","title":"The Plan That Can Change","phase":"Research & ID","day":1,"summary":"The campaign turns its instincts into a written strategy without exposing a visible roadmap.","stakes":["Written plan","Real numbers","Flexibility"],"steps":[{"id":"plan-1","speaker":"Mara Vell","body":"The team agrees on the goal in words: win the open school-board seat. That is not yet a strategy. A strategy needs real numbers, target voters, message, calendar, and resources.","choices":[{"text":"Start with the safest win number and expected turnout.","effects":{"research":2,"field":1},"next":"plan-2","note":"The room stops using vague words like “many” and “enough.”"},{"text":"Start with target voter groups and where they live.","effects":{"field":2,"research":1},"next":"plan-2","note":"The map becomes more important than the mood in the office."},{"text":"Start with message: why this race matters now.","effects":{"message":2,"press":1},"next":"plan-2","note":"The campaign gets a voice before it has a full machine."},{"text":"Start with staff capacity: what can the room actually do?","effects":{"team":2,"fatigue":-1},"next":"plan-2","note":"The plan begins inside reality instead of hope."}]},{"id":"plan-2","speaker":"Campaign Board","body":"The written plan now exists, but it should not become a cage. The manuals all agree on one thing the room has already learned: plans matter because they help you change deliberately.","choices":[{"text":"Mark the plan as a living document and review it every three campaign days.","effects":{"discipline":2,"research":1,"day":1},"next":null,"note":"The strategy can move without becoming random."},{"text":"Let each staff lead own one section and report changes.","effects":{"team":2,"volunteers":1,"day":1},"next":null,"note":"The campaign becomes less dependent on your memory."},{"text":"Keep the plan private so opponents cannot read your structure.","effects":{"privacy":2,"cunning":1,"day":1},"next":null,"note":"You protect the strategy but make coordination harder."},{"text":"Publish only the public-facing goals and keep the tactics internal.","effects":{"message":2,"trust":1,"day":1},"next":null,"note":"Voters hear direction without seeing the wiring."}]}]},{"id":"field-voter-file-gap","room":"field","title":"The Voter File Has Holes","phase":"Research & ID","day":2,"summary":"The field map shows missing apartment voters and uncertain registration notes. Winning and voter access start to pull on the same calendar.","stakes":["Voter registration","Access","Finite field time"],"steps":[{"id":"gap-1","speaker":"Luz Ibarra","body":"The voter list is useful, but not sacred. Apartment buildings have missing phone numbers, young parents are under-contacted, and two volunteers heard registration concerns at doors.","choices":[{"text":"Ask the election office for correct public registration guidance.","effects":{"rules":2,"inclusion":1,"compliance":1},"next":"gap-2","note":"The campaign chooses accuracy before speed."},{"text":"Create a follow-up universe for voters with access or registration questions.","effects":{"field":2,"research":1},"next":"gap-2","note":"The map starts tracking people the old list would have dropped."},{"text":"Ask a civic group to help with nonpartisan voter information.","effects":{"coalition":2,"inclusion":2},"next":"gap-2","note":"The campaign does not try to own every access problem."},{"text":"Stay focused on confirmed likely voters until the list is cleaner.","effects":{"discipline":1,"field":1,"inclusion":-1},"next":"gap-2","note":"The plan gets simpler and narrower."}]},{"id":"gap-2","speaker":"Door Note","body":"One note says: “She said no one ever comes here unless they want something.” The field plan can count doors, but the campaign has to decide what kind of presence those doors remember.","choices":[{"text":"Add a second-contact rule for voters who raise access concerns.","effects":{"trust":2,"field":1,"day":1},"next":null,"note":"The campaign starts measuring follow-through, not just first contact."},{"text":"Train volunteers to say what the campaign can and cannot help with.","effects":{"team":1,"rules":1,"compliance":1,"day":1},"next":null,"note":"The script gets safer and more honest."},{"text":"Invite the apartment group to a small issue meeting.","effects":{"coalition":1,"inclusion":2,"day":1},"next":null,"note":"The field problem becomes a relationship."},{"text":"Keep the note in the notebook but do not change the week’s plan.","effects":{"discipline":1,"research":1,"day":1},"next":null,"note":"You remember it. You do not yet act on it."}]}]},{"id":"message-tully-box-live","room":"message","title":"The Four Corners of the Race","phase":"Persuasion","day":5,"summary":"The message box stops being a worksheet and becomes a live argument over how voters will define the choice.","stakes":["Message discipline","Contrast","Opposition frame"],"steps":[{"id":"tully-1","speaker":"Owen Roake","body":"Owen draws four boxes: what we say about us, what we say about them, what they say about us, what they say about themselves. “If we cannot fill this in plainly, we are not ready for the forum.”","choices":[{"text":"Write what we say about us in one direct sentence.","effects":{"message":2,"discipline":1},"next":"tully-2","note":"The campaign gets a sentence volunteers can repeat."},{"text":"Start with what the opponent is already saying about you.","effects":{"research":2,"message":1},"next":"tully-2","note":"You study the incoming frame before crafting your own."},{"text":"Define the contrast without making the race uglier.","effects":{"message":2,"trust":1},"next":"tully-2","note":"The room finds a line between clarity and cheapness."},{"text":"Ask what voters actually care about before filling any box.","effects":{"research":2,"policy":1},"next":"tully-2","note":"The message waits for evidence."}]},{"id":"tully-2","speaker":"Owen Roake","body":"The strongest line is not the sharpest line. It is the one that survives doors, interviews, forums, and tired volunteers saying it from memory.","choices":[{"text":"Test the line at doors before printing it.","effects":{"field":2,"message":1,"day":1},"next":null,"note":"The message has to survive voters, not just staff."},{"text":"Use the line in the press statement and see if reporters repeat it accurately.","effects":{"press":2,"message":1,"day":1},"next":null,"note":"The public frame becomes the test."},{"text":"Ask coalition partners what the line misses.","effects":{"coalition":2,"message":1,"day":1},"next":null,"note":"The message becomes less lonely."},{"text":"Keep refining because the line still feels too campaign-like.","effects":{"message":1,"fatigue":1,"day":1},"next":null,"note":"The wording improves, but the calendar notices."}]}]},{"id":"coalition-target-web","room":"coalition","title":"Not Just Endorsements","phase":"Persuasion","day":6,"summary":"A coalition meeting becomes a web of primary targets, secondary targets, youth leaders, and people who can influence without ever appearing on a flyer.","stakes":["Coalition agency","Influence network","Trust"],"steps":[{"id":"coal-1","speaker":"Tamsin Roe","body":"Tamsin says the campaign keeps asking who will publicly support you. “Wrong first question. Ask who people already trust, and whether those people trust you enough to be honest when you are not in the room.”","choices":[{"text":"Map primary targets, secondary influencers, and who can reach them.","effects":{"coalition":2,"research":1},"next":"coal-2","note":"The coalition board stops being a list of logos."},{"text":"Ask youth leaders what role they want besides showing up at events.","effects":{"inclusion":2,"coalition":1},"next":"coal-2","note":"The campaign treats young people as actors, not decoration."},{"text":"Ask teachers which private validators matter most.","effects":{"research":2,"coalition":1},"next":"coal-2","note":"Quiet influence enters the map."},{"text":"Focus on public endorsements that create momentum quickly.","effects":{"press":1,"coalition":1,"risk":1},"next":"coal-2","note":"The campaign chooses visible motion with some trust cost."}]},{"id":"coal-2","speaker":"Coalition Table","body":"The coalition wants clarity: are they helping you win, or are they shaping what winning means?","choices":[{"text":"Give coalition partners one policy-feedback window before the forum.","effects":{"policy":2,"coalition":1,"day":1},"next":null,"note":"The campaign shares influence before asking for labor."},{"text":"Create a clear decision rule for coalition requests.","effects":{"team":1,"discipline":1,"coalition":1,"day":1},"next":null,"note":"The relationship gets boundaries."},{"text":"Ask for voter-contact help first and deeper policy work later.","effects":{"field":2,"coalition":-1,"day":1},"next":null,"note":"The coalition hears the priority, even if some dislike it."},{"text":"Keep the coalition informal until trust is stronger.","effects":{"privacy":1,"fatigue":-1,"day":1},"next":null,"note":"You avoid overpromising, but the network grows slowly."}]}]},{"id":"press-rapid-response-room","room":"press","title":"The Clip and the Context","phase":"Persuasion","day":8,"summary":"A short clip spreads without the full question. The campaign has to respond clearly without making the clip bigger for no reason.","stakes":["Context loss","Rapid response","Digital attention"],"steps":[{"id":"clip-1","speaker":"Priya Sato","body":"Priya sends a message: “A short clip from last night is spreading. It leaves out the question you were answering. Some people think you dismissed parents who disagree with you.”","choices":[{"text":"Post the full exchange with a short explanation.","effects":{"press":2,"digital":1,"message":1},"next":"clip-2","note":"The campaign adds context without pretending the clip is harmless."},{"text":"Call the parent group first before posting.","effects":{"coalition":2,"trust":1},"next":"clip-2","note":"You repair the affected relationship before managing the audience."},{"text":"Ask whether the clip is reaching persuadable voters before reacting.","effects":{"research":2,"discipline":1},"next":"clip-2","note":"You check scale before feeding the story."},{"text":"Ignore it for now because online fights can eat the day.","effects":{"fatigue":-1,"press":-1,"risk":1},"next":"clip-2","note":"You protect time and accept uncertainty."}]},{"id":"clip-2","speaker":"Press Room","body":"The response itself can become the next clip. The campaign needs a sentence that makes sense alone.","choices":[{"text":"Use a plain sentence: “I was talking about process, not dismissing parents.”","effects":{"message":2,"press":1,"day":1},"next":null,"note":"The answer can travel without needing a paragraph of rescue."},{"text":"Explain the whole issue in a longer written note.","effects":{"policy":2,"press":-1,"day":1},"next":null,"note":"The details are stronger. The shareability is weaker."},{"text":"Let a trusted parent explain the context in their own words.","effects":{"coalition":2,"trust":1,"day":1},"next":null,"note":"The defense sounds less like campaign copy."},{"text":"Move on and prepare for the next forum instead.","effects":{"discipline":1,"fatigue":-1,"day":1},"next":null,"note":"The clip remains in the background."}]}]},{"id":"finance-spreadsheet-pressure","room":"finance","title":"The Budget Chooses Too","phase":"Persuasion","day":9,"summary":"Money, time, and people become one argument. The campaign can afford some things, not all things.","stakes":["Finance plan","Finite resources","Compliance"],"steps":[{"id":"budget-1","speaker":"Daryl Pruitt","body":"Daryl shows three requests: a mailer, extra field supplies, and outside compliance help. “We can pay for two if we cut call time. We can pay for one without changing the week.”","choices":[{"text":"Fund compliance help and field supplies.","effects":{"compliance":2,"field":2,"money":-2},"next":"budget-2","note":"The campaign protects rules and doors."},{"text":"Fund the mailer and field supplies.","effects":{"message":2,"field":2,"money":-2,"compliance":-1},"next":"budget-2","note":"The campaign becomes more visible and slightly riskier."},{"text":"Fund compliance help and keep call time intact.","effects":{"compliance":2,"money":1,"fatigue":1},"next":"budget-2","note":"The budget breathes, but the candidate carries more fundraising pressure."},{"text":"Pause spending until the next finance check-in.","effects":{"money":2,"field":-1,"message":-1},"next":"budget-2","note":"The campaign stays solvent and loses momentum."}]},{"id":"budget-2","speaker":"Finance Desk","body":"The spreadsheet is not a punishment. It is the campaign telling the truth about what it can do.","choices":[{"text":"Set weekly money, volunteer, and candidate-time limits in one place.","effects":{"discipline":2,"team":1,"day":1},"next":null,"note":"The plan gets less romantic and more usable."},{"text":"Ask each room what they can stop doing, not only what they need.","effects":{"team":2,"fatigue":-1,"day":1},"next":null,"note":"The campaign learns to subtract."},{"text":"Schedule call time with a hard stop.","effects":{"money":2,"fatigue":1,"day":1},"next":null,"note":"The budget improves and the day gets heavier."},{"text":"Let Daryl manage it and keep the candidate out of the numbers.","effects":{"team":1,"money":1,"research":-1,"day":1},"next":null,"note":"Delegation helps, but you know less."}]}]},{"id":"rules-observer-access","room":"rules","title":"The Process Has to Be Seen","phase":"Persuasion","day":10,"summary":"Observers, voter information, and election-office trust become part of the race without becoming a conspiracy story.","stakes":["Legitimacy","Observers","Voter education"],"steps":[{"id":"obs-1","speaker":"Rev. Mendez","body":"Rev. Mendez says people are worried about the process, not because they believe one rumor, but because no one has explained the boring parts clearly. “Boring parts are where trust lives.”","choices":[{"text":"Support nonpartisan observer training through a civic group.","effects":{"rules":2,"trust":1,"coalition":1},"next":"obs-2","note":"The campaign supports visibility without trying to control the referees."},{"text":"Ask the election office for clear voter-information language.","effects":{"rules":2,"inclusion":1,"compliance":1},"next":"obs-2","note":"The campaign chooses official clarity over improvisation."},{"text":"Prepare volunteers to answer process questions at doors.","effects":{"field":1,"rules":1,"team":1},"next":"obs-2","note":"The campaign makes rules part of voter contact."},{"text":"Avoid process talk unless voters raise it first.","effects":{"message":1,"rules":-1,"fatigue":-1},"next":"obs-2","note":"The campaign keeps the message clean and leaves confusion alone."}]},{"id":"obs-2","speaker":"Election Authority","body":"The election office does not care which campaign feels busy. It cares whether forms, deadlines, voter notices, and polling-place procedures are correct.","choices":[{"text":"Create a visible deadline checklist in the rules room.","effects":{"rules":2,"compliance":2,"day":1},"next":null,"note":"The boring checklist becomes a trust tool."},{"text":"Assign Celia Park as the single election-office contact.","effects":{"team":1,"compliance":2,"day":1},"next":null,"note":"Fewer people will improvise with rules."},{"text":"Ask for a plain-language voter FAQ before canvassing this weekend.","effects":{"inclusion":2,"rules":1,"day":1},"next":null,"note":"Voters get better answers."},{"text":"Handle it quietly so the campaign does not look worried.","effects":{"privacy":1,"scrutiny":-1,"rules":-1,"day":1},"next":null,"note":"The public sees less, and the folder stays thinner."}]}]},{"id":"candidate-leader-environment","room":"candidate","title":"Protecting the Person Inside the Candidate","phase":"Persuasion","day":12,"summary":"The room confronts the fact that leadership style, rest, honesty, and pressure management are not soft issues. They shape performance.","stakes":["Leadership fit","Fatigue","Team trust"],"steps":[{"id":"lead-1","speaker":"Aunt Sella Varr","body":"Aunt Sella says you looked tired at the last event. Jon says the answer is more discipline. Mara says the answer is less noise. They may all be partly right.","choices":[{"text":"Ask the team what information you truly need before each event.","effects":{"team":2,"fatigue":-1},"next":"lead-2","note":"The room starts protecting attention, not just time."},{"text":"Tell them which event formats make you sound most like yourself.","effects":{"message":2,"trust":1},"next":"lead-2","note":"The campaign learns your strengths instead of copying someone else."},{"text":"Add one protected recovery block and make exceptions explicit.","effects":{"fatigue":-2,"discipline":1},"next":"lead-2","note":"The calendar becomes more humane."},{"text":"Push through because the campaign is too small for candidate limits.","effects":{"ambition":2,"fatigue":3,"team":-1},"next":"lead-2","note":"The room respects the drive and worries about the cost."}]},{"id":"lead-2","speaker":"Candidate Room","body":"A campaign can make a candidate seem more authentic or less authentic. The difference is often whether the team improves the person in front of them or invents a different one.","choices":[{"text":"Ask for honest feedback after each public event, not praise.","effects":{"team":2,"message":1,"day":1},"next":null,"note":"The room gets permission to tell the truth."},{"text":"Choose fewer event types and do them better.","effects":{"discipline":2,"fatigue":-1,"day":1},"next":null,"note":"The schedule narrows in a useful way."},{"text":"Let staff handle tone; you focus on facts and answers.","effects":{"policy":2,"team":1,"day":1},"next":null,"note":"The campaign gets steadier but maybe less personal."},{"text":"Keep improvising because scripted authenticity is not authenticity.","effects":{"showmanship":2,"risk":1,"day":1},"next":null,"note":"You may create moments. You may also create clean-up work."}]}]},{"id":"government-authority-map","room":"government","title":"The Folder After Election Night","phase":"Persuasion","day":14,"summary":"A quiet institutional folder reminds the campaign that winning is not the same as having authority over everything.","stakes":["Governing preparation","Institutional limits","No visible ladder"],"steps":[{"id":"gov-1","speaker":"Daryl Pruitt","body":"Daryl opens an institutional directory. It lists legislatures, courts, executive offices, departments, boards, and agencies. “Not for the public deck. But if we win, promises hit this wall.”","choices":[{"text":"Mark which promises are actually within school-board authority.","effects":{"policy":2,"rules":1},"next":"gov-2","note":"The policy folder becomes more honest."},{"text":"Mark which outside offices might be needed for real follow-through.","effects":{"institution":2,"research":1},"next":"gov-2","note":"The campaign starts seeing government as a network, not a throne."},{"text":"Keep the folder sealed until after Election Day.","effects":{"discipline":1,"fatigue":-1},"next":"gov-2","note":"The campaign avoids clutter and postpones governing preparation."},{"text":"Look for names that repeat across civic boards and public agencies.","effects":{"curiosity":2,"cunning":1},"next":"gov-2","note":"The power web gets more interesting and less simple."}]},{"id":"gov-2","speaker":"Governing Map","body":"This folder is not a rank ladder. It does not tell you where you go next. It tells you that every office sits inside a larger system of authority, limits, allies, procedures, and old habits.","choices":[{"text":"Use it to make one campaign promise more realistic.","effects":{"policy":2,"trust":1,"day":1},"next":null,"note":"A promise gets smaller and stronger."},{"text":"Use it to prepare one first-week governing question.","effects":{"institution":2,"research":1,"day":1},"next":null,"note":"The campaign begins to imagine responsibility, not promotion."},{"text":"Ask Mara to hide the folder from public UI and keep it as background logic.","effects":{"discipline":2,"privacy":1,"day":1},"next":null,"note":"The world grows without showing the player a roadmap."},{"text":"Close it and return to voter contact.","effects":{"field":2,"fatigue":-1,"day":1},"next":null,"note":"The race comes back to doors."}]}]},{"id":"coalition-meeting-negotiation","room":"coalition","title":"The Meeting With Two Agendas","phase":"Persuasion","day":15,"summary":"A coalition meeting forces you to negotiate without pretending every ally wants the same thing.","stakes":["Negotiation","Meetings","Coalition trust"],"steps":[{"id":"meet-1","speaker":"Tamsin Roe","body":"The meeting begins with bus routes, but half the room wants a public statement on transparency, and two people want private reassurance about staffing. The agenda is now fiction unless you manage the room.","choices":[{"text":"Name the three agendas and assign time to each.","effects":{"discipline":2,"coalition":1},"next":"meet-2","note":"The room relaxes because the hidden conflicts are visible."},{"text":"Ask the quietest stakeholder what outcome they need tonight.","effects":{"empathy":2,"coalition":1},"next":"meet-2","note":"The power in the room shifts slightly."},{"text":"Keep the meeting on bus routes and move the other issues to follow-up.","effects":{"policy":1,"discipline":1,"coalition":-1},"next":"meet-2","note":"The agenda survives, but some people feel managed."},{"text":"Let the tension surface and listen before structuring it.","effects":{"research":2,"fatigue":1},"next":"meet-2","note":"You learn more and spend more energy."}]},{"id":"meet-2","speaker":"Coalition Table","body":"A negotiation is not a speech with more chairs. Someone has to leave with something real enough to defend later.","choices":[{"text":"Offer one concrete follow-up date and one public line everyone can live with.","effects":{"message":1,"coalition":2,"day":1},"next":null,"note":"The meeting produces usable commitments."},{"text":"Ask for a smaller working group with decision authority.","effects":{"team":1,"coalition":2,"day":1},"next":null,"note":"The coalition becomes a structure, not a crowd."},{"text":"Promise to review everything and respond after the forum.","effects":{"fatigue":-1,"coalition":-1,"day":1},"next":null,"note":"The room hears caution and delay."},{"text":"Make a stronger promise to hold the coalition together tonight.","effects":{"trust":1,"risk":2,"day":1},"next":null,"note":"The room likes the promise. The future may test it."}]}]},{"id":"press-opposition-research-crisis","room":"press","title":"The Opposition Packet","phase":"GOTV","day":18,"summary":"An opposition packet arrives late enough to tempt panic and early enough to still shape the race.","stakes":["Opposition research","Crisis response","Message discipline"],"steps":[{"id":"opp-1","speaker":"Edan Webb","body":"Edan drops a packet on the table. It includes an old quote, two public-records notes, and a misleading timeline. Some of it is true. Some of it is framed to make you overreact.","choices":[{"text":"Separate true, false, misleading, and unknown before anyone writes copy.","effects":{"research":2,"discipline":1,"press":1},"next":"opp-2","note":"The campaign refuses to let panic write the response."},{"text":"Check whether any filing or compliance issue is involved.","effects":{"compliance":2,"rules":1},"next":"opp-2","note":"You look for the part that can become official trouble."},{"text":"Draft one sentence that can survive the forum and the paper.","effects":{"message":2,"press":1},"next":"opp-2","note":"The public response gets a spine."},{"text":"Prepare a counterattack on the opponent’s own record.","effects":{"showmanship":2,"risk":2},"next":"opp-2","note":"The room gets louder. The risk rises."}]},{"id":"opp-2","speaker":"Press Room","body":"The question is not only whether you can answer the packet. It is whether the answer still sounds like the campaign you have been building.","choices":[{"text":"Respond with the facts and return to your central message.","effects":{"message":2,"trust":1,"day":1},"next":null,"note":"The campaign keeps its shape under pressure."},{"text":"Hold a short press availability and take questions calmly.","effects":{"press":2,"scrutiny":1,"day":1},"next":null,"note":"You look accountable and invite more attention."},{"text":"Let a validator answer part of the concern publicly.","effects":{"coalition":1,"trust":2,"day":1},"next":null,"note":"The defense does not sound lonely."},{"text":"Say nothing until you have every document.","effects":{"research":1,"press":-1,"day":1},"next":null,"note":"You avoid mistakes and allow the frame to move."}]}]},{"id":"briefing-perception-window","room":"briefing","title":"The Brief That Cannot Fit","phase":"Research & ID","day":1,"summary":"The morning folder has more information than you can use. Mara makes you choose what kind of blindness you can live with today.","stakes":["limited attention","missed information","first meeting"],"steps":[{"id":"open","speaker":"Mara Chen","body":"Mara lays ten updates across the table, then removes six. “This is not me hiding information. This is the job. You cannot absorb everything before the day starts.”","choices":[{"text":"Read the deadline and rules notes first.","effects":{"attention":2,"rules":2,"compliance":1,"day":1},"note":"You begin with fewer surprises from the paperwork side. A voter concern may wait until later.","next":"second"},{"text":"Read the voter-contact changes first.","effects":{"field":2,"research":1,"attention":1,"day":1},"note":"You see the ward through movement: who is answering, who is missing, and which block is changing.","next":"second"},{"text":"Read the press and rumor notes first.","effects":{"press":2,"message":1,"scrutiny":1,"day":1},"note":"You understand what may travel today, but the legal folder stays closed for now.","next":"second"},{"text":"Ask each lead for one sentence only.","effects":{"team":2,"attention":2,"fatigue":-1,"day":1},"note":"The room learns how to brief you without flooding you. Some detail is lost, but the day starts cleaner.","next":"second"}]},{"id":"second","speaker":"Campaign Table","body":"The choice leaves a shape in the day. You know more about one part of the ward and less about another. Mara watches whether you accept that tradeoff or keep trying to reopen the whole folder.","choices":[{"text":"Accept the limit and write down what you did not read.","effects":{"research":1,"attention":2,"team":1},"note":"The campaign starts building a memory of what was skipped. That makes later consequences feel less random."},{"text":"Try to skim the remaining updates anyway.","effects":{"research":1,"fatigue":2,"attention":-1},"note":"You catch one extra clue, but the first meeting starts with your head already crowded."},{"text":"Delegate the unread items to specific staffers.","effects":{"team":2,"attention":1,"compliance":1},"note":"The campaign becomes less dependent on you seeing everything personally."}]}]},{"id":"opposition-pattern-board","room":"opposition","title":"The Pattern Board","phase":"Research & ID","day":2,"summary":"Sal thinks the rival campaign has already started testing what kind of candidate you are.","stakes":["opponent reads you","predictability","counter-move"],"steps":[{"id":"open","speaker":"Sal Imani","body":"Sal points to a board with three sticky notes: “They expect you to chase every rumor, protect every family relationship, or disappear into process. They do not need to be right. They only need you to become easy to schedule around.”","choices":[{"text":"Study which assumption is most dangerous if it becomes true.","effects":{"opposition":2,"research":2,"attention":1},"note":"You turn the board into a practical threat list instead of a personality critique.","next":"second"},{"text":"Plan one public move that breaks the easiest assumption.","effects":{"adaptability":2,"message":1,"opposition":1},"note":"The campaign prepares a readable surprise: not random, just harder to predict.","next":"second"},{"text":"Ask whether the board is over-reading a small sample.","effects":{"research":2,"patience":1,"attention":1},"note":"Sal accepts the caution. Pattern work is useful only if it does not become superstition.","next":"second"},{"text":"Ignore the board and keep the day plan stable.","effects":{"discipline":2,"field":1,"opposition":-1},"note":"The campaign does not overreact. The risk is that the other side keeps learning while you stay focused.","next":"second"}]},{"id":"second","speaker":"Opposition Watch","body":"Edan adds one line under Rusk’s name: “He prefers opponents who explain themselves too much.” The room waits to see whether you will answer that with silence, action, or a better sentence.","choices":[{"text":"Prepare a shorter answer for the next bait question.","effects":{"message":2,"press":1,"opposition":1},"note":"You do not beat the trap by sounding clever. You beat it by leaving less loose material."},{"text":"Move the next campaign hour into voter contact instead of response drafting.","effects":{"field":2,"attention":1,"opposition":-1},"note":"The rival campaign may be watching the wrong room."},{"text":"Ask Daryl to check whether their attacks point toward a records issue.","effects":{"compliance":1,"rules":1,"research":2},"note":"The pattern board becomes connected to the election authority folder, not just campaign vibes."}]}]},{"id":"field-influence-layers","room":"field","title":"The Map Has Layers","phase":"Persuasion","day":4,"summary":"Luz shows that support, access, rumor, and volunteer reach do not move through the ward in the same pattern.","stakes":["influence map","targeting","access"],"steps":[{"id":"open","speaker":"Luz Ortega","body":"Luz overlays four maps: known supporters, persuadable families, student households, and doors volunteers avoid because the route is awkward. “If we treat this as one map, we will miss people.”","choices":[{"text":"Focus on access gaps before persuasion scripts.","effects":{"inclusion":2,"field":1,"trust":1,"day":1},"note":"The field plan becomes fairer and more useful. It may not look flashy from the outside.","next":"second"},{"text":"Focus on persuadables who already have a trusted connector.","effects":{"field":2,"coalition":1,"message":1,"day":1},"note":"The campaign stops treating every undecided voter as equally reachable.","next":"second"},{"text":"Focus on rumor movement and where it crosses supporter IDs.","effects":{"research":2,"opposition":1,"field":1,"day":1},"note":"You begin seeing the ward as a moving system instead of a list of doors.","next":"second"}]},{"id":"second","speaker":"Field Map","body":"A volunteer asks whether this means the campaign is becoming too complicated. Luz answers before you can: “Only if we make the candidate look at every layer at once.”","choices":[{"text":"Ask Luz for one recommended route and one risk note each morning.","effects":{"attention":2,"field":2,"team":1},"note":"The field system gets smarter without turning your day into a spreadsheet."},{"text":"Tell the team to keep the layers hidden unless a decision needs them.","effects":{"attention":2,"fatigue":-1,"team":1},"note":"The campaign protects immersion and focus by showing information when it matters."},{"text":"Open the layers yourself because you want the whole picture.","effects":{"research":2,"fatigue":2,"attention":-1},"note":"You learn more, but the game reminds you why no real campaign sees everything all the time."}]}]},{"id":"press-readable-surprise","room":"press","title":"A Surprise People Can Understand","phase":"Persuasion","day":6,"summary":"Owen wants a public move that feels alive without making voters ask what game the campaign is playing.","stakes":["surprise","message discipline","clip risk"],"steps":[{"id":"open","speaker":"Owen Slate","body":"Owen circles the schedule. “If we do exactly what they expect, we look trapped. If we do something random, we look unserious. We need surprise with a clear reason.”","choices":[{"text":"Move the next statement to the bus stop where the route issue is visible.","effects":{"message":2,"field":1,"inclusion":1,"day":1},"note":"The surprise has a place and a reason. People can explain it without your help.","next":"second"},{"text":"Let a parent introduce the point instead of making it candidate-centered.","effects":{"coalition":2,"trust":1,"message":1,"day":1},"note":"The campaign becomes less predictable because not every moment starts with you.","next":"second"},{"text":"Cancel the public move and call it a listening day.","effects":{"fatigue":-1,"empathy":2,"scrutiny":-1,"day":1},"note":"The absence becomes noticeable. That can help if the listening is real.","next":"second"}]},{"id":"second","speaker":"Press Room","body":"Nia from the student paper asks whether the change is strategy or sincerity. The room goes quiet because the honest answer might be both.","choices":[{"text":"Say it is strategy in service of listening, not a replacement for it.","effects":{"press":2,"trust":1,"message":1},"note":"The answer is plain enough to survive being quoted."},{"text":"Say the campaign changed because the map showed who was being missed.","effects":{"field":1,"research":1,"inclusion":2},"note":"You connect the move to evidence instead of personality."},{"text":"Say less and invite her to attend the event herself.","effects":{"privacy":1,"press":1,"scrutiny":-1},"note":"You avoid over-explaining. That restraint may read as confidence or evasion depending on what happens next."}]}]},{"id":"opposition-good-mistake","room":"opposition","title":"The Other Side Slips","phase":"Persuasion","day":7,"summary":"Rusk’s campaign makes a small mistake. The question is whether exploiting it makes you look sharp or small.","stakes":["believable mistake","opposition pressure","restraint"],"steps":[{"id":"open","speaker":"Edan Webb","body":"Edan brings in a screenshot. Rusk’s campaign sent a parent email with the wrong school name in one paragraph. “It is sloppy. It is also human. We need to decide whether this is an opening or bait for us to look petty.”","choices":[{"text":"Ignore the typo and look for whether their policy claim is also wrong.","effects":{"research":2,"opposition":1,"trust":1,"day":1},"note":"You pass on the cheap hit and search for the part that matters to voters.","next":"second"},{"text":"Use it gently as proof they are rushing the ward.","effects":{"press":1,"opposition":2,"scrutiny":1,"day":1},"note":"The hit may land, but it invites people to inspect your own mistakes more closely.","next":"second"},{"text":"Ask whether your campaign has made a similar error before responding.","effects":{"team":2,"ethics":1,"fatigue":-1,"day":1},"note":"The room gets more honest before it gets more aggressive.","next":"second"}]},{"id":"second","speaker":"Opposition Watch","body":"Mara asks the bigger question: “Do we want to win this minute, or do we want voters to trust us when the contract dispute gets uglier?”","choices":[{"text":"Choose trust and leave the mistake alone publicly.","effects":{"trust":2,"scrutiny":-1,"message":1},"note":"The room marks restraint as a strategy, not passivity."},{"text":"Use the mistake only in internal prep to predict pressure on their team.","effects":{"opposition":2,"research":1,"attention":1},"note":"The campaign learns from the slip without turning it into a spectacle."},{"text":"Prepare a contrast line but hold it unless Rusk attacks first.","effects":{"message":1,"opposition":1,"discipline":1},"note":"The response exists, but it does not control the day."}]}]},{"id":"candidate-sustainable-loop","room":"candidate","title":"The Sustainable Candidate","phase":"Persuasion","day":8,"summary":"The campaign tests whether endurance is being treated as a strategy or as wishful thinking.","stakes":["fatigue","support AI","one-screen focus"],"steps":[{"id":"open","speaker":"Candidate Room","body":"The schedule looks winnable until you imagine living inside it. Mara does not soften the point: “A candidate who crashes becomes a campaign event. We can design around that, or pretend bodies are not part of politics.”","choices":[{"text":"Cut one low-value appearance and protect the next two days.","effects":{"fatigue":-3,"attention":2,"discipline":1,"day":1},"note":"The campaign loses one chance to be seen and gains a better chance to stay coherent.","next":"second"},{"text":"Delegate the appearance to a coalition ally with a clear message.","effects":{"coalition":2,"team":1,"fatigue":-1,"day":1},"note":"The campaign learns that support characters are not decorations. They can carry real moments.","next":"second"},{"text":"Keep the schedule but demand shorter briefs and fewer open loops.","effects":{"attention":2,"team":1,"fatigue":1,"day":1},"note":"You do not reduce the load, but you reduce the chaos around it.","next":"second"}]},{"id":"second","speaker":"Mara Chen","body":"Mara writes “sustainable loop” on the board. “The goal is not to make the game easy. The goal is to keep the pressure readable enough that you can stay inside it.”","choices":[{"text":"Ask for a daily stop point where unresolved issues are parked.","effects":{"attention":2,"fatigue":-2,"team":1},"note":"The campaign creates a pressure valve instead of leaving every tab open in your head."},{"text":"Ask staff to bring choices, not piles of context.","effects":{"team":2,"attention":1,"research":1},"note":"The team starts filtering information into playable decisions."},{"text":"Keep one private ritual before public events.","effects":{"privacy":2,"fatigue":-1,"trust":1},"note":"The private self becomes part of the campaign system, not an afterthought."}]}]},{"id":"finance-fair-data-line","room":"finance","title":"The Fair Data Line","phase":"Persuasion","day":10,"summary":"A donor offers useful voter information. It may be legal, but legal is not the same as safe.","stakes":["data ethics","privacy","compliance"],"steps":[{"id":"open","speaker":"Daryl Price","body":"Daryl reads the donor email twice. “They say the list is public-adjacent. That is not a category I want near our campaign account.”","choices":[{"text":"Reject the list and ask for a public source you can cite.","effects":{"compliance":2,"trust":1,"rules":1,"money":-1},"note":"The campaign loses convenience and gains a cleaner floor.","next":"second"},{"text":"Quarantine the list until Daryl verifies the source.","effects":{"compliance":2,"research":1,"attention":1},"note":"Useful information waits outside the room until it can be defended.","next":"second"},{"text":"Use only aggregate patterns, not household-level details.","effects":{"field":1,"ethics":2,"scrutiny":1},"note":"The campaign tries to learn without turning people into targets. The boundary will need monitoring.","next":"second"}]},{"id":"second","speaker":"Finance & Compliance","body":"The donor asks whether you are “serious about winning.” Daryl does not look up. “Serious campaigns do not create scandals because a spreadsheet looked helpful.”","choices":[{"text":"Back Daryl publicly inside the room.","effects":{"team":2,"compliance":1,"trust":1},"note":"The staff sees that rules are not just Daryl’s hobby."},{"text":"Call the donor yourself and reset the boundary politely.","effects":{"money":1,"trust":1,"scrutiny":-1},"note":"The relationship survives, but now has a fence around it."},{"text":"Ask whether there is a legal way to answer the same strategic question.","effects":{"research":2,"compliance":1,"field":1},"note":"The campaign separates the need for knowledge from the unsafe source."}]}]},{"id":"coalition-not-pieces","room":"coalition","title":"Allies Are Not Game Pieces","phase":"Persuasion","day":11,"summary":"A coalition partner agrees with you but rejects the way the campaign planned to use them.","stakes":["agency","coalition trust","message ownership"],"steps":[{"id":"open","speaker":"Rev. Mendez","body":"Rev. Mendez reads the event plan and closes the folder. “I support the goal. I do not support being placed behind you like scenery.”","choices":[{"text":"Ask what role would feel honest to them.","effects":{"coalition":2,"empathy":2,"trust":1,"day":1},"note":"The coalition desk becomes a negotiation, not a staging area.","next":"second"},{"text":"Explain why the visual plan mattered and invite a redesign.","effects":{"message":1,"coalition":2,"team":1,"day":1},"note":"You keep the campaign need on the table without pretending the original plan was harmless.","next":"second"},{"text":"Remove them from the event and protect the relationship privately.","effects":{"privacy":1,"coalition":1,"fatigue":-1,"day":1},"note":"The event gets smaller. The relationship may get stronger because you did not force the moment.","next":"second"}]},{"id":"second","speaker":"Coalition Desk","body":"Junie Bell watches the exchange. “Campaigns reveal what they think people are for.” The sentence lands harder than an endorsement would have.","choices":[{"text":"Build the event around shared speaking time.","effects":{"coalition":2,"message":1,"trust":1},"note":"The coalition becomes more visible and less controllable. That is part of the point."},{"text":"Keep the event candidate-led but change the language to credit the coalition work.","effects":{"message":2,"coalition":1},"note":"The event stays orderly, with a stronger acknowledgment of who built the room."},{"text":"Cancel the photo plan entirely and hold a smaller meeting.","effects":{"trust":2,"fatigue":-1,"press":-1},"note":"You trade public image for private confidence."}]}]},{"id":"government-institutional-limits","room":"government","title":"The System Does Not Become Yours","phase":"Governing Preview","day":16,"summary":"A quiet folder shows how winning would still leave you inside laws, agencies, committees, and people with their own goals.","stakes":["governing realism","authority limits","future depth"],"steps":[{"id":"open","speaker":"Mara Chen","body":"The governing map is not a ladder. It is a web: school board, superintendent, procurement office, state rules, parent groups, teacher contracts, transportation vendors. Mara taps the center. “Winning would put you here. It would not put you everywhere.”","choices":[{"text":"Ask which promises would require other institutions to cooperate.","effects":{"policy":2,"institution":2,"trust":1},"note":"The campaign learns which promises are honest and which ones only sound powerful.","next":"second"},{"text":"Ask which agencies can slow a good idea without opposing it publicly.","effects":{"research":2,"rules":1,"opposition":1},"note":"The map becomes a future source of tension, not a trophy case.","next":"second"},{"text":"Ask which relationships should be built before Election Day.","effects":{"coalition":2,"team":1,"policy":1},"note":"The campaign starts treating governing as preparation, not a prize screen.","next":"second"}]},{"id":"second","speaker":"Governing Map","body":"Daryl adds one warning: “The people who want you to promise the impossible may disappear when the invoice arrives.”","choices":[{"text":"Rewrite one promise so it names the first step instead of the whole outcome.","effects":{"message":2,"policy":2,"trust":1},"note":"The promise becomes less flashy and more durable."},{"text":"Keep the bigger promise but add a public condition.","effects":{"message":1,"policy":1,"scrutiny":1},"note":"The campaign chooses ambition with a visible caveat."},{"text":"Move this into the private notebook and avoid changing public language yet.","effects":{"privacy":1,"research":1,"attention":1},"note":"You delay the public shift while the campaign thinks harder."}]}]},{"id":"operations-first-board","room":"operations","title":"The Board That Makes the Room Breathe","phase":"Research & ID","day":1,"summary":"Mara turns a wall of open worries into a visible task board. The campaign does not get easier, but it becomes easier to hold.","stakes":["reduces overload","sets staff process","prevents invisible mistakes"],"steps":[{"id":"open","speaker":"Mara Chen","body":"Mara has taped three labels to the wall: Asked, Doing, Checked. “If everything lives in your head, the campaign becomes a haunted house. We need a place where tasks can sit without screaming.”","choices":[{"text":"Ask each room lead for one task that must be checked before it becomes public.","effects":{"team":2,"attention":1,"compliance":1},"next":"handoff","note":"The room gets quieter when unfinished work has a visible place to live."},{"text":"Start with only today’s tasks so the board does not become another overwhelming system.","effects":{"attention":2,"fatigue":-1,"discipline":1},"next":"handoff","note":"The board stays small enough to use today."},{"text":"Put every known issue on the board so nothing can hide in someone’s memory.","effects":{"research":2,"fatigue":1,"team":1},"next":"handoff","note":"The campaign sees more, but the room gets heavier."},{"text":"Ask Mara to own the board and bring you only the decisions that require you.","effects":{"delegation":2,"team":2,"attention":1},"next":"handoff","note":"Delegation works better when authority is clear."}]},{"id":"handoff","speaker":"Mara Chen","body":"Mara points to a blank card. “A good task card needs a goal, a boundary, an owner, and what finished looks like. Without that, we are just passing anxiety around.”","choices":[{"text":"Require every task card to include who owns it and what approval it needs.","effects":{"team":2,"compliance":2,"attention":1},"note":"The office gains a simple approval line. Staff can move without guessing where the edge is."},{"text":"Use short cards only: too much process will make people stop using it.","effects":{"fatigue":-1,"attention":2,"adaptability":1},"note":"The system stays light. It catches less detail, but people actually use it."},{"text":"Add a red mark for public-facing work that cannot leave without review.","effects":{"compliance":2,"message":1,"team":1},"note":"The campaign creates a safety net before speed becomes a liability."},{"text":"Ask each staffer to write their own card style and see what works.","effects":{"adaptability":2,"team":1,"research":1},"note":"The board becomes more organic, but it may take a few days to standardize."}]}]},{"id":"operations-approval-queue","room":"operations","title":"The Approval Queue","phase":"Research & ID","day":2,"summary":"Drafts pile up: a flyer, a social post, a donor email, and a parent-meeting note. The question is not whether people are working. It is what can safely leave the room.","stakes":["review discipline","message safety","staff trust"],"steps":[{"id":"open","speaker":"Daryl Okafor","body":"Daryl lays four drafts on the table. “Nothing here is a disaster. That is why it is dangerous. Close-to-right mistakes are the ones people approve when they are tired.”","choices":[{"text":"Review only the pieces that leave the campaign publicly today.","effects":{"attention":2,"fatigue":-1,"compliance":1},"next":"second","note":"The review queue stays tied to real risk instead of perfection."},{"text":"Have Daryl mark what is factual, what is persuasive, and what is unverified.","effects":{"compliance":2,"research":1,"team":1},"next":"second","note":"The drafts become easier to judge because the claims stop blending together."},{"text":"Ask the communications lead to approve tone while Daryl approves facts.","effects":{"team":2,"message":1,"compliance":1},"next":"second","note":"The work splits cleanly: voice in one lane, accuracy in another."},{"text":"Approve the flyer now and come back to the rest after the parent meeting.","effects":{"field":1,"attention":-1,"risk":1},"next":"second","note":"The campaign moves faster, but one unresolved draft starts following you around."}]},{"id":"second","speaker":"Mara Chen","body":"Mara watches your pen hover. “Approval is not a vibe. What are you actually checking for?”","choices":[{"text":"Check whether each draft has one clear purpose and no loose facts.","effects":{"message":2,"compliance":1,"attention":1},"note":"The campaign starts reviewing for clarity, not taste."},{"text":"Check whether the target audience would understand it without staff context.","effects":{"inclusion":2,"message":1,"empathy":1},"note":"The materials get less insider-coded and more voter-readable."},{"text":"Check whether a hostile reader could fairly twist it by removing context.","effects":{"press":1,"opposition":1,"compliance":1},"note":"The campaign does not become fearful, but it starts respecting how clips and quotes travel."},{"text":"Trust the team’s judgment and approve the drafts that feel campaign-ready.","effects":{"team":2,"fatigue":-1,"risk":1},"note":"The room feels trusted. It also learns that trust comes with responsibility."}]}]},{"id":"operations-delegated-delegation","room":"operations","title":"Delegated Delegation","phase":"Persuasion","day":5,"summary":"You do not have the energy to decide every small task. The team needs permission to identify useful work without turning you into a bottleneck.","stakes":["candidate pacing","staff autonomy","hidden workload"],"steps":[{"id":"open","speaker":"Luz Rivera","body":"Luz has a list of small useful tasks no one officially assigned: update the parent-contact sheet, verify two bus-route names, call back a volunteer, check one rumor. “Do you want us to ask every time, or do you want boundaries?”","choices":[{"text":"Give staff a clear rule: they can act when the task is low-risk, reversible, and documented.","effects":{"team":2,"attention":1,"fatigue":-1},"next":"second","note":"The campaign stops asking you to approve every harmless step."},{"text":"Ask staff to bring back three suggested tasks each morning and choose from those.","effects":{"research":1,"team":1,"discipline":1},"next":"second","note":"The team starts helping define the work instead of waiting for it."},{"text":"Keep approval with you for now because the campaign is still too young.","effects":{"compliance":1,"control":2,"fatigue":1},"next":"second","note":"The room understands the caution, but the candidate bottleneck remains."},{"text":"Let each room lead decide independently and compare results after two days.","effects":{"adaptability":2,"team":1,"risk":1},"next":"second","note":"The campaign experiments with autonomy. Some of it will be useful. Some of it will be noise."}]},{"id":"second","speaker":"Luz Rivera","body":"Luz writes your rule on a card. “Good. Now the part people forget: how do we know the task actually helped?”","choices":[{"text":"Require a one-line result note: done, blocked, or needs candidate decision.","effects":{"team":2,"attention":2,"discipline":1},"note":"The campaign gets a feedback loop without creating a new meeting."},{"text":"Ask only for blockers so staff do not waste time narrating routine work.","effects":{"fatigue":-1,"delegation":2,"team":1},"note":"The operation stays lighter, though some quiet wins may go unnoticed."},{"text":"Have the notebook record small task outcomes that later connect to bigger events.","effects":{"research":2,"attention":1,"team":1},"note":"Small work becomes part of the campaign memory instead of disappearing."},{"text":"Do nothing formal; the whole point is to reduce process.","effects":{"fatigue":-2,"team":1,"research":-1},"note":"The room gets relief, but some learning evaporates."}]}]},{"id":"operations-discoverable-office","room":"operations","title":"Make the Office Discoverable","phase":"Persuasion","day":6,"summary":"A capable volunteer loses thirty minutes looking for the latest message guide. The mistake is small, but it reveals a larger problem.","stakes":["findability","new staff support","avoidable friction"],"steps":[{"id":"open","speaker":"Volunteer Coordinator Nia Bell","body":"Nia holds up two versions of the same talking points. “People are trying to help, but they cannot tell which file is current. We are making good volunteers feel foolish.”","choices":[{"text":"Create a front-page campaign map: current message, voter targets, deadlines, and owners.","effects":{"team":2,"message":1,"attention":1},"next":"second","note":"The office becomes easier for new helpers to enter without asking five people for directions."},{"text":"Archive old materials immediately so only current versions remain visible.","effects":{"compliance":1,"discipline":2,"team":1},"next":"second","note":"The campaign reduces accidental drift between old and current language."},{"text":"Ask Nia to build the map from a volunteer’s perspective, not a manager’s perspective.","effects":{"inclusion":2,"team":1,"empathy":1},"next":"second","note":"The system starts serving the people who actually need to use it."},{"text":"Keep materials centralized with Mara and have volunteers request what they need.","effects":{"control":2,"compliance":1,"fatigue":1},"next":"second","note":"The files are safer, but the bottleneck gets heavier."}]},{"id":"second","speaker":"Nia Bell","body":"Nia nods toward a new volunteer at the door. “They should not need a private tour of our chaos. What should they understand in five minutes?”","choices":[{"text":"What the campaign is trying to win, what today needs, and who to ask before acting publicly.","effects":{"team":2,"attention":1,"compliance":1},"note":"The campaign gains an onboarding shape that protects both volunteers and voters."},{"text":"The campaign’s core message and which voters should hear it first.","effects":{"message":2,"field":1,"team":1},"note":"New helpers begin with the public purpose, not the internal maze."},{"text":"The people map: who has trust, who needs care, and which relationships are sensitive.","effects":{"coalition":2,"research":1,"empathy":1},"note":"The office remembers that politics is not just tasks; it is relationships under pressure."},{"text":"Only their assigned job. Too much context can create accidental freelancing.","effects":{"discipline":2,"risk":-1,"team":-1},"note":"The campaign becomes safer, but some helpers feel less trusted."}]}]},{"id":"operations-test-before-public","room":"operations","title":"Test It Before It Touches Voters","phase":"Persuasion","day":8,"summary":"A sign-up form, a message script, and a meeting handout are all ready. Ready is not the same as tested.","stakes":["quality loop","accessibility","public trust"],"steps":[{"id":"open","speaker":"Daryl Okafor","body":"Daryl points at the sign-up form. “It works for us because we already know what it means. That is not a test.”","choices":[{"text":"Have someone outside the campaign try the form and say where they get stuck.","effects":{"inclusion":2,"trust":1,"research":1},"next":"second","note":"The campaign tests with a real person instead of staff assumptions."},{"text":"Run through the script with a skeptical voter in mind, not a friendly supporter.","effects":{"message":2,"opposition":1,"attention":1},"next":"second","note":"The script learns to survive contact with the room."},{"text":"Check the handout for dates, names, and promises that require proof.","effects":{"compliance":2,"rules":1,"message":1},"next":"second","note":"The campaign catches the kind of small error that can become a public story."},{"text":"Send the materials now and fix issues only if people complain.","effects":{"field":1,"risk":2,"attention":-1},"next":"second","note":"Speed wins the hour, but the campaign borrows risk from tomorrow."}]},{"id":"second","speaker":"Daryl Okafor","body":"The first test finds an unclear deadline and a phone number missing from one page. Daryl exhales. “This is why we check before the world checks for us.”","choices":[{"text":"Fix the materials and add a small checklist for future public items.","effects":{"compliance":2,"team":1,"attention":1},"note":"The campaign gains a quiet quality loop. It is not glamorous. It prevents pain."},{"text":"Thank the tester and ask what they expected to see but did not.","effects":{"empathy":2,"inclusion":1,"research":1},"note":"The test becomes a conversation instead of a pass-fail ritual."},{"text":"Ask why the staff missed it so the system improves instead of blaming a person.","effects":{"team":2,"attention":1,"discipline":1},"note":"The room learns to fix causes, not only errors."},{"text":"Keep the checklist informal so the campaign does not turn into paperwork.","effects":{"fatigue":-1,"adaptability":1,"risk":1},"note":"The process stays light, but future fixes depend on memory."}]}]},{"id":"operations-ask-versus-act","room":"operations","title":"Ask Mode, Act Mode","phase":"Persuasion","day":10,"summary":"Staff need to know when you want information and when you want them to move. Confusing the two costs time and trust.","stakes":["clear delegation","candidate boundaries","decision speed"],"steps":[{"id":"open","speaker":"Mara Chen","body":"Mara draws two boxes: Ask and Act. “Sometimes you need an answer. Sometimes you need someone to do the work. If we cannot tell which mode you mean, everyone waits.”","choices":[{"text":"Create an Ask lane for brief answers and an Act lane for approved tasks.","effects":{"team":2,"attention":2,"discipline":1},"next":"second","note":"The campaign separates information requests from work orders."},{"text":"Use Act mode only for low-risk tasks until the team earns more authority.","effects":{"compliance":2,"team":1,"risk":-1},"next":"second","note":"The team can move, but within a safe fence."},{"text":"Ask staff to challenge you when a request is too vague to execute.","effects":{"team":2,"empathy":1,"attention":1},"next":"second","note":"The room gets permission to prevent confusion before it becomes resentment."},{"text":"Keep everything conversational and avoid naming modes.","effects":{"fatigue":-1,"adaptability":1,"team":-1},"next":"second","note":"The office feels less rigid, but it will still depend on everyone guessing correctly."}]},{"id":"second","speaker":"Mara Chen","body":"A reporter asks for a response while a volunteer needs the walk-sheet updated. Mara looks at you. “One is an answer. One is a task. Which one do you personally need to hold?”","choices":[{"text":"Hold the reporter response and delegate the walk-sheet update.","effects":{"press":2,"field":1,"team":1},"note":"You stay close to public risk while field work keeps moving."},{"text":"Delegate both with clear boundaries and review only the public response before it goes out.","effects":{"team":2,"fatigue":-1,"compliance":1},"note":"The team carries more, and your approval stays where it matters most."},{"text":"Hold both because the day is too sensitive for crossed wires.","effects":{"control":2,"fatigue":2,"compliance":1},"note":"The campaign avoids delegation risk but burns candidate bandwidth."},{"text":"Ask what happens if each waits one hour before deciding.","effects":{"attention":2,"research":1,"patience":1},"note":"The campaign learns that urgency should be tested, not worshiped."}]}]},{"id":"operations-feedback-loop","room":"operations","title":"Feedback Is a Gift Until It Becomes Noise","phase":"Persuasion","day":12,"summary":"Supporters send a flood of notes after a public event. Some are useful. Some are reactions. Some are attempts to steer you.","stakes":["feedback triage","message improvement","avoid overload"],"steps":[{"id":"open","speaker":"Owen Ibarra","body":"Owen has sorted the notes into three piles: confusion, disagreement, and praise. “The praise feels best. The confusion is probably where the work is.”","choices":[{"text":"Read the confusion pile first and look for repeated wording problems.","effects":{"message":2,"attention":1,"research":1},"next":"second","note":"The campaign treats confusion as information, not insult."},{"text":"Read disagreement first to understand what your message is failing to answer.","effects":{"policy":2,"opposition":1,"message":1},"next":"second","note":"The campaign gets sharper because it listens where the room pushes back."},{"text":"Ask Owen to summarize patterns so you do not absorb every comment raw.","effects":{"delegation":2,"fatigue":-1,"attention":1},"next":"second","note":"You get the signal without carrying the whole pile."},{"text":"Read praise first because the team needs to know what is working.","effects":{"team":2,"fatigue":-1,"trust":1},"next":"second","note":"The room gets a morale lift before returning to the hard notes."}]},{"id":"second","speaker":"Owen Ibarra","body":"Owen points to one repeated phrase: people liked the idea, but not the way the campaign explained who pays for it. “That is not a scandal. It is a fixable gap.”","choices":[{"text":"Rewrite the answer in plain language before the next door shift.","effects":{"message":2,"field":1,"policy":1},"note":"The campaign improves because feedback changed the next voter conversation."},{"text":"Ask the finance desk whether the answer needs a rules check before repeating it.","effects":{"compliance":2,"policy":1,"attention":1},"note":"The improved answer will be slower, but safer."},{"text":"Add the issue to debate prep and leave the door script alone for now.","effects":{"press":1,"message":1,"field":-1},"note":"The campaign prepares for public scrutiny but misses an immediate field improvement."},{"text":"Do nothing yet; one event is not enough evidence to rewrite the message.","effects":{"discipline":1,"research":1,"adaptability":-1},"note":"The campaign avoids overreacting, but the same confusion may repeat."}]}]},{"id":"operations-nightly-save","room":"operations","title":"The Nightly Save","phase":"GOTV","day":19,"summary":"The campaign is moving fast enough that a lost note, wrong list, or half-remembered decision could damage the final stretch.","stakes":["GOTV reliability","memory protection","closing loops"],"steps":[{"id":"open","speaker":"Mara Chen","body":"The office is tired. Mara taps the task board. “Before anyone goes home, we need to know what changed today, what is still open, and what tomorrow must not forget.”","choices":[{"text":"Close the day with a three-item record: changed, open, tomorrow.","effects":{"attention":2,"team":2,"fatigue":-1},"next":"second","note":"The campaign creates a memory that does not depend on tired brains."},{"text":"Ask each room lead for only blockers and Election Day risks.","effects":{"compliance":2,"field":1,"fatigue":-1},"next":"second","note":"The end-of-day check stays focused on what can still hurt the campaign."},{"text":"Skip the formal review and let staff rest before GOTV gets heavier.","effects":{"fatigue":-2,"team":1,"attention":-1},"next":"second","note":"The room gets needed rest, but some open loops remain untagged."},{"text":"Stay late yourself and personally review every active file.","effects":{"control":2,"compliance":1,"fatigue":2},"next":"second","note":"You catch detail at the cost of becoming the campaign’s fragile backup system."}]},{"id":"second","speaker":"Mara Chen","body":"One open loop appears: a supporter promised rides for older voters but never confirmed times. It is small enough to miss and large enough to matter.","choices":[{"text":"Assign one person to confirm the rides before noon tomorrow.","effects":{"field":2,"inclusion":1,"team":1},"note":"The campaign turns a vague promise into an actual GOTV task."},{"text":"Call the supporter yourself because the relationship is sensitive.","effects":{"coalition":2,"fatigue":1,"trust":1},"note":"The relationship is protected, but the candidate carries one more thing personally."},{"text":"Build a ride-check list so this does not happen again.","effects":{"field":1,"compliance":1,"attention":2},"note":"The campaign fixes the immediate issue and the process behind it."},{"text":"Leave it for morning; nothing useful will happen while everyone is exhausted.","effects":{"fatigue":-1,"field":-1,"attention":1},"note":"Rest protects judgment, but the ride problem remains alive overnight."}]}]},{"id":"operations-transition-file","room":"operations","title":"The Transition File You Are Not Supposed to See Yet","phase":"Governing Preview","day":17,"summary":"A quiet folder shows what campaign promises become after Election Day: owners, constraints, handoffs, agencies, meetings, and records.","stakes":["future governing depth","institutional memory","no visible ladder"],"steps":[{"id":"open","speaker":"Daryl Okafor","body":"Daryl has made a folder labeled If We Win. “Not a victory speech. A handoff file. Campaigns talk like a person can fix everything. Governments run on owners, records, timelines, and constraints.”","choices":[{"text":"Map each major promise to the institution that would actually have to move.","effects":{"policy":2,"rules":1,"research":1},"next":"second","note":"The campaign starts treating governing as a web, not a throne."},{"text":"List the records you would need on day one before making any public promise stronger.","effects":{"compliance":2,"research":1,"attention":1},"next":"second","note":"The future office begins as information discipline, not fantasy power."},{"text":"Ask which promises should remain campaign values rather than immediate commitments.","effects":{"message":1,"policy":2,"trust":1},"next":"second","note":"The campaign learns to separate direction from overpromising."},{"text":"Close the folder. Winning is not guaranteed, and the campaign needs today’s work.","effects":{"attention":2,"fatigue":-1,"policy":-1},"next":"second","note":"The campaign avoids future-loading the day, but the governing question waits."}]},{"id":"second","speaker":"Daryl Okafor","body":"The folder reveals a simple truth: a promise with no owner becomes a speech. A promise with an owner becomes work.","choices":[{"text":"Attach one owner and one first question to each major promise.","effects":{"team":2,"policy":1,"rules":1},"note":"Future governing gets a practical shadow without spoiling the hidden web."},{"text":"Ask which promises could be blocked by money, law, or existing contracts.","effects":{"research":2,"compliance":1,"policy":1},"note":"The campaign begins seeing obstacles before they become betrayals."},{"text":"Keep the folder private so the campaign does not look arrogant.","effects":{"privacy":1,"cunning":1,"scrutiny":-1},"note":"The future stays quiet. That protects you, but also limits who can help prepare."},{"text":"Use one careful line in public: promises need plans, not slogans.","effects":{"message":2,"trust":1,"press":1},"note":"The campaign signals seriousness without showing the machinery."}]}]}],"ENDING_TEXT":{"win-clean":"You win narrowly, and the strongest part is not the headline. The count is accepted, the rules held, and the people who helped you can see how the campaign might become actual public work.","win-messy":"You win, but the victory carries unresolved weight: a bruised coalition partner, a compliance question, a late rumor, or a promise that will be harder to govern than it was to say. Office begins before the room feels ready.","loss-strong":"You lose, but the campaign leaves behind voter knowledge, trained volunteers, clearer public relationships, and a notebook full of decisions that could still matter. The ward knows you as more than a name on a ballot.","loss-collapse":"You lose and the room empties quickly. The campaign confused attention for support, skipped too many boring systems, and learned too late that politics punishes vague hope and unmanaged time."},"MANUAL_SOURCES":[{"source":"DFID/FCO Elections and Electoral Process: legitimacy, legal framework, election authority, boundaries, voter registration, voter education, media, observers, equipment, post-election confidence.","usedFor":"Previously integrated campaign manual source."},{"source":"NDI Campaign Skills Handbook: democratic actors, leadership styles, research/strategy/targeting, voter contact/GOTV planning, policy development, message, communications, planning, resources, list placement.","usedFor":"Previously integrated campaign manual source."},{"source":"Alfred Mozer Becoming a Better Politician: strategy, research, central message, target groups, media discipline, organization, campaign calendar, funding, volunteers, meetings, negotiation, opposition and crisis management.","usedFor":"Previously integrated campaign manual source."},{"source":"Emerging Technology Policy Careers campaign guide: modern campaign role structure, staff specialization, campaign committee dynamics, stressful campaign work, transition/team pipeline framing.","usedFor":"Previously integrated campaign manual source."},{"source":"Afghanistan Campaign Planning Manual: step-by-step research, vote goal, targeting, message, voter contact, forms, phone bank supervision, finite resources, proactive vs reactive campaign.","usedFor":"Previously integrated campaign manual source."},{"source":"GOVMAN 2025 XML: kept as institutional/future-governance reference, not as visible rank ladder or clutter in the school-board campaign.","usedFor":"Previously integrated campaign manual source."},{"source":"The Art of Computer Game Design","usedFor":"Representation, interaction, conflict, safety, player fantasy, and designs that react instead of merely reporting."},{"source":"Developing a Text-Based Game with Modern Tools","usedFor":"Text-game UI structure, choice buttons, modern web tools, narrative mechanics, location/event management, and iteration/QA."},{"source":"Making Games with Python & Pygame","usedFor":"Event handling loop, state updates, feedback drawing, animation principles, and robust buttons."},{"source":"50 Years of Text Games sample","usedFor":"Text games as excerpt-worthy narrative systems, resource management, parser/hypertext traditions, transcripts, and direct interaction with words."},{"source":"Source reset inventory, 2026-06-30","usedFor":"All uploaded PDFs and the GOVMAN XML were checked as present in the sandbox; the PDFs were page-counted and text-extracted into a source audit folder before this pass."},{"source":"Campaign Plan Template","usedFor":"Coalition roles, steering/general members, youth leaders, primary and secondary targets, and communications material/action-step logic."},{"source":"Campaign Planning Guide","usedFor":"Real numbers, work-backward calendar pressure, voter contact phases, Tully Box, fundraising plan, and finite resources."},{"source":"Norwich campaign operations article","usedFor":"Campaign staff roles, communications calendar, finance/compliance responsibilities, slogan/message discipline, and role-specific decision pressure."},{"source":"GOVMAN 2025 XML","usedFor":"Hidden institutional ecosystem reference: the governing map can grow without exposing a visible rank ladder."},{"title":"Artificial Intelligence for Games","use":"Simple, visible behavior beats hidden complexity; campaign actors now use lightweight state/goal/pulse logic instead of opaque stat math."},{"title":"AI Game Programming Wisdom","use":"Opposition and ward events now aim for the illusion of intelligence: predictable enough to read, surprising enough to feel alive."},{"title":"Artificial Intelligence Usage in Game Development","use":"Player profiling, adaptive flow, analytics, and ethical AI ideas became campaign-memory and pressure systems rather than visible AI labels."},{"id":"mostly-serious-agent-workflow","title":"Mostly Serious guide to Claude Code/Codex for nontechnical people","use":"Translated into Operations Desk: task cards, approval safety, plain-language work orders, visual-review mindset, and turning rambling feedback into usable work."},{"id":"latent-codex-missing-manual","title":"Latent.Space Codex missing manual","use":"Translated into discoverable campaign structure, operating instructions, parallel delegation, short review notes, checks/tests, and human-in-the-loop approval."}],"AGENCY_SAMPLE":["Congress","The Senate","J.D. Vance","Charles Grassley","Charles E. Schumer","A. Mitchell McConnell","Barry C. Black","Elizabeth C. MacDonough","Gary B. Myrick","Robert M. Duncan"],"ROOM_TEXTURE":{"plan":["The calendar ticks loudly even when nobody mentions it.","The whiteboard has fewer answers than questions, which is finally starting to feel useful."],"field":["Pins on the map are not votes. They are promises to follow up.","A volunteer has written a door note in the margin because the form had no good box for it.","The map is starting to behave like a living influence map: support, uncertainty, access, and rumor move on different layers."],"message":["A good line survives being repeated by someone tired.","The best draft on the desk is the shortest one."],"coalition":["Nobody here wants to be treated as a prop.","Trust moves slowly until it suddenly does not."],"press":["The headline space is smaller than the truth.","The room feels calm until a notification sound changes everyone’s posture.","A clip can move faster than a full explanation. The question is whether answering helps people understand or helps the clip travel."],"finance":["Receipts are boring until they become the story.","Every donor call has a second conversation hiding underneath it."],"rules":["The deadline is not angry. It simply exists.","A clean form can be a political act when everyone expects sloppiness."],"candidate":["The quietest room may be the most strategic one.","Your private energy is now a public resource, which is unfair and still true.","Rest is not a reward for finishing the campaign. It is part of keeping the campaign honest."],"briefing":["A brief is not the whole truth. It is what reached the table in time.","Unread folders feel heavier than read ones because they can still surprise you.","The brief is a filter, not a full newspaper. What you choose to read changes what you notice later."],"government":["The institutional map is too large to be a roadmap and too useful to ignore.","A promise feels different when placed next to the office that can actually carry it."],"opposition":["The board is not about hating the opponent. It is about understanding what they are trying to make inevitable.","Sal has two columns: what Rusk keeps doing, and what Rusk thinks you keep doing.","A good counter-move does not have to be clever. It has to make the other side spend time in the wrong place.","The danger here is seeing patterns everywhere. The useful work is knowing which pattern deserves a response."],"operations":["The task board has three columns: asked, doing, checked. It is calmer than the room around it.","A volunteer has written a useful note in the wrong place. The problem is not effort; it is findability.","Two staffers are solving the same issue from different directions. Someone needs to decide whether that is useful or wasteful.","The campaign can move faster today if the instructions are narrower than the anxiety.","A stack of draft materials waits for approval. Most of them are close. Close is not the same as safe."]},"WORLD_PULSES":[{"id":"low-research-press","test":{"research_lt":34,"press_gt":35},"text":"A local thread fills in missing facts with confident guesses. Your press attention is high enough for the guesses to travel.","effects":{"scrutiny":1}},{"id":"strong-field-note","test":{"field_gt":38},"text":"A volunteer brings in a door note that connects two precincts you had treated as separate.","effects":{"research":1}},{"id":"fatigue-slip","test":{"fatigue_gt":46},"text":"Staff quietly shortens your next prep memo because the room can tell you are absorbing less than usual.","effects":{"team":-1}},{"id":"compliance-confidence","test":{"compliance_gt":55},"text":"The filing folder is clean enough that Daryl starts catching small problems before they become public problems.","effects":{"rules":1}},{"id":"coalition-whisper","test":{"coalition_gt":38},"text":"A civic leader who has not endorsed you starts correcting misinformation in rooms where you are not present.","effects":{"trust":1}},{"id":"message-travel","test":{"message_gt":44},"text":"A volunteer repeats your message in their own words at a door, and th
